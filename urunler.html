<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün / Meslek Vergi Sorgulama — PDaaS</title>
<style>
  :root{
    --bg:#f7f8fb; --sidebar:#ffffff; --panel:#ffffff;
    --ink:#111827; --muted:#6b7280; --soft:#9ca3af;
    --line:#e8ebf0; --line-2:#f1f3f7;
    --accent:#4f46e5; --accent-2:#6366f1; --accent-soft:#eef2ff;
    --ok:#059669; --ok-soft:#ecfdf5;
    --bad:#dc2626; --bad-soft:#fef2f2;
    --amber:#d97706; --amber-soft:#fffbeb;
    --r:14px; --r-s:9px;
    --gölge:0 1px 2px rgba(17,24,39,.04), 0 8px 24px -16px rgba(17,24,39,.15);
    --mono:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0f1a; --sidebar:#111726; --panel:#111726;
      --ink:#e8ecf5; --muted:#8b95a9; --soft:#5f6b80;
      --line:#1e2639; --line-2:#161d2e;
      --accent:#818cf8; --accent-2:#a5b4fc; --accent-soft:#1c2340;
      --ok:#34d399; --ok-soft:#0d2a23;
      --bad:#f87171; --bad-soft:#2a1215;
      --amber:#fbbf24; --amber-soft:#2a2010;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  code,pre,.mono{font-family:var(--mono);font-size:.86em}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

  /* ÜST BAR */
  .ust{
    height:60px;background:var(--sidebar);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 20px;gap:14px;
    position:sticky;top:0;z-index:50;
  }
  .logo{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:.95rem;
  }
  .marka b{font-size:.98rem;font-weight:700;letter-spacing:-.01em;line-height:1.1;display:block}
  .marka small{font-size:.72rem;color:var(--muted);font-weight:500}

  /* ANA YERLEŞİM */
  .kap{max-width:1100px;margin:0 auto;padding:32px 24px 80px}

  /* ARAMA KUTUSU */
  .arama-kap{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:20px;margin-bottom:24px;
    box-shadow:var(--gölge);
    position:sticky;top:72px;z-index:40;
  }
  .arama-satir{display:flex;gap:10px;align-items:center}
  .arama-ikon{
    width:44px;height:44px;flex:none;border-radius:10px;
    background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-size:1.1rem;
  }
  .arama-input{
    flex:1;height:44px;padding:0 16px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--bg);
    font-size:1rem;color:var(--ink);transition:.15s;
  }
  .arama-input:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}

  .filtreler{
    display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--line-2);
  }
  .cip{
    padding:6px 14px;border-radius:999px;
    background:var(--line-2);color:var(--muted);
    font-size:.82rem;font-weight:600;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .cip:hover{background:var(--line);color:var(--ink)}
  .cip.aktif{background:var(--accent);color:#fff}
  .cip .sayi{
    background:rgba(255,255,255,.2);padding:1px 7px;
    border-radius:999px;font-size:.7rem;
  }
  .cip:not(.aktif) .sayi{background:var(--line);color:var(--soft)}

  /* SONUÇ LİSTESİ */
  .sonuc-liste{display:flex;flex-direction:column;gap:8px}
  .sonuc-satir{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r-s);padding:14px 18px;
    display:flex;align-items:flex-start;gap:14px;
    cursor:pointer;transition:.15s;
  }
  .sonuc-satir:hover{border-color:var(--accent);background:var(--accent-soft)}
  .sonuc-satir.aktif{border-color:var(--accent);background:var(--accent-soft)}

  .kaynak-etiket{
    flex:none;font-size:.7rem;font-weight:800;letter-spacing:.04em;
    padding:3px 9px;border-radius:6px;text-transform:uppercase;
    margin-top:2px;
  }
  .kaynak-gtip{background:#dbeafe;color:#1e40af}
  .kaynak-isco{background:#fce7f3;color:#9d174d}
  .kaynak-cpc{background:#fef3c7;color:#92400e}
  .kaynak-nace{background:#d1fae5;color:#065f46}
  @media (prefers-color-scheme:dark){
    .kaynak-gtip{background:#1e3a8a55;color:#93c5fd}
    .kaynak-isco{background:#83184355;color:#f9a8d4}
    .kaynak-cpc{background:#78350f55;color:#fcd34d}
    .kaynak-nace{background:#064e3b55;color:#6ee7b7}
  }

  .sonuc-metin{flex:1;min-width:0}
  .sonuc-metin b{font-size:.92rem;font-weight:650;line-height:1.3;display:block;margin-bottom:3px}
  .sonuc-metin code{
    font-size:.78rem;color:var(--muted);
    background:var(--line-2);padding:1px 7px;border-radius:5px;
  }
  .sonuc-metin .aciklama{
    font-size:.82rem;color:var(--muted);
    margin-top:6px;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }

  .mini-rozet{
    flex:none;display:flex;gap:5px;margin-top:2px;
  }
  .mini-rozet span{
    font-size:.68rem;font-weight:700;padding:3px 8px;
    border-radius:6px;white-space:nowrap;
  }
  .mr-kdv{background:var(--accent-soft);color:var(--accent)}
  .mr-otv{background:var(--amber-soft);color:var(--amber)}
  .mr-kdv.sifir{background:var(--ok-soft);color:var(--ok)}

  /* SEÇİLİ DETAY */
  .detay-kap{
    margin-top:32px;
    animation:belir .25s ease;
  }
  @keyframes belir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .detay-ust{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;gap:16px;flex-wrap:wrap;
  }
  .detay-ust h2{
    font-size:1.4rem;font-weight:750;letter-spacing:-.02em;
    line-height:1.25;
  }
  .detay-ust .kod{
    font-family:var(--mono);font-size:1.05rem;font-weight:700;
    color:var(--accent);background:var(--accent-soft);
    padding:3px 12px;border-radius:8px;
  }
  .kapat-btn{
    width:34px;height:34px;border-radius:9px;
    background:var(--line-2);color:var(--muted);
    display:grid;place-items:center;font-size:.9rem;
  }
  .kapat-btn:hover{background:var(--bad-soft);color:var(--bad)}

  /* VERGİ KARTLARI */
  .vergi-ızgarası{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    margin-bottom:22px;
  }
  @media (max-width:640px){.vergi-ızgarası{grid-template-columns:1fr}}

  .vergi-kart{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;
    box-shadow:var(--gölge);
  }
  .vergi-kart.kdv{border-left:4px solid var(--accent)}
  .vergi-kart.otv{border-left:4px solid var(--amber)}
  .vergi-kart.kdv.istisna{border-left-color:var(--ok)}
  .vergi-kart.yok{border-left-color:var(--soft);opacity:.7}

  .vk-baslik{
    font-size:.75rem;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .vk-oran{
    font-size:2rem;font-weight:800;letter-spacing:-.03em;
    line-height:1;margin-bottom:6px;
  }
  .vk-oran.accent{color:var(--accent)}
  .vk-oran.amber{color:var(--amber)}
  .vk-oran.ok{color:var(--ok)}
  .vk-oran.muted{color:var(--soft);font-size:1.4rem}
  .vk-ad{font-size:.88rem;color:var(--muted);line-height:1.5}
  .vk-ad strong{color:var(--ink)}

  .vk-detay{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);
    font-size:.82rem;color:var(--muted);line-height:1.6;
  }

  /* GEREKÇE */
  .gerekce-kart{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:20px 22px;margin-bottom:22px;
    box-shadow:var(--gölge);
  }
  .gerekce-kart h3{
    font-size:.88rem;font-weight:750;text-transform:uppercase;
    letter-spacing:.04em;color:var(--accent);margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .gerekce-kart ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .gerekce-kart li{
    font-size:.9rem;line-height:1.55;padding-left:24px;position:relative;
    color:var(--ink);
  }
  .gerekce-kart li::before{
    content:'▸';position:absolute;left:6px;color:var(--accent);font-weight:700;
  }
  .gerekce-kart li small{
    display:block;color:var(--muted);font-size:.8rem;margin-top:2px;
  }

  /* GÜVEN */
  .guven-kart{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:16px 20px;
    display:flex;align-items:center;gap:16px;
    box-shadow:var(--gölge);margin-bottom:22px;
  }
  .guven-baslik{
    font-size:.78rem;font-weight:800;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);flex:none;
  }
  .guven-bar{
    flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;
  }
  .guven-dolgu{
    height:100%;border-radius:4px;
    background:linear-gradient(90deg,var(--amber),var(--ok));
    transition:width .4s;
  }
  .guven-sayi{font-size:1.05rem;font-weight:800;flex:none;color:var(--ok)}

  /* BOŞ DURUM */
  .bos-durum{
    text-align:center;padding:60px 20px;color:var(--muted);
  }
  .bos-durum .ikon{
    width:80px;height:80px;border-radius:22px;
    background:var(--accent-soft);color:var(--accent);
    display:inline-grid;place-items:center;font-size:2.2rem;
    margin-bottom:22px;
  }
  .bos-durum h3{
    font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:8px;
  }
  .bos-durum p{max-width:52ch;margin:0 auto;font-size:.92rem}

  /* YARDIMCI */
  .yardim{
    font-size:.82rem;color:var(--soft);margin-top:8px;
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .yardim code{
    background:var(--line-2);padding:2px 7px;border-radius:5px;
    cursor:pointer;color:var(--muted);transition:.15s;
  }
  .yardim code:hover{background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>

<header class="ust">
  <span class="logo">P</span>
  <div class="marka">
    <b>PDaaS · Ürün &amp; Meslek Vergi Sorgu</b>
    <small>GTİP · ISCO · CPC · NACE → KDV &amp; ÖTV</small>
  </div>
</header>

<div class="kap">

  <!-- ARAMA -->
  <div class="arama-kap">
    <div class="arama-satir">
      <div class="arama-ikon">🔍</div>
      <input
        type="text"
        id="arama"
        class="arama-input"
        placeholder="Ürün adı, GTİP, ISCO, CPC veya NACE kodu yazın… (örn: gömlek, 6105, 5120, 26, 01)"
        autocomplete="off"
        autofocus
      >
    </div>
    <div class="filtreler" id="filtreler">
      <button class="cip aktif" data-tip="hepsi">Tümü <span class="sayi" id="sayi-hepsi">0</span></button>
      <button class="cip" data-tip="gtip">GTİP <span class="sayi" id="sayi-gtip">0</span></button>
      <button class="cip" data-tip="isco">ISCO <span class="sayi" id="sayi-isco">0</span></button>
      <button class="cip" data-tip="cpc">CPC <span class="sayi" id="sayi-cpc">0</span></button>
      <button class="cip" data-tip="nace">NACE <span class="sayi" id="sayi-nace">0</span></button>
    </div>
    <div class="yardim">
      Örnek aramalar:
      <code data-ornek="gömlek">gömlek</code>
      <code data-ornek="6105">6105</code>
      <code data-ornek="5120">5120</code>
      <code data-ornek="otobüs">otobüs</code>
      <code data-ornek="6111">6111</code>
      <code data-ornek="01.11">01.11</code>
    </div>
  </div>

  <!-- SONUÇ LİSTESİ -->
  <div id="sonuc-alani">
    <div class="bos-durum">
      <div class="ikon">🏷️</div>
      <h3>Aramaya başlayın</h3>
      <p>Ürün adı, GTİP, ISCO (meslek), CPC veya NACE kodu yazın. Eşleşen kayıtlar listelenir; birine tıklayınca KDV ve ÖTV oranları otomatik hesaplanır.</p>
    </div>
  </div>

  <!-- DETAY -->
  <div class="detay-kap" id="detay-kap" style="display:none"></div>

</div>

<script>
// =================================================================
// 0. VERİ DEPOSU
// =================================================================
const VERI = {
  gtip: { kayitlar: [], yuklendi: false },
  isco: { kayitlar: [], yuklendi: false },
  cpc:  { kayitlar: [], yuklendi: false },
  nace: { kayitlar: [], yuklendi: false }
};
let KDV_DATA = null;
let OTV_DATA = null;
let KOD_INTEG = null;
let AKTIF_FILTRE = 'hepsi';
let AKTIF_KAYIT = null;

// =================================================================
// 1. YARDIMCILAR
// =================================================================
const $ = id => document.getElementById(id);
const kacis = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));
const tr_lower = s => String(s ?? '').toLocaleLowerCase('tr-TR');
const sayi = n => (n == null ? '—' : Number(n).toLocaleString('tr-TR'));

// Kod normalizasyonu: "01.11.07" → "011107", "6105.10.00" → "6105.10.00"
function normKod(k){
  return String(k ?? '').trim().replace(/\s+/g,'');
}
function kodTemiz(k){
  return normKod(k).replace(/\./g,'');
}

// =================================================================
// 2. VERİ YÜKLE
// =================================================================
async function dosyaYukle(yol){
  try{
    const r = await fetch(yol, { headers:{Accept:'application/json'} });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

async function tumVeriYukle(){
  const [gtip, isco, cpc, nace, kdv, otv, integ] = await Promise.all([
    dosyaYukle('/api/v1/gtip-kodlari'),
    dosyaYukle('/api/v1/isco-kodlari'),
    dosyaYukle('/api/v1/cpc-kodlari'),
    dosyaYukle('/api/v1/nace-kodlari'),
    dosyaYukle('/api/v1/kdv-oranlari'),
    dosyaYukle('/api/v1/otv-oranlari'),
    dosyaYukle('/api/v1/kod-entegrasyon')
  ]);

  if(gtip?.kayitlar){ VERI.gtip.kayitlar = gtip.kayitlar; VERI.gtip.yuklendi = true; }
  if(isco?.kayitlar){ VERI.isco.kayitlar = isco.kayitlar; VERI.isco.yuklendi = true; }
  if(cpc?.kayitlar){  VERI.cpc.kayitlar  = cpc.kayitlar;  VERI.cpc.yuklendi  = true; }
  if(nace?.kayitlar){ VERI.nace.kayitlar = nace.kayitlar; VERI.nace.yuklendi = true; }
  KDV_DATA = kdv;
  OTV_DATA = otv;
  KOD_INTEG = integ;

  sayilariGuncelle();
}

function sayilariGuncelle(){
  const toplam = (v)=> v.kayitlar.length;
  $('sayi-hepsi').textContent = sayi(toplam(VERI.gtip)+toplam(VERI.isco)+toplam(VERI.cpc)+toplam(VERI.nace));
  $('sayi-gtip').textContent  = sayi(toplam(VERI.gtip));
  $('sayi-isco').textContent  = sayi(toplam(VERI.isco));
  $('sayi-cpc').textContent   = sayi(toplam(VERI.cpc));
  $('sayi-nace').textContent  = sayi(toplam(VERI.nace));
}

// =================================================================
// 3. ARAMA MOTORU
// =================================================================
function kaynaklariTara(q, filtre){
  if(!q || q.length < 1) return [];
  const sorgu = tr_lower(q);
  const sorguTemiz = sorgu.replace(/\./g,'').replace(/\s/g,'');
  const sonuclar = [];

  const kaynaklar = [];
  if(filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
  if(filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
  if(filtre === 'hepsi' || filtre === 'cpc')  kaynaklar.push(['cpc',  VERI.cpc]);
  if(filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

  for(const [kaynakTip, veri] of kaynaklar){
    for(const k of veri.kayitlar){
      const kod = normKod(k.kod);
      const kodT = kodTemiz(kod);
      const ad  = tr_lower(k.tanim_tr || k.ad || '');
      const ad2 = tr_lower(k.tanim_en || '');
      const seviye = tr_lower(k.seviye_adi || '');

      let skor = 0;
      if(kod === q || kodT === sorguTemiz) skor = 100;              // Tam eşleşme
      else if(kod.startsWith(q)) skor = 90;                          // Kod başlangıç
      else if(kodT.startsWith(sorguTemiz)) skor = 85;
      else if(ad.startsWith(sorgu)) skor = 70;                       // Ad başlangıç
      else if(ad.includes(sorgu)) skor = 50;                        // Ad içinde
      else if(ad2.includes(sorgu)) skor = 30;                       // İngilizce ad
      else if(seviye.includes(sorgu)) skor = 20;
      else if(kod.includes(q)) skor = 40;

      if(skor > 0){
        sonuclar.push({ kaynak:kaynakTip, kayit:k, skor });
      }
    }
  }

  // Skora göre sırala; eşit skorda kod kısası önce
  sonuclar.sort((a,b) => {
    if(b.skor !== a.skor) return b.skor - a.skor;
    const ka = normKod(a.kayit.kod).length;
    const kb = normKod(b.kayit.kod).length;
    return ka - kb;
  });

  return sonuclar.slice(0, 40);
}

// =================================================================
// 4. KDV & ÖTV KARAR MOTORU
// =================================================================
function kdvBul(gtipKod, cpcKod, naceKod, iscoKod, urunAdi, islemTipi){
  // 1) İstisnalar
  if(islemTipi === 'ihracat'){
    return { kod:'KDV-00', oran:0, ad:'Sıfır Oran', gerekce:'İhracat teslimleri KDV\'den istisnadır (KDVK md.11).', guven:0.98 };
  }
  if(naceKod && (naceKod.startsWith('64') || naceKod.startsWith('65') || naceKod.startsWith('66'))){
    return { kod:'KDV-MUAF', oran:null, ad:'KDV\'den İstisna', gerekce:'Finans ve sigorta işlemleri KDV\'den istisnadır (KDVK md.17/4-e).', guven:0.95 };
  }

  // 2) Kaydın kendi kdv_kodu varsa onu kullan
  // (bu fonksiyon dışarıdan kayit.kdv_kodu ile çağrılabilir)

  // 3) Kod entegrasyon kuralları
  if(KOD_INTEG?.kurallar){
    for(const k of KOD_INTEG.kurallar){
      if(k.oncelik === 99) continue; // varsayılan en sona
      const gtipEsles = gtipKod && k.gtip_prefix?.some(p => kodTemiz(gtipKod).startsWith(kodTemiz(p)));
      const cpcEsles  = cpcKod  && k.cpc_prefix?.some(p => kodTemiz(cpcKod).startsWith(kodTemiz(p)));
      const naceEsles = naceKod && k.nace_prefix?.some(p => kodTemiz(naceKod).startsWith(kodTemiz(p)));
      const iscoEsles = iscoKod && k.isco_prefix?.some(p => kodTemiz(iscoKod).startsWith(kodTemiz(p)));

      if(gtipEsles || cpcEsles || naceEsles || iscoEsles){
        return {
          kod:k.kdv_kodu,
          oran:oranBul(k.kdv_kodu),
          ad: kdvAd(k.kdv_kodu),
          gerekce:`Kod eşleşmesi "${k.aciklama}" kuralına uyuyor.`,
          guven:0.90
        };
      }
    }
  }

  // 4) Varsayılan
  return {
    kod:'KDV-01', oran:0.20, ad:'Genel Oran',
    gerekce:'Özel oran uygulanmayan mal ve hizmetler için genel KDV oranı %20\'dir.',
    guven:0.65
  };
}

function oranBul(kdvKodu){
  if(!KDV_DATA?.kayitlar) return null;
  const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
  return k ? k.oran : null;
}
function kdvAd(kdvKodu){
  if(!KDV_DATA?.kayitlar) return kdvKodu;
  const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
  return k ? k.aciklama : kdvKodu;
}

function otvBul(gtipKod, matrah){
  if(!gtipKod) return null;
  const gt = kodTemiz(gtipKod);

  // I - Petrol
  if(['2710','2711','2902','2905'].some(p => gt.startsWith(p))){
    return { kod:'OTV-I', ad:'I Sayılı Liste — Petrol Ürünleri', tip:'maktu',
             aciklama:'Akaryakıt/doğal gaz/solvent için maktu ÖTV uygulanır.' };
  }
  // II - Otomobil
  if(gt.startsWith('8703')){
    const m = matrah || 0;
    let oran;
    if(m <= 85000) oran = 0.45;
    else if(m <= 130000) oran = 0.50;
    else oran = 0.80;
    return { kod:'OTV-II', ad:'II Sayılı Liste — Otomobil', tip:'oran', oran,
             aciklama:`Matrah ${sayi(m)} TL → ÖTV %${(oran*100).toFixed(0)}.` };
  }
  // III - Alkol/Tütün
  if(['2203','2204','2205','2206','2208','2402','2403'].some(p => gt.startsWith(p))){
    return { kod:'OTV-III', ad:'III Sayılı Liste — Alkollü İçecek/Tütün', tip:'karma',
             aciklama:'Oran + asgari maktu vergi uygulanır.' };
  }
  // IV - Lüks
  if(['4303','7113','7114','8418','8450','8508','8516','8802','8903'].some(p => gt.startsWith(p))){
    return { kod:'OTV-IV', ad:'IV Sayılı Liste — Lüks Ürün', tip:'oran', oran:0.20,
             aciklama:'ÖTV IV sayılı liste kapsamındadır (%20).' };
  }
  return null;
}

// =================================================================
// 5. SONUÇ LİSTESİNİ ÇİZ
// =================================================================
function sonuclariCiz(sonuclar){
  const alan = $('sonuc-alani');

  if(!sonuclar.length){
    alan.innerHTML = `
      <div class="bos-durum">
        <div class="ikon">🔎</div>
        <h3>Sonuç bulunamadı</h3>
        <p>Farklı bir anahtar kelime veya kod deneyin. Örneğin: <code>gömlek</code>, <code>6105</code>, <code>5120</code>, <code>otobüs</code>.</p>
      </div>
    `;
    return;
  }

  const kaynakAd = { gtip:'GTİP', isco:'ISCO', cpc:'CPC', nace:'NACE' };

  alan.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px;">
      <span style="font-size:.85rem;color:var(--muted);font-weight:600;">
        ${sayi(sonuclar.length)} eşleşme bulundu
      </span>
      <span style="font-size:.75rem;color:var(--soft);">
        Karta tıklayın → KDV &amp; ÖTV otomatik hesaplanır
      </span>
    </div>
    <div class="sonuc-liste">
      ${sonuclar.map((s, i) => sonucKartHTML(s, i)).join('')}
    </div>
  `;

  alan.querySelectorAll('.sonuc-satir').forEach((el, i) => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.sonuc-satir.aktif').forEach(x => x.classList.remove('aktif'));
      el.classList.add('aktif');
      detayGoster(sonuclar[i]);
    });
  });
}

function sonucKartHTML(s, idx){
  const { kaynak, kayit } = s;
  const kod = normKod(kayit.kod);
  const ad  = kayit.tanim_tr || kayit.ad || '—';
  const seviye = kayit.seviye_adi ? `<code>${kacis(kayit.seviye_adi)}</code>` : '';
  const kaynakAd = { gtip:'GTİP', isco:'ISCO', cpc:'CPC', nace:'NACE' }[kaynak];

  // Mini KDV/ÖTV önizleme
  const kdvKod = kayit.kdv_kodu || null;
  const otvKod = kayit.otv_kodu || null;

  let mini = '';
  if(kdvKod){
    const oran = oranBul(kdvKod);
    const cls = oran === 0 ? 'mr-kdv sifir' : 'mr-kdv';
    mini += `<span class="${cls}">KDV ${oran !== null ? '%'+(oran*100).toFixed(0) : 'İstisna'}</span>`;
  }
  if(otvKod) mini += `<span class="mr-otv">ÖTV</span>`;

  return `
    <div class="sonuc-satir" data-idx="${idx}">
      <span class="kaynak-etiket kaynak-${kaynak}">${kaynakAd}</span>
      <div class="sonuc-metin">
        <b>${kacis(ad)}</b>
        <code>${kacis(kod)}</code>
        ${seviye}
      </div>
      ${mini ? `<div class="mini-rozet">${mini}</div>` : ''}
    </div>
  `;
}

// =================================================================
// 6. DETAY PANELİ
// =================================================================
function detayGoster(s){
  const { kaynak, kayit } = s;
  AKTIF_KAYIT = s;
  const kod = normKod(kayit.kod);
  const ad  = kayit.tanim_tr || kayit.ad || '—';

  const kaynakAd = { gtip:'GTİP', isco:'ISCO', cpc:'CPC', nace:'NACE' }[kaynak];

  // KDV kararı
  const kdvKodKayit = kayit.kdv_kodu || null;
  let kdv;
  if(kdvKodKayit){
    kdv = {
      kod: kdvKodKayit,
      oran: oranBul(kdvKodKayit),
      ad: kdvAd(kdvKodKayit),
      gerekce:`"${ad}" kaydının katalogunda tanımlı KDV kodu: ${kdvKodKayit}.`,
      guven:0.95
    };
  }else{
    // kod entegrasyon / varsayılan
    kdv = kdvBul(
      kaynak === 'gtip' ? kod : null,
      kaynak === 'cpc'  ? kod : null,
      kaynak === 'nace' ? kod : null,
      kaynak === 'isco' ? kod : null,
      ad,
      'satis'
    );
  }

  // ÖTV kararı
  const otv = otvBul(
    kaynak === 'gtip' ? kod : (kayit.otv_kodu ? kod : null),
    0
  ) || (kayit.otv_kodu ? { kod:kayit.otv_kodu, ad:'ÖTV uygulanır', tip:'oran', aciklama:'İlgili ÖTV listesine tabidir.' } : null);

  // KDV sınıfı
  let kdvSinif = 'kdv', kdvOranSinif = 'accent';
  if(kdv.oran === 0.01){ kdvOranSinif = 'ok'; }
  else if(kdv.oran === 0.10){ kdvOranSinif = 'amber'; }
  else if(kdv.oran === 0.20){ kdvOranSinif = ''; }
  else if(kdv.oran === 0 || kdv.kod === 'KDV-00'){ kdvSinif += ' istisna'; kdvOranSinif = 'ok'; }
  else if(kdv.kod === 'KDV-MUAF'){ kdvSinif += ' istisna'; kdvOranSinif = 'ok'; }

  const kdvOranMetin = kdv.oran === null ? 'İstisna'
                     : kdv.oran === 0 ? '%0'
                     : '%' + (kdv.oran*100).toFixed(0);

  const kap = $('detay-kap');
  kap.style.display = 'block';

  kap.innerHTML = `
    <div class="detay-ust">
      <div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
          <span class="kaynak-etiket kaynak-${kaynak}">${kaynakAd}</span>
          <span class="kod">${kacis(kod)}</span>
        </div>
        <h2>${kacis(ad)}</h2>
        ${kayit.tanim_en ? `<p style="font-size:.85rem;color:var(--muted);margin-top:6px;">${kacis(kayit.tanim_en)}</p>` : ''}
      </div>
      <button class="kapat-btn" title="Kapat" id="kapat-btn">✕</button>
    </div>

    <!-- VERGİ KARTLARI -->
    <div class="vergi-ızgarası">
      <div class="vergi-kart ${kdvSinif}">
        <div class="vk-baslik"><span>KDV Oranı</span><span>${kdv.kod}</span></div>
        <div class="vk-oran ${kdvOranSinif}">${kdvOranMetin}</div>
        <div class="vk-ad"><strong>${kacis(kdv.ad)}</strong></div>
        <div class="vk-detay">${kacis(kdv.gerekce)}</div>
      </div>

      ${otv ? `
        <div class="vergi-kart otv">
          <div class="vk-baslik"><span>ÖTV</span><span>${otv.kod}</span></div>
          <div class="vk-oran amber">
            ${otv.oran != null ? '%' + (otv.oran*100).toFixed(0) : (otv.tip === 'maktu' ? 'Maktu' : 'Karma')}
          </div>
          <div class="vk-ad"><strong>${kacis(otv.ad)}</strong></div>
          <div class="vk-detay">${kacis(otv.aciklama)}</div>
        </div>
      ` : `
        <div class="vergi-kart yok">
          <div class="vk-baslik"><span>ÖTV</span><span>—</span></div>
          <div class="vk-oran muted">Yok</div>
          <div class="vk-ad">Bu ürün/hizmet ÖTV kapsamında değildir.</div>
        </div>
      `}
    </div>

    <!-- GEREKÇE -->
    <div class="gerekce-kart">
      <h3>📋 Karar Gerekçesi</h3>
      <ul>
        <li>
          <strong>Kaynak katalog:</strong> ${kaynakAd}
          <small>${kacis(kod)} — ${kacis(ad)}</small>
        </li>
        <li>
          <strong>KDV kararı:</strong> ${kdv.kod} (${kdvOranMetin})
          <small>${kacis(kdv.gerekce)}</small>
        </li>
        ${otv ? `
        <li>
          <strong>ÖTV kararı:</strong> ${otv.kod}
          <small>${kacis(otv.aciklama)}</small>
        </li>
        ` : `
        <li>
          <strong>ÖTV kararı:</strong> Uygulanmaz
          <small>Ürün/hizmet ÖTV listelerinde yer almıyor.</small>
        </li>
        `}
      </ul>
    </div>

    <!-- GÜVEN -->
    <div class="guven-kart">
      <span class="guven-baslik">Güven Skoru</span>
      <div class="guven-bar">
        <div class="guven-dolgu" style="width:${(kdv.guven*100).toFixed(0)}%"></div>
      </div>
      <span class="guven-sayi">${(kdv.guven*100).toFixed(0)}%</span>
    </div>
  `;

  $('kapat-btn').addEventListener('click', () => {
    kap.style.display = 'none';
    document.querySelectorAll('.sonuc-satir.aktif').forEach(x => x.classList.remove('aktif'));
    AKTIF_KAYIT = null;
  });

  kap.scrollIntoView({ behavior:'smooth', block:'start' });
}

// =================================================================
// 7. OLAY BAĞLAMA
// =================================================================
let aramaZaman;
$('arama').addEventListener('input', (e) => {
  clearTimeout(aramaZaman);
  const q = e.target.value.trim();
  aramaZaman = setTimeout(() => {
    const sonuclar = kaynaklariTara(q, AKTIF_FILTRE);
    sonuclariCiz(sonuclar);
    $('detay-kap').style.display = 'none';
  }, 150);
});

$('filtreler').addEventListener('click', (e) => {
  const btn = e.target.closest('.cip');
  if(!btn) return;
  document.querySelectorAll('.cip').forEach(x => x.classList.remove('aktif'));
  btn.classList.add('aktif');
  AKTIF_FILTRE = btn.dataset.tip;
  const q = $('arama').value.trim();
  if(q){
    const sonuclar = kaynaklariTara(q, AKTIF_FILTRE);
    sonuclariCiz(sonuclar);
    $('detay-kap').style.display = 'none';
  }
});

document.querySelectorAll('.yardim code').forEach(el => {
  el.addEventListener('click', () => {
    $('arama').value = el.dataset.ornek;
    $('arama').dispatchEvent(new Event('input'));
  });
});

// =================================================================
// 8. BAŞLAT
// =================================================================
tumVeriYukle();
</script>
</body>
