  <script>
  // ═══════════════════════════════════════════════════════════════
  // DİL SÖZLÜĞÜ
  // ═══════════════════════════════════════════════════════════════
  const UI = {
    en: {
      marka_baslik:     "PDaaS · Product & Occupation Tax Lookup",
      marka_alt:        "HS · ISCO · CPC · NACE → VAT & SCT",
      sistem_aktif:     "System Active",
      arama_yer:        "Type a product name, HS, ISCO, CPC or NACE code…",
      filtre_hepsi:     "All",
      ornek_baslik:     "Examples:",
      bos_baslik:       "Start searching",
      bos_aciklama:     "Type a product name, HS, ISCO, CPC or NACE code. When you select a filter and leave the input empty, the full tree appears.",
      sonuc_yok_b:      "No results found",
      sonuc_yok_p:      "Try a different keyword or code. For example: shirt, 6105, 5120, hotel.",
      satir:            "rows",
      agac_gorunumu:    "tree view",
      baglam_not:       "Faded rows are context · Highlighted rows are matches",
      eslesme:          "matches",
      kod_baslik:       "Codes",
      kdv_orani:        "VAT Rate",
      otv:              "SCT (Excise)",
      otv_yok:          "None",
      otv_yok_aciklama: "This product/service is not subject to SCT.",
      gerekce_baslik:   "Decision Reasoning",
      kaynak_katalog:   "Source catalog",
      kdv_karari:       "VAT decision",
      otv_karari:       "SCT decision",
      otv_uygulanmaz:   "Not applicable",
      otv_uygulanmaz_a: "Product/service not listed in SCT schedules.",
      guven:            "Confidence",
      istisna:          "Exempt",
      maktu:            "Fixed",
      karma:            "Mixed",
      yukleniyor:       "Loading data sources…",
      eksik_kaynak:     "data sources could not be loaded",
      konsol_notu:      "Open DevTools (F12) to see which URLs failed.",
      kapat:            "Close",
    },
    tr: {
      marka_baslik:     "PDaaS · Ürün & Meslek Vergi Sorgu",
      marka_alt:        "GTİP · ISCO · CPC · NACE → KDV & ÖTV",
      sistem_aktif:     "Sistem Aktif",
      arama_yer:        "Ürün adı, GTİP, ISCO, CPC veya NACE kodu yazın…",
      filtre_hepsi:     "Tümü",
      ornek_baslik:     "Örnekler:",
      bos_baslik:       "Aramaya başlayın",
      bos_aciklama:     "Ürün adı, GTİP, ISCO (meslek), CPC veya NACE kodu yazın. Bir filtre seçip kutu boş bırakırsanız tüm ağaç görünür.",
      sonuc_yok_b:      "Sonuç bulunamadı",
      sonuc_yok_p:      "Farklı bir anahtar kelime veya kod deneyin. Örneğin: gömlek, 6105, 5120, otel.",
      satir:            "satır",
      agac_gorunumu:    "ağaç görünümü",
      baglam_not:       "Soluk satırlar bağlam · Koyu satırlar arama eşleşmesi",
      eslesme:          "eşleşme",
      kod_baslik:       "Kodları",
      kdv_orani:        "KDV Oranı",
      otv:              "ÖTV",
      otv_yok:          "Yok",
      otv_yok_aciklama: "Bu ürün/hizmet ÖTV kapsamında değildir.",
      gerekce_baslik:   "Karar Gerekçesi",
      kaynak_katalog:   "Kaynak katalog",
      kdv_karari:       "KDV kararı",
      otv_karari:       "ÖTV kararı",
      otv_uygulanmaz:   "Uygulanmaz",
      otv_uygulanmaz_a: "Ürün/hizmet ÖTV listelerinde yer almıyor.",
      guven:            "Güven Skoru",
      istisna:          "İstisna",
      maktu:            "Maktu",
      karma:            "Karma",
      yukleniyor:       "Veri kaynakları yükleniyor…",
      eksik_kaynak:     "kaynak yüklenemedi",
      konsol_notu:      "Konsolda (F12) hangi URL'lerin başarısız olduğunu görebilirsiniz.",
      kapat:            "Kapat",
    }
  };

  const TIP_SOZLUK = {
    tr: { liste:'Liste', agac:'Ağaç', harita:'Harita', tablo:'Tablo' },
    en: { liste:'List',  agac:'Tree', harita:'Map',    tablo:'Table' }
  };

  let DIL = 'en';

  function t(k){ return (UI[DIL] && UI[DIL][k]) || k; }

  function alanSec(obj, temelAd){
    if(!obj) return '';
    const en = obj[temelAd + '_en'];
    const tr = obj[temelAd + '_tr'];
    const eski = obj[temelAd];
    if(DIL === 'en') return en || tr || eski || '';
    return tr || eski || en || '';
  }

  function kayitAdi(k){
    const a = alanSec(k, 'tanim'); if(a) return a;
    const b = alanSec(k, 'ad');    if(b) return b;
    return '—';
  }

  function aciklamaAdi(o){ return alanSec(o, 'aciklama'); }

  function tipEtiket(tip){
    if(!tip) return '—';
    const anahtar = String(tip).toLowerCase();
    return (TIP_SOZLUK[DIL] && TIP_SOZLUK[DIL][anahtar]) || tip;
  }

  const $ = id => document.getElementById(id);
  const kacis = s => String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
  const tr_lower = s => String(s ?? '').toLocaleLowerCase('tr-TR');
  const sayi = n => (n == null ? '—' : Number(n).toLocaleString(DIL === 'tr' ? 'tr-TR' : 'en-US'));
  const normKod = k => String(k ?? '').trim().replace(/\s+/g,'');
  const kodTemiz = k => normKod(k).replace(/\./g,'');

  function dilUygula(){
    document.documentElement.lang = DIL;
    document.title = t('marka_baslik');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });

    const trBtn = $('lang-tr'), enBtn = $('lang-en');
    if(DIL === 'tr'){
      trBtn.className = 'px-2.5 py-1 rounded-lg bg-brand-600 text-white transition';
      enBtn.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition';
    }else{
      enBtn.className = 'px-2.5 py-1 rounded-lg bg-brand-600 text-white transition';
      trBtn.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition';
    }
    try{ localStorage.setItem('pdaas_dil', DIL); }catch(e){}
  }

  function dilDegistir(yeni){
    if(yeni === DIL) return;
    DIL = yeni;
    dilUygula();
    const q = $('arama').value.trim();
    sonuclariCiz(kaynaklariTara(q, AKTIF_FILTRE));

  const VERI = {
    gtip: { kayitlar: [], yuklendi: false },
    isco: { kayitlar: [], yuklendi: false },
    cpc:  { kayitlar: [], yuklendi: false },
    nace: { kayitlar: [], yuklendi: false }
  };

  let OTV_DATA = null;

  async function fetchJSON(yol){
    try{
      const r = await fetch(yol, { headers:{Accept:'application/json'} });
      if(!r.ok) return { ok:false, status:r.status, yol };
      return { ok:true, data: await r.json(), yol };
    }catch(e){
      return { ok:false, status:0, yol, hata:e.message };
    }
  }

  async function ilkBasari(anahtar, yollar){
    try{
      const hatirlanan = localStorage.getItem('pdaas_url_' + anahtar);
      if(hatirlanan && yollar.includes(hatirlanan)){
        const r = await fetchJSON(hatirlanan);
        if(r.ok && r.data) return { ...r, denenen:yollar };
      }
    }catch(e){}

    for(const y of yollar){
      const r = await fetchJSON(y);
      if(r.ok && r.data){
        try{ localStorage.setItem('pdaas_url_' + anahtar, y); }catch(e){}
        return { ...r, denenen:yollar };
      }
    }
    return { ok:false, data:null, yol:yollar[0], denenen:yollar };
  }

  // ═══════════════════════════════════════════════════════════════
  // AĞAÇ MOTORU
  // ═══════════════════════════════════════════════════════════════
  function karsilastirKod(a, b){
    const parcala = s => String(s).match(/\d+|[A-Za-zĞÜŞİÖÇğüşıöç]+/g) || [];
    const A = parcala(a), B = parcala(b);
    const n = Math.min(A.length, B.length);
    for(let i = 0; i < n; i++){
      const x = A[i], y = B[i];
      const xn = /^\d+$/.test(x), yn = /^\d+$/.test(y);
      if(xn && yn){
        const d = parseInt(x, 10) - parseInt(y, 10);
        if(d !== 0) return d;
      }else if(!xn && !yn){
        const c = x.localeCompare(y, 'tr');
        if(c !== 0) return c;
      }else{
        return xn ? -1 : 1;
      }
    }
    return A.length - B.length;
  }

  function gtipZinciri(kod){
    const tk = kodTemiz(kod);
    if(!/^\d+$/.test(tk)) return [normKod(kod)];
    const dilimler = [2, 4, 6, 8, 10, 12];
    const zincir = [];
    for(const d of dilimler){
      if(tk.length >= d) zincir.push(tk.slice(0, d));
    }
    return zincir;
  }

  function kayitYolu(kayit, kodMap, onbellek, kaynakTip){
    const kk = normKod(kayit.kod);
    const anahtar = kaynakTip + '::' + kk;
    if(onbellek.has(anahtar)) return onbellek.get(anahtar);

    let zincir = [];
    if(kaynakTip === 'gtip'){
      const g = gtipZinciri(kayit.kod);
      zincir = g.filter(x => kodMap.has(x));
      if(zincir[zincir.length-1] !== kk) zincir.push(kk);
    }else{
      const gorulen = new Set();
      let m = kayit;
      while(m){
        const mk = normKod(m.kod);
        if(gorulen.has(mk)) break;
        gorulen.add(mk);
        zincir.unshift(mk);
        m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
      }
    }
    onbellek.set(anahtar, zincir);
    return zincir;
  }

  function ataZinciri(kayit, kodMap, kaynakTip){
    const kod = normKod(kayit.kod);
    if(kaynakTip === 'gtip'){
      const g = gtipZinciri(kod);
      const kayitlar = [];
      for(const x of g){
        const k = kodMap.get(x);
        if(k) kayitlar.push(k);
      }
      const son = kayitlar[kayitlar.length-1];
      if(!son || normKod(son.kod) !== kod) kayitlar.push(kayit);
      return kayitlar;
    }
    const zincir = [];
    const gorulen = new Set();
    let m = kayit;
    while(m){
      const mk = normKod(m.kod);
      if(gorulen.has(mk)) break;
      gorulen.add(mk);
      zincir.unshift(m);
      m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
    }
    return zincir;
  }

  function hiyerarsiSirala(sonuclar, tumKayitlar, kaynakTip){
    const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
    const onbellek = new Map();
    return [...sonuclar].sort((a, b) => {
      const A = kayitYolu(a.kayit, kodMap, onbellek, kaynakTip);
      const B = kayitYolu(b.kayit, kodMap, onbellek, kaynakTip);
      const n = Math.min(A.length, B.length);
      for(let i = 0; i < n; i++){
        const c = karsilastirKod(A[i], B[i]);
        if(c !== 0) return c;
      }
      return A.length - B.length;
    });
  }

  function agacKur(kaynakTip, tumKayitlar, eslesenKodlar){
    const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
    const dahil = new Map();
    for(const kod of eslesenKodlar){
      const k = kodMap.get(kod);
      if(!k) continue;
      const zincir = ataZinciri(k, kodMap, kaynakTip);
      zincir.forEach((z, i) => {
        const zk = normKod(z.kod);
        const sonuncu = (i === zincir.length - 1);
        const mevcut = dahil.get(zk);
        if(!mevcut) dahil.set(zk, { kayit:z, eslesme:sonuncu });
        else if(sonuncu) mevcut.eslesme = true;
      });
    }
    const liste = [...dahil.values()].map(x => ({
      kaynak: kaynakTip, kayit: x.kayit, eslesme: x.eslesme
    }));
    return hiyerarsiSirala(liste, tumKayitlar, kaynakTip);
  }

  // ═══════════════════════════════════════════════════════════════
  // ARAMA MOTORU
  // ═══════════════════════════════════════════════════════════════
  function kaynaklariTara(q, filtre){
    const sorgu = tr_lower(q || '');
    const sorguTemiz = sorgu.replace(/\./g,'').replace(/\s/g,'');
    const tekKaynak = filtre !== 'hepsi';
    if(!sorgu && !tekKaynak) return [];

    const kaynaklar = [];
    if(filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
    if(filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
    if(filtre === 'hepsi' || filtre === 'cpc')  kaynaklar.push(['cpc',  VERI.cpc]);
    if(filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

    const tumSonuclar = [];
    for(const [kaynakTip, veri] of kaynaklar){
      const eslesenKodlar = [];
      for(const k of veri.kayitlar){
        if(!sorgu){ eslesenKodlar.push(normKod(k.kod)); continue; }

        const kod    = normKod(k.kod);
        const kodL   = tr_lower(kod);
        const kodT   = kodTemiz(kod);
        const adTr   = tr_lower(k.tanim_tr || k.ad_tr || k.ad || '');
        const adEn   = tr_lower(k.tanim_en || k.ad_en || '');
        const seviye = tr_lower(k.seviye_adi || '');

        let ok = false;
        if(kodL === sorgu || kodT === sorguTemiz) ok = true;
        else if(kodL.startsWith(sorgu))           ok = true;
        else if(kodT.startsWith(sorguTemiz))      ok = true;
        else if(adTr.startsWith(sorgu))           ok = true;
        else if(adTr.includes(sorgu))             ok = true;
        else if(adEn.startsWith(sorgu))           ok = true;
        else if(adEn.includes(sorgu))             ok = true;
        else if(kodL.includes(sorgu))             ok = true;
        else if(seviye.includes(sorgu))           ok = true;

        if(ok) eslesenKodlar.push(kod);
      }
      tumSonuclar.push(...agacKur(kaynakTip, veri.kayitlar, eslesenKodlar));
    }
    return tumSonuclar;
  }

  // ═══════════════════════════════════════════════════════════════
  // KDV & ÖTV KARAR MOTORU
  // ═══════════════════════════════════════════════════════════════
  function kdvBul({ gtipKod, cpcKod, naceKod, iscoKod, islemTipi }){
    if(islemTipi === 'ihracat'){
      return { kod:'KDV-00', oran:0,
        ad: DIL === 'tr' ? 'Sıfır Oran' : 'Zero Rate',
        gerekce: DIL === 'tr' ? "İhracat teslimleri KDV'den istisnadır (KDVK md.11)." : "Export deliveries are VAT exempt (VAT Law Art. 11).",
        guven:0.98 };
    }
    if(naceKod && /^(64|65|66)/.test(kodTemiz(naceKod))){
      return { kod:'KDV-MUAF', oran:null,
        ad: DIL === 'tr' ? "KDV'den İstisna" : 'VAT Exempt',
        gerekce: DIL === 'tr' ? "Finans ve sigorta işlemleri KDV'den istisnadır." : "Financial transactions are VAT exempt.",
        guven:0.95 };
    }

    const kurallar = KOD_INTEG?.kayitlar || KOD_INTEG?.kurallar || [];
    if(kurallar.length){
      for(const k of kurallar){
        if(k.oncelik === 99) continue;
        const gE = gtipKod && k.gtip_prefix?.some(p => kodTemiz(gtipKod).startsWith(kodTemiz(p)));
        const cE = cpcKod  && k.cpc_prefix ?.some(p => kodTemiz(cpcKod ).startsWith(kodTemiz(p)));
        const nE = naceKod && k.nace_prefix?.some(p => kodTemiz(naceKod).startsWith(kodTemiz(p)));
        const iE = iscoKod && k.isco_prefix?.some(p => kodTemiz(iscoKod).startsWith(kodTemiz(p)));
        if(gE || cE || nE || iE){
          const kuralAd = aciklamaAdi(k) || k.kod;
          return {
            kod: k.kdv_kodu,
            oran: oranBul(k.kdv_kodu),
            ad: kdvAd(k.kdv_kodu),
            gerekce: DIL === 'tr' ? `Kod eşleşmesi: "${kuralAd}" kuralına uyuyor.` : `Matched rule "${kuralAd}".`,
            guven: 0.90
          };
        }
      }
    }

    return { kod:'KDV-01', oran:0.20,
      ad: DIL === 'tr' ? 'Genel Oran' : 'Standard Rate',
      gerekce: DIL === 'tr' ? "Özel oran uygulanmayan mal ve hizmetler için genel KDV oranı %20'dir." : "Standard VAT rate of 20%.",
      guven:0.65 };
  }

  function oranBul(kdvKodu){
    if(!KDV_DATA?.kayitlar) return null;
    const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
    return k ? k.oran : null;
  }

  function kdvAd(kdvKodu){
    if(!KDV_DATA?.kayitlar) return kdvKodu;
    const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
    if(!k) return kdvKodu;
    return aciklamaAdi(k) || kdvKodu;
  }

  function otvBul(gtipKod, matrah){
    if(!gtipKod) return null;
    const gt = kodTemiz(gtipKod);

    if(OTV_DATA?.kayitlar?.length){
      for(const k of OTV_DATA.kayitlar){
        const pref = k.gtip_prefix || [];
        if(!pref.some(p => gt.startsWith(kodTemiz(p)))) continue;

        let oran = k.oran ?? null;
        if(k.matrah_dilimleri && Array.isArray(k.matrah_dilimleri)){
          const m = Number(matrah) || 0;
          for(const d of k.matrah_dilimleri){
            if(m >= (d.min_matrah ?? 0) && m <= (d.max_matrah ?? Infinity)){ oran = d.oran; break; }
          }
        }
        const ad = alanSec(k, 'ad') || '';
        return {
          kod: k.kod, liste: k.liste || '',
          ad: DIL === 'tr' ? `${k.liste} Sayılı Liste — ${ad}` : `Schedule ${k.liste} — ${ad}`,
          tip: k.vergi_tipi, oran,
          aciklama: DIL === 'tr' ? `${ad} kapsamında ÖTV uygulanır.` : `SCT applies under ${ad}.`
        };
      }
    }

    const tr = DIL === 'tr';
    if(['2710','2711','2902','2905'].some(p => gt.startsWith(p)))
      return { kod:'OTV-I', ad: tr ? 'I Sayılı Liste — Petrol Ürünleri' : 'Schedule I — Petroleum Products', tip:'maktu', aciklama: tr ? 'Maktu ÖTV uygulanır.' : 'Fixed SCT.' };
    if(gt.startsWith('8703'))
      return { kod:'OTV-II', ad: tr ? 'II Sayılı Liste — Otomobil' : 'Schedule II — Passenger Cars', tip:'oran', oran:0.80, aciklama: tr ? 'Otomobil ÖTV oranı.' : 'Car SCT rate.' };
    if(['2203','2204','2205','2206','2208','2402','2403'].some(p => gt.startsWith(p)))
      return { kod:'OTV-III', ad: tr ? 'III Sayılı Liste — Alkollü İçecek/Tütün' : 'Schedule III — Alcohol/Tobacco', tip:'karma', aciklama: tr ? 'Karma ÖTV uygulanır.' : 'Mixed SCT.' };
    if(['4303','7113','7114','8802','8903'].some(p => gt.startsWith(p)))
      return { kod:'OTV-IV', ad: tr ? 'IV Sayılı Liste — Lüks Ürün' : 'Schedule IV — Luxury Goods', tip:'oran', oran:0.20, aciklama: tr ? 'IV sayılı liste kapsamındadır.' : 'Subject to Schedule IV.' };
    return null;
  }

  // ═══════════════════════════════════════════════════════════════
  // SONUÇ LİSTESİ
  // ═══════════════════════════════════════════════════════════════
  function gercekSeviye(kayit, kaynakTip){
    if(kaynakTip === 'gtip'){
      const tk = kodTemiz(kayit.kod);
      if(!/^\d+$/.test(tk)) return 1;
      if(tk.length <= 2) return 2;
      if(tk.length <= 4) return 3;
      if(tk.length <= 6) return 4;
      if(tk.length <= 8) return 5;
      if(tk.length <= 10) return 6;
      return 7;
    }
    return Math.max(1, Number(kayit.seviye) || 1);
  }

  const KAYNAK_ETIKET_SINIF = {
    gtip:  'etiket-hs',
    isco:  'etiket-isco',
    cpc:   'etiket-cpc',
    nace:  'etiket-nace'
  };

  function sonuclariCiz(sonuclar){
    const alan = $('sonuc-alani');
    klavyeOdakIndex = -1;

    if(!sonuclar.length){
      alan.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center py-16 text-center max-w-lg mx-auto">
          <div class="w-20 h-20 rounded-3xl bg-slate-800 border border-slate-700 text-slate-500 flex items-center justify-center text-3xl mb-6">🔎</div>
          <h2 class="text-xl font-bold text-white tracking-tight mb-2">${kacis(t('sonuc_yok_b'))}</h2>
          <p class="text-sm text-slate-400 leading-relaxed">${kacis(t('sonuc_yok_p'))}</p>
        </div>`;
      DETAY_LISTESI = [];
      return;
    }

    const gruplar = { gtip:[], isco:[], cpc:[], nace:[] };
    for(const s of sonuclar) gruplar[s.kaynak].push(s);

    const kaynakAd = { gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' };

    DETAY_LISTESI = [];
    let html = `
      <div class="flex items-center justify-between text-xs text-slate-400 px-1">
        <span class="font-semibold">${sayi(sonuclar.length)} ${kacis(t('satir'))} — ${kacis(t('agac_gorunumu'))}</span>
        <span class="text-slate-500">${kacis(t('baglam_not'))}</span>
      </div>`;

    for(const kaynak of ['gtip','isco','cpc','nace']){
      const g = gruplar[kaynak];
      if(!g.length) continue;
      const eslesmeSayisi = g.filter(s => s.eslesme).length;

      html += `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
          <div class="flex items-center gap-2 px-4 py-3 border-b border-slate-800 bg-slate-950/40">
            <span class="etiket-${kaynak==='gtip'?'hs':kaynak} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${kaynakAd[kaynak]}</span>
            <span class="text-xs font-bold text-slate-300">${kaynakAd[kaynak]} ${kacis(t('kod_baslik'))}</span>
            <span class="ml-auto text-[10px] text-slate-500 font-medium">${sayi(eslesmeSayisi)} ${kacis(t('eslesme'))} · ${sayi(g.length)} ${kacis(t('satir'))}</span>
          </div>
          <div class="divide-y divide-slate-800/60">
            ${g.map(s => {
              DETAY_LISTESI.push(s);
              return sonucKartHTML(s, DETAY_LISTESI.length - 1);
            }).join('')}
          </div>
        </div>`;
    }

    alan.innerHTML = html;
  }

  function sonucKartHTML(s, idx){
    const { kaynak, kayit, eslesme } = s;
    const kod = normKod(kayit.kod);
    const ad  = kayitAdi(kayit);
    const lvl = gercekSeviye(kayit, kaynak);
    const seviye = kayit.seviye_adi ? `<span class="text-[10px] text-slate-500 font-mono ml-1">${kacis(kayit.seviye_adi)}</span>` : '';
    const kaynakAd = { gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' }[kaynak];
    const etiketSinif = KAYNAK_ETIKET_SINIF[kaynak];

    let mini = '';
    if(eslesme && kayit.kdv_kodu){
      const oran = oranBul(kayit.kdv_kodu);
      const renk = oran === 0 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                             : 'bg-brand-500/10 text-brand-400 border-brand-500/20';
      const etiket = DIL === 'tr' ? 'KDV' : 'VAT';
      mini += `<span class="px-2 py-0.5 rounded-full border text-[10px] font-bold ${renk}">${etiket} ${oran !== null ? '%'+(oran*100).toFixed(0) : kacis(t('istisna'))}</span>`;
    }
    if(eslesme && kayit.otv_kodu) mini += `<span class="px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-bold">${kacis(t('otv'))}</span>`;

    const opaklik = eslesme ? '' : 'opacity-50';
    const arka = eslesme ? 'bg-slate-900/60 border-l-2 border-brand-500' : '';
    const kalınlık = eslesme ? 'font-semibold text-slate-100' : 'text-slate-400';

    return `
      <div class="tree-row ${opaklik} ${arka} flex items-center gap-3 pr-4 py-2.5 hover:bg-slate-800/40 transition cursor-pointer"
           data-lvl="${lvl}" data-idx="${idx}" id="kart-${idx}">
        <span class="${etiketSinif} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider flex-none">${kaynakAd}</span>
        <div class="flex-1 min-w-0">
          <div class="text-sm ${kalınlık} truncate">${kacis(ad)}</div>
          <div class="flex items-center gap-1.5 mt-0.5">
            <code class="text-[11px] font-mono text-slate-500 bg-slate-800/60 px-1.5 py-0.5 rounded">${kacis(kod)}</code>
            ${seviye}
          </div>
        </div>
        ${mini ? `<div class="flex-none flex items-center gap-1.5">${mini}</div>` : ''}
      </div>`;
  }

  // ═══════════════════════════════════════════════════════════════
  // DETAY PANELİ
  // ═══════════════════════════════════════════════════════════════
  function detayGoster(s, updateHash = true){
    const { kaynak, kayit } = s;
    AKTIF_KAYIT = s;
    const kod = normKod(kayit.kod);
    const ad  = kayitAdi(kayit);
    const adDigerDil = DIL === 'en' ? (kayit.tanim_tr || kayit.ad_tr) : (kayit.tanim_en || kayit.ad_en);
    const kaynakAd = { gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' }[kaynak];
    const etiketSinif = KAYNAK_ETIKET_SINIF[kaynak];

    if(updateHash) history.replaceState(null, '', `#${kaynak}-${kod}`);

    let kdv = kayit.kdv_kodu ? {
      kod: kayit.kdv_kodu,
      oran: oranBul(kayit.kdv_kodu),
      ad: kdvAd(kayit.kdv_kodu),
      gerekce: DIL === 'tr' ? `Katalog KDV Kodu: ${kayit.kdv_kodu}` : `Catalog VAT Code: ${kayit.kdv_kodu}`,
      guven: 0.95
    } : kdvBul({
      gtipKod: kaynak === 'gtip' ? kod : null,
      cpcKod:  kaynak === 'cpc'  ? kod : null,
      naceKod: kaynak === 'nace' ? kod : null,
      iscoKod: kaynak === 'isco' ? kod : null,
      islemTipi: 'satis'
    });

    const otv = otvBul(kaynak === 'gtip' ? kod : null, 0);

    const istisna = (kdv.oran === 0 || kdv.kod === 'KDV-MUAF' || kdv.oran === null);
    const kdvOranMetin = kdv.oran === null ? kacis(t('istisna')) : kdv.oran === 0 ? '%0' : '%' + (kdv.oran*100).toFixed(0);
    const kdvOranRenk = istisna ? 'text-emerald-400' : kdv.oran === 0.01 ? 'text-emerald-400' : kdv.oran === 0.10 ? 'text-amber-400' : 'text-brand-400';

    const otvOranMetin = otv ? (otv.oran != null ? '%' + (otv.oran*100).toFixed(0) : kacis(otv.tip === 'maktu' ? t('maktu') : t('karma'))) : '—';

    const kap = $('detay-kap');
    kap.classList.remove('hidden');
    kap.innerHTML = `
      <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-5 border-b border-slate-800 flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="${etiketSinif} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${kaynakAd}</span>
              <code class="text-xs font-mono text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded border border-brand-500/20">${kacis(kod)}</code>
            </div>
            <h2 class="text-xl lg:text-2xl font-extrabold text-white tracking-tight">${kacis(ad)}</h2>
            ${adDigerDil ? `<p class="text-xs text-slate-400 mt-1 italic">${kacis(adDigerDil)}</p>` : ''}
          </div>
          <button id="kapat-btn" class="flex-none w-9 h-9 rounded-xl bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition" title="${kacis(t('kapat'))}">✕</button>
        </div>

        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-slate-800">
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 ${istisna ? 'border-l-4 border-l-emerald-500' : 'border-l-4 border-l-brand-500'}">
            <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">
              <span>${kacis(t('kdv_orani'))}</span>
              <span class="font-mono text-slate-500">${kacis(kdv.kod)}</span>
            </div>
            <div class="text-3xl font-extrabold ${kdvOranRenk} mb-1">${kdvOranMetin}</div>
            <div class="text-xs text-slate-400">${kacis(kdv.ad)}</div>
            <div class="text-[11px] text-slate-500 mt-2 pt-2 border-t border-slate-800">${kacis(kdv.gerekce)}</div>
          </div>

          ${otv ? `
          <div class="bg-slate-950 border border-slate-800 border-l-4 border-l-amber-500 rounded-xl p-4">
            <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">
              <span>${kacis(t('otv'))}</span>
              <span class="font-mono text-slate-500">${kacis(otv.kod)}</span>
            </div>
            <div class="text-3xl font-extrabold text-amber-400 mb-1">${otvOranMetin}</div>
            <div class="text-xs text-slate-400">${kacis(otv.ad)}</div>
            <div class="text-[11px] text-slate-500 mt-2 pt-2 border-t border-slate-800">${kacis(otv.aciklama)}</div>
          </div>
          ` : `
          <div class="bg-slate-950 border border-slate-800 border-l-4 border-l-slate-600 rounded-xl p-4 opacity-70">
            <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">
              <span>${kacis(t('otv'))}</span>
              <span class="font-mono text-slate-500">—</span>
            </div>
            <div class="text-2xl font-extrabold text-slate-600 mb-1">${kacis(t('otv_yok'))}</div>
            <div class="text-xs text-slate-500 mt-2">${kacis(t('otv_yok_aciklama'))}</div>
          </div>
          `}
        </div>

        <div class="p-5 border-b border-slate-800">
          <h3 class="text-[11px] font-bold uppercase tracking-wider text-brand-400 mb-3">📋 ${kacis(t('gerekce_baslik'))}</h3>
          <ul class="space-y-2 text-xs">
            <li class="flex gap-2">
              <span class="text-brand-500">▸</span>
              <div>
                <div class="text-slate-300"><b>${kacis(t('kaynak_katalog'))}:</b> ${kaynakAd}</div>
                <div class="text-slate-500 font-mono text-[11px] mt-0.5">${kacis(kod)} — ${kacis(ad)}</div>
              </div>
            </li>
            <li class="flex gap-2">
              <span class="text-brand-500">▸</span>
              <div>
                <div class="text-slate-300"><b>${kacis(t('kdv_karari'))}:</b> ${kacis(kdv.kod)} (${kdvOranMetin})</div>
                <div class="text-slate-500 text-[11px] mt-0.5">${kacis(kdv.gerekce)}</div>
              </div>
            </li>
            <li class="flex gap-2">
              <span class="text-brand-500">▸</span>
              <div>
                <div class="text-slate-300"><b>${kacis(t('otv_karari'))}:</b> ${otv ? kacis(otv.kod) : kacis(t('otv_uygulanmaz'))}</div>
                <div class="text-slate-500 text-[11px] mt-0.5">${otv ? kacis(otv.aciklama) : kacis(t('otv_uygulanmaz_a'))}</div>
              </div>
            </li>
          </ul>
        </div>

        <div class="p-5 flex items-center gap-4 bg-slate-950/40">
          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex-none">${kacis(t('guven'))}</span>
          <div class="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full rounded-full bg-gradient-to-r from-amber-500 to-emerald-500 transition-all duration-500" style="width:${(kdv.guven*100).toFixed(0)}%"></div>
          </div>
          <span class="text-sm font-extrabold text-emerald-400 flex-none">${(kdv.guven*100).toFixed(0)}%</span>
        </div>
      </div>
    `;

    $('kapat-btn').addEventListener('click', () => {
      kap.classList.add('hidden');
      history.replaceState(null, '', location.pathname);
      document.querySelectorAll('.tree-row.aktif').forEach(x => x.classList.remove('aktif'));
      AKTIF_KAYIT = null;
    });

    kap.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function hashKontrolIleAc(){
    const hash = location.hash.replace('#','');
    if(!hash) return;
    const parcalar = hash.split('-');
    const kaynak = parcalar[0];
    const kod = parcalar.slice(1).join('-');
    if(!kaynak || !kod || !VERI[kaynak]) return;

    const bulunan = VERI[kaynak].kayitlar.find(k => normKod(k.kod) === kod);
    if(bulunan){
      sonuclariCiz([{ kaynak, kayit: bulunan, eslesme: true }]);
      detayGoster({ kaynak, kayit: bulunan }, false);
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // OLAYLAR
  // ═══════════════════════════════════════════════════════════════
  let aramaZaman;
  $('arama').addEventListener('input', (e) => {
    clearTimeout(aramaZaman);
    const q = e.target.value.trim();
    aramaZaman = setTimeout(() => {
      sonuclariCiz(kaynaklariTara(q, AKTIF_FILTRE));
      $('detay-kap').classList.add('hidden');
    }, 150);
  });

  $('sonuc-alani').addEventListener('click', (e) => {
    const el = e.target.closest('.tree-row');
    if(!el) return;
    const idx = Number(el.dataset.idx);
    if(!Number.isFinite(idx) || !DETAY_LISTESI[idx]) return;
    document.querySelectorAll('.tree-row.aktif').forEach(x => x.classList.remove('aktif'));
    el.classList.add('aktif');
    detayGoster(DETAY_LISTESI[idx]);
  });

  $('filtreler').addEventListener('click', (e) => {
    const btn = e.target.closest('.cip');
    if(!btn) return;
    document.querySelectorAll('.cip').forEach(x => {
      x.classList.remove('bg-brand-600','text-white');
      x.classList.add('bg-slate-800','text-slate-300');
    });
    btn.classList.add('bg-brand-600','text-white');
    btn.classList.remove('bg-slate-800','text-slate-300');
    AKTIF_FILTRE = btn.dataset.tip;
    const q = $('arama').value.trim();
    sonuclariCiz(kaynaklariTara(q, AKTIF_FILTRE));
    $('detay-kap').classList.add('hidden');
  });

  document.querySelectorAll('.ornek-chip').forEach(el => {
    el.addEventListener('click', () => {
      $('arama').value = el.dataset.ornek;
      $('arama').dispatchEvent(new Event('input'));
      $('arama').focus();
    });
  });

  $('lang-tr').addEventListener('click', () => dilDegistir('tr'));
  $('lang-en').addEventListener('click', () => dilDegistir('en'));

  window.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      $('arama').focus();
      $('arama').select();
      return;
    }
    if(e.key === '/' && document.activeElement !== $('arama')){
      e.preventDefault();
      $('arama').focus();
      return;
    }
    if(e.key === 'Escape'){
      $('detay-kap').classList.add('hidden');
      history.replaceState(null, '', location.pathname);
      document.querySelectorAll('.tree-row.aktif').forEach(x => x.classList.remove('aktif'));
      return;
    }
    if(DETAY_LISTESI.length > 0 && document.activeElement !== $('arama')){
      if(e.key === 'ArrowDown'){
        e.preventDefault();
        klavyeOdakIndex = Math.min(klavyeOdakIndex + 1, DETAY_LISTESI.length - 1);
        odakGuncelle();
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        klavyeOdakIndex = Math.max(klavyeOdakIndex - 1, 0);
        odakGuncelle();
      } else if(e.key === 'Enter' && klavyeOdakIndex >= 0){
        e.preventDefault();
        const item = DETAY_LISTESI[klavyeOdakIndex];
        const el = $(`kart-${klavyeOdakIndex}`);
        if(el && item){
          document.querySelectorAll('.tree-row.aktif').forEach(x => x.classList.remove('aktif'));
          el.classList.add('aktif');
          detayGoster(item);
        }
      }
    }
  });

  function odakGuncelle(){
    document.querySelectorAll('.tree-row.klavye-odak').forEach(x => x.classList.remove('klavye-odak'));
    if(klavyeOdakIndex >= 0){
      const el = $(`kart-${klavyeOdakIndex}`);
      if(el){
        el.classList.add('klavye-odak');
        el.style.outline = '2px dashed var(--tw-ring-color, #6366f1)';
        el.style.outlineOffset = '-2px';
        el.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }
    }
  }

  // Tema
  (function temaBelirle(){
    try{
      const t = localStorage.getItem('pdaas_tema');
      if(t === 'light'){
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        $('theme-icon-dark')?.classList.add('hidden');
        $('theme-icon-light')?.classList.remove('hidden');
        if($('app-body')) $('app-body').className = "bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200";
      }
    }catch(e){}
  })();

  $('btn-theme-toggle').addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    if(isDark){
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
      $('theme-icon-dark').classList.add('hidden');
      $('theme-icon-light').classList.remove('hidden');
      $('app-body').className = "bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200";
      try{ localStorage.setItem('pdaas_tema', 'light'); }catch(e){}
    }else{
      document.documentElement.classList.remove('light');
      document.documentElement.classList.add('dark');
      $('theme-icon-dark').classList.remove('hidden');
      $('theme-icon-light').classList.add('hidden');
      $('app-body').className = "bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200";
      try{ localStorage.setItem('pdaas_tema', 'dark'); }catch(e){}
    }
  });

  $('btn-quick-search').addEventListener('click', () => {
    $('arama').focus();
    $('arama').scrollIntoView({ behavior:'smooth', block:'center' });
  });

  // ═══════════════════════════════════════════════════════════════
  // YUKARI GİT BUTONU
  // ═══════════════════════════════════════════════════════════════
  (function scrollTopKur(){
    const btn = $('btn-scroll-top');
    const kap = $('main-scroll');
    if(!btn || !kap) return;
    const kontrol = () => {
      const acik = kap.scrollTop > 400;
      btn.classList.toggle('opacity-0', !acik);
      btn.classList.toggle('pointer-events-none', !acik);
      btn.classList.toggle('translate-y-4', !acik);
    };
    kap.addEventListener('scroll', kontrol, { passive:true });
    window.addEventListener('scroll', kontrol, { passive:true });
    kontrol();
    btn.addEventListener('click', () => kap.scrollTo({ top:0, behavior:'smooth' }));
  })();

  // Başlat
  dilUygula();
  tumVeriYukle();
  </script>
</body>
</html>
