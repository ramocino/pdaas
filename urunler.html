<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDaaS · Product &amp; Occupation Tax Lookup</title>
<link rel="stylesheet" href="pdaas.css">
<style>
  .dil-degistirici{display:flex;gap:2px;background:var(--line-2);border-radius:8px;padding:3px}
  .dil-degistirici button{padding:5px 12px;border-radius:6px;font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
  .dil-degistirici button.aktif{background:var(--panel);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .kap{max-width:1100px;margin:0 auto;padding:28px 24px 80px}

  .arama-kap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:22px;box-shadow:var(--golge);position:sticky;top:72px;z-index:40}
  .arama-satir{display:flex;gap:10px;align-items:center}
  .arama-ikon{width:44px;height:44px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.1rem}
  .arama-input{flex:1;height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1rem;color:var(--ink)}
  .arama-input:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
  .filtreler{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);align-items:center}
  .cip{padding:6px 14px;border-radius:999px;background:var(--line-2);color:var(--muted);font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .cip:hover{background:var(--line);color:var(--ink)}
  .cip.aktif{background:var(--accent);color:#fff}
  .cip .sayi{background:rgba(255,255,255,.2);padding:1px 7px;border-radius:999px;font-size:.7rem}
  .cip:not(.aktif) .sayi{background:var(--line);color:var(--soft)}
  .cip .cember{width:10px;height:10px;border-width:2px;vertical-align:-1px}
  .cip.hata{background:var(--bad-soft);color:var(--bad)}
  .yardim{font-size:.82rem;color:var(--soft);margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .yardim code{background:var(--line-2);padding:2px 8px;border-radius:5px;cursor:pointer;color:var(--muted);transition:.15s}
  .yardim code:hover{background:var(--accent-soft);color:var(--accent)}

  .kaynak-baslik{display:flex;align-items:center;gap:10px;margin:18px 0 8px;padding:8px 12px;background:var(--line-2);border-radius:8px;font-size:.85rem;font-weight:700}
  .kaynak-baslik .sayi{font-size:.72rem;color:var(--muted);font-weight:600;background:var(--panel);padding:2px 9px;border-radius:999px;margin-left:auto}
  .kaynak-etiket{flex:none;font-size:.68rem;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .kaynak-gtip{background:#dbeafe;color:#1e40af}.kaynak-isco{background:#fce7f3;color:#9d174d}
  .kaynak-cpc{background:#fef3c7;color:#92400e}.kaynak-nace{background:#d1fae5;color:#065f46}
  @media (prefers-color-scheme:dark){
    .kaynak-gtip{background:#1e3a8a55;color:#93c5fd}.kaynak-isco{background:#83184355;color:#f9a8d4}
    .kaynak-cpc{background:#78350f55;color:#fcd34d}.kaynak-nace{background:#064e3b55;color:#6ee7b7}
  }

  .sonuc-liste{display:flex;flex-direction:column;gap:3px}
  .sonuc-satir{padding:9px 16px;border-left:2px solid var(--line);position:relative;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;border-radius:0}
  .sonuc-satir::before{content:'';position:absolute;left:0;top:50%;width:12px;height:1px;background:var(--line)}
  .sonuc-satir:hover,.sonuc-satir.aktif{background:var(--accent-soft);border-left-color:var(--accent)}
  .sonuc-satir.ata{opacity:.5}.sonuc-satir.ata:hover{opacity:.9}
  .sonuc-satir.eslesme{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-s);padding:11px 16px;margin:4px 0}
  .sonuc-satir.eslesme::before{display:none}
  .sonuc-satir.eslesme:hover,.sonuc-satir.eslesme.aktif{background:var(--accent-soft)}
  .sonuc-satir[data-seviye="2"]{padding-left:32px}.sonuc-satir[data-seviye="3"]{padding-left:50px}
  .sonuc-satir[data-seviye="4"]{padding-left:68px}.sonuc-satir[data-seviye="5"]{padding-left:86px}
  .sonuc-satir[data-seviye="6"]{padding-left:104px}.sonuc-satir[data-seviye="7"]{padding-left:122px}
  .sonuc-metin{flex:1;min-width:0}
  .sonuc-metin b{font-size:.9rem;font-weight:650;line-height:1.3;display:block;margin-bottom:2px}
  .sonuc-satir.ata b{font-weight:500;font-size:.84rem}
  .sonuc-metin code{font-size:.74rem;color:var(--muted);background:var(--line-2);padding:1px 7px;border-radius:5px}
  .seviye-rozet{font-size:.68rem;color:var(--soft);font-weight:600;margin-left:4px}
  .mini-rozet{flex:none;display:flex;gap:5px}
  .mini-rozet span{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .mr-kdv{background:var(--accent-soft);color:var(--accent)}.mr-otv{background:var(--amber-soft);color:var(--amber)}
  .mr-kdv.sifir{background:var(--ok-soft);color:var(--ok)}
  .not-bant{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:var(--r-s);padding:9px 14px;margin-bottom:12px;font-size:.83rem}

  .detay-kap{margin-top:30px;animation:belir .25s ease}
  @keyframes belir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .detay-ust{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px}
  .detay-ust h2{font-size:1.4rem;font-weight:750;letter-spacing:-.02em;line-height:1.25}
  .detay-ust .kod{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 12px;border-radius:8px}
  .kapat-btn{width:34px;height:34px;flex:none;border-radius:9px;background:var(--line-2);color:var(--muted)}
  .kapat-btn:hover{background:var(--bad-soft);color:var(--bad)}
  .vergi-izgara{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  @media (max-width:640px){.vergi-izgara{grid-template-columns:1fr}}
  .vergi-kart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--golge)}
  .vergi-kart.kdv{border-left:4px solid var(--accent)}.vergi-kart.otv{border-left:4px solid var(--amber)}
  .vergi-kart.kdv.istisna{border-left-color:var(--ok)}.vergi-kart.yok{border-left:4px solid var(--soft);opacity:.7}
  .vk-baslik{font-size:.75rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px}
  .vk-oran{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:6px}
  .vk-oran.accent{color:var(--accent)}.vk-oran.amber{color:var(--amber)}.vk-oran.ok{color:var(--ok)}.vk-oran.muted{color:var(--soft);font-size:1.4rem}
  .vk-ad{font-size:.88rem;color:var(--muted)}.vk-ad strong{color:var(--ink)}
  .vk-detay{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);font-size:.82rem;color:var(--muted);line-height:1.6}
  .gerekce-kart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:22px;box-shadow:var(--golge)}
  .gerekce-kart h3{font-size:.88rem;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:12px}
  .gerekce-kart ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .gerekce-kart li{font-size:.9rem;padding-left:24px;position:relative}
  .gerekce-kart li::before{content:'▸';position:absolute;left:6px;color:var(--accent);font-weight:700}
  .gerekce-kart li small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
  .guven-kart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--golge)}
  .guven-baslik{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .guven-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .guven-dolgu{height:100%;background:linear-gradient(90deg,var(--amber),var(--ok))}
  .guven-sayi{font-size:1.05rem;font-weight:800;color:var(--ok)}
  .bos-durum{text-align:center;padding:50px 20px;color:var(--muted)}
  .bos-durum .ikon{width:80px;height:80px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:2.2rem;margin-bottom:20px}
  .bos-durum h3{font-size:1.15rem;color:var(--ink);margin-bottom:8px}
  .bos-durum p{max-width:52ch;margin:0 auto;font-size:.92rem}
</style>
</head>
<body>

<header class="ust">
  <span class="logo">P</span>
  <div class="marka">
    <b data-i18n="marka_baslik">PDaaS · Product &amp; Occupation Tax Lookup</b>
    <small data-i18n="marka_alt">HS · ISCO · CPC · NACE → VAT &amp; SCT</small>
  </div>
  <div class="ust-sag">
    <a class="ust-link" href="index.html">API &amp; Developers →</a>
    <div class="dil-degistirici" id="dil-degistirici">
      <button data-dil="tr">TR</button><button data-dil="en" class="aktif">EN</button>
    </div>
  </div>
</header>

<div class="kap">
  <div class="arama-kap">
    <div class="arama-satir">
      <div class="arama-ikon">🔍</div>
      <input type="search" id="arama" class="arama-input" data-i18n-placeholder="arama_yer" autocomplete="off" autofocus>
    </div>
    <div class="filtreler" id="filtreler">
      <button class="cip aktif" data-tip="hepsi" data-i18n="filtre_hepsi">All</button>
      <button class="cip" data-tip="gtip"><span class="ad">HS</span> <span class="sayi" id="sayi-gtip">…</span></button>
      <button class="cip" data-tip="isco">ISCO <span class="sayi" id="sayi-isco">…</span></button>
      <button class="cip" data-tip="cpc">CPC <span class="sayi" id="sayi-cpc">…</span></button>
      <button class="cip" data-tip="nace">NACE <span class="sayi" id="sayi-nace">…</span></button>
    </div>
    <div class="yardim">
      <span data-i18n="ornek_baslik">Examples:</span>
      <code data-ornek="shirt">shirt</code><code data-ornek="6105">6105</code><code data-ornek="5120">5120</code>
      <code data-ornek="bus">bus</code><code data-ornek="hotel">hotel</code><code data-ornek="01.11">01.11</code>
    </div>
  </div>

  <div id="durum-alani"></div>
  <div id="sonuc-alani"></div>
  <div class="detay-kap" id="detay-kap" style="display:none"></div>
</div>
<div id="bildirim"></div>

<script src="pdaas-core.js"></script>
<script>
// ============ 0. DİL ============
const UI = {
  en: {
    marka_baslik:"PDaaS · Product & Occupation Tax Lookup", marka_alt:"HS · ISCO · CPC · NACE → VAT & SCT",
    arama_yer:"Type a product name, HS, ISCO, CPC or NACE code… (e.g. shirt, 6105, 5120)",
    filtre_hepsi:"All", ornek_baslik:"Examples:",
    bos_baslik:"Start searching",
    bos_aciklama:"Type a product name or a classification code. Results appear instantly. Pick a filter with an empty box to browse top-level chapters.",
    sonuc_yok_b:"No results found", sonuc_yok_p:"Try a different keyword or code. For example: shirt, 6105, 5120, bus.",
    bekle_b:"Data is still loading", bekle_p:"Results will appear automatically as soon as the catalog finishes loading.",
    satir:"rows", agac_gorunumu:"tree view", baglam_not:"Faded rows are context · Dark cards are matches",
    eslesme:"matches", kod_baslik:"Codes", kirpildi:"Showing the best {n} of {t} matches — refine your search.",
    kdv_orani:"VAT Rate", otv:"SCT (Excise)", otv_yok:"None", otv_yok_aciklama:"This product/service is not subject to SCT.",
    gerekce_baslik:"Decision Reasoning", kaynak_katalog:"Source catalog", kdv_karari:"VAT decision", otv_karari:"SCT decision",
    otv_uygulanmaz:"Not applicable", otv_uygulanmaz_a:"Product/service not listed in SCT schedules.",
    guven:"Confidence", istisna:"Exempt", maktu:"Fixed", karma:"Mixed", kapat:"Close",
    yuk_bekliyor:"loading", yuk_hata:"failed — click to retry", onbellek:"cached"
  },
  tr: {
    marka_baslik:"PDaaS · Ürün & Meslek Vergi Sorgu", marka_alt:"GTİP · ISCO · CPC · NACE → KDV & ÖTV",
    arama_yer:"Ürün adı, GTİP, ISCO, CPC veya NACE kodu yazın… (örn: gömlek, 6105, 5120)",
    filtre_hepsi:"Tümü", ornek_baslik:"Örnek aramalar:",
    bos_baslik:"Aramaya başlayın",
    bos_aciklama:"Ürün adı veya sınıflandırma kodu yazın; sonuçlar anında gelir. Kutu boşken bir filtre seçerseniz üst seviye bölümler listelenir.",
    sonuc_yok_b:"Sonuç bulunamadı", sonuc_yok_p:"Farklı bir anahtar kelime veya kod deneyin. Örneğin: gömlek, 6105, 5120, otobüs.",
    bekle_b:"Veri hâlâ yükleniyor", bekle_p:"Katalog yüklenir yüklenmez sonuçlar kendiliğinden görünecek.",
    satir:"satır", agac_gorunumu:"ağaç görünümü", baglam_not:"Soluk satırlar bağlam · Koyu kartlar arama eşleşmesi",
    eslesme:"eşleşme", kod_baslik:"Kodları", kirpildi:"{t} eşleşmenin en iyi {n} tanesi gösteriliyor — aramayı daraltın.",
    kdv_orani:"KDV Oranı", otv:"ÖTV", otv_yok:"Yok", otv_yok_aciklama:"Bu ürün/hizmet ÖTV kapsamında değildir.",
    gerekce_baslik:"Karar Gerekçesi", kaynak_katalog:"Kaynak katalog", kdv_karari:"KDV kararı", otv_karari:"ÖTV kararı",
    otv_uygulanmaz:"Uygulanmaz", otv_uygulanmaz_a:"Ürün/hizmet ÖTV listelerinde yer almıyor.",
    guven:"Güven Skoru", istisna:"İstisna", maktu:"Maktu", karma:"Karma", kapat:"Kapat",
    yuk_bekliyor:"yükleniyor", yuk_hata:"yüklenemedi — tekrar dene", onbellek:"önbellekten"
  }
};
let DIL = 'en';
const t = k => (UI[DIL] && UI[DIL][k]) || k;

function alanSec(o, ad){
  if (!o) return '';
  const en = o[ad+'_en'], tr = o[ad+'_tr'], eski = o[ad];
  return DIL === 'en' ? (en || tr || eski || '') : (tr || eski || en || '');
}
const kayitAdi = k => alanSec(k,'tanim') || alanSec(k,'ad') || '—';
const aciklamaAdi = o => alanSec(o,'aciklama');

function dilUygula(){
  document.documentElement.lang = DIL;
  document.title = t('marka_baslik');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  document.querySelectorAll('#dil-degistirici button').forEach(b => b.classList.toggle('aktif', b.dataset.dil === DIL));
  $('filtreler').querySelector('[data-tip="gtip"] .ad').textContent = DIL === 'tr' ? 'GTİP' : 'HS';
  try{ localStorage.setItem('pdaas_dil', DIL); }catch(_){}
}
function dilDegistir(yeni){
  if (yeni === DIL) return;
  DIL = yeni; dilUygula(); yenidenAra(); $('detay-kap').style.display = 'none';
}
(function(){
  const u = new URLSearchParams(location.search).get('lang');
  if (u && ['tr','en'].includes(u)) { DIL = u; return; }
  try{ const k = localStorage.getItem('pdaas_dil'); if (k && ['tr','en'].includes(k)) { DIL = k; return; } }catch(_){}
  DIL = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en';
})();

// ============ 1. YARDIMCILAR ============
const $ = id => document.getElementById(id);
const kacis = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr_lower = s => String(s ?? '').toLocaleLowerCase('tr-TR');
const sayi = n => (n == null ? '—' : Number(n).toLocaleString(DIL === 'tr' ? 'tr-TR' : 'en-US'));
const normKod = k => String(k ?? '').trim().replace(/\s+/g,'');
const kodTemiz = k => normKod(k).replace(/\./g,'');
const LIM = 200; // kaynak başına en fazla eşleşme (UI donmasın)

// ============ 2. VERİ ============
const VERI = {
  gtip:{kayitlar:[],map:new Map(),yuklendi:false,durum:'bekliyor',toplam:0},
  isco:{kayitlar:[],map:new Map(),yuklendi:false,durum:'bekliyor',toplam:0},
  cpc: {kayitlar:[],map:new Map(),yuklendi:false,durum:'bekliyor',toplam:0},
  nace:{kayitlar:[],map:new Map(),yuklendi:false,durum:'bekliyor',toplam:0}
};
let KDV_DATA = null, OTV_DATA = null, KOD_INTEG = null, AKTIF_FILTRE = 'hepsi';

const YOLLAR = {
  gtip:  ['/api/v1/tb/gtip-kodlari','/api/v1/genel/gtip-kodlari'],
  isco:  ['/api/v1/csgb/isco-kodlari','/api/v1/genel/isco-kodlari'],
  cpc:   ['/api/v1/tb/cpc-kodlari','/api/v1/genel/cpc-kodlari'],
  nace:  ['/api/v1/hvmb/nace-kodlari','/api/v1/tb/nace-kodlari','/api/v1/genel/nace-kodlari'],
  kdv:   ['/api/v1/hvmb/kdv-oranlari','/api/v1/hmb/kdv-oranlari'],
  otv:   ['/api/v1/hvmb/otv-oranlari','/api/v1/hmb/otv-oranlari'],
  integ: ['/api/v1/genel/kod-entegrasyon','/api/v1/tb/kod-entegrasyon','/api/v1/hvmb/kod-entegrasyon']
};

function indeksle(ad, data){
  const v = VERI[ad];
  v.kayitlar = data.kayitlar || data.kurallar || [];
  // Arama anahtarlarını BİR KEZ hesapla → her tuş vuruşunda yeniden hesaplanmaz
  for (const k of v.kayitlar){
    k._kod = normKod(k.kod); k._l = tr_lower(k._kod); k._t = kodTemiz(k._kod);
    k._tr = tr_lower(k.tanim_tr || k.ad_tr || k.ad || '');
    k._en = tr_lower(k.tanim_en || k.ad_en || '');
    k._sv = tr_lower(k.seviye_adi || '');
  }
  v.map = new Map(v.kayitlar.map(k => [k._kod, k]));
  v.yuklendi = true;
}

function chipGuncelle(ad, durum, got, total){
  const el = $('sayi-' + ad); if (!el) return;
  const chip = el.closest('.cip');
  chip.classList.toggle('hata', durum === 'hata');
  if (durum === 'yukleniyor'){
    el.innerHTML = total ? Math.min(99, Math.round(got/total*100)) + '%' : '<span class="cember"></span>';
    chip.title = t('yuk_bekliyor');
  } else if (durum === 'hata'){
    el.textContent = '!'; chip.title = t('yuk_hata');
  } else {
    el.textContent = sayi(VERI[ad].kayitlar.length); chip.title = durum === 'onbellek' ? t('onbellek') : '';
  }
}

async function kaynakYukle(ad){
  const v = VERI[ad]; v.durum = 'yukleniyor'; chipGuncelle(ad, 'yukleniyor');
  try{
    const r = await PDaaS.load(ad, YOLLAR[ad], {
      onProgress: (g, tot) => chipGuncelle(ad, 'yukleniyor', g, tot),
      onUpdate: d => { indeksle(ad, d); chipGuncelle(ad, 'tamam'); yenidenAra(); }
    });
    indeksle(ad, r.data); v.durum = 'tamam';
    chipGuncelle(ad, r.from === 'cache' ? 'onbellek' : 'tamam');
  }catch(e){
    console.warn('[PDaaS]', e.message); v.durum = 'hata'; chipGuncelle(ad, 'hata');
  }
  yenidenAra();
}
async function kucukYukle(ad){
  try{
    const r = await PDaaS.load(ad, YOLLAR[ad]);
    if (ad === 'kdv') KDV_DATA = r.data; if (ad === 'otv') OTV_DATA = r.data; if (ad === 'integ') KOD_INTEG = r.data;
  }catch(e){ console.warn('[PDaaS]', e.message); }
}
function baslat(){
  // Hepsi paralel; arama arayüzü beklemeden açık
  ['kdv','otv','integ'].forEach(kucukYukle);
  ['gtip','isco','cpc','nace'].forEach(kaynakYukle);
}
const bekleyenSayisi = () => Object.values(VERI).filter(v => v.durum === 'yukleniyor' || v.durum === 'bekliyor').length;

// ============ 3. AĞAÇ ============
function karsilastirKod(a, b){
  const p = s => String(s).match(/\d+|[A-Za-zĞÜŞİÖÇğüşıöç]+/g) || [];
  const A = p(a), B = p(b), n = Math.min(A.length, B.length);
  for (let i = 0; i < n; i++){
    const x = A[i], y = B[i], xn = /^\d+$/.test(x), yn = /^\d+$/.test(y);
    if (xn && yn){ const d = parseInt(x,10) - parseInt(y,10); if (d) return d; }
    else if (!xn && !yn){ const c = x.localeCompare(y,'tr'); if (c) return c; }
    else return xn ? -1 : 1;
  }
  return A.length - B.length;
}
function gtipZinciri(kod){
  const tk = kodTemiz(kod);
  if (!/^\d+$/.test(tk)) return [normKod(kod)];
  return [2,4,6,8,10,12].filter(d => tk.length >= d).map(d => tk.slice(0, d));
}
function kayitYolu(kayit, kodMap, onb, tip){
  const kk = kayit._kod, an = tip + '::' + kk;
  if (onb.has(an)) return onb.get(an);
  let z = [];
  if (tip === 'gtip'){
    z = gtipZinciri(kk).filter(x => kodMap.has(x));
    if (z[z.length-1] !== kk) z.push(kk);
  } else {
    const g = new Set(); let m = kayit;
    while (m){ if (g.has(m._kod)) break; g.add(m._kod); z.unshift(m._kod); m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null; }
  }
  onb.set(an, z); return z;
}
function ataZinciri(kayit, kodMap, tip){
  if (tip === 'gtip'){
    const out = gtipZinciri(kayit._kod).map(x => kodMap.get(x)).filter(Boolean);
    if (!out.length || out[out.length-1]._kod !== kayit._kod) out.push(kayit);
    return out;
  }
  const z = [], g = new Set(); let m = kayit;
  while (m){ if (g.has(m._kod)) break; g.add(m._kod); z.unshift(m); m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null; }
  return z;
}
function agacKur(tip, kodMap, eslesenKodlar){
  const dahil = new Map();
  for (const kod of eslesenKodlar){
    const k = kodMap.get(kod); if (!k) continue;
    const z = ataZinciri(k, kodMap, tip);
    z.forEach((x, i) => {
      const son = i === z.length - 1, m = dahil.get(x._kod);
      if (!m) dahil.set(x._kod, { kayit:x, eslesme:son }); else if (son) m.eslesme = true;
    });
  }
  const onb = new Map();
  return [...dahil.values()].map(x => ({ kaynak:tip, kayit:x.kayit, eslesme:x.eslesme }))
    .sort((a, b) => {
      const A = kayitYolu(a.kayit, kodMap, onb, tip), B = kayitYolu(b.kayit, kodMap, onb, tip);
      const n = Math.min(A.length, B.length);
      for (let i = 0; i < n; i++){ const c = karsilastirKod(A[i], B[i]); if (c) return c; }
      return A.length - B.length;
    });
}
function gercekSeviye(k, tip){
  if (tip === 'gtip'){
    const n = k._t.length; if (!/^\d+$/.test(k._t)) return 1;
    return n <= 2 ? 2 : n <= 4 ? 3 : n <= 6 ? 4 : n <= 8 ? 5 : n <= 10 ? 6 : 7;
  }
  return Math.max(1, Number(k.seviye) || 1);
}

// ============ 4. ARAMA ============
function kaynaklariTara(q, filtre){
  const sorgu = tr_lower(q || ''), st = sorgu.replace(/[.\s]/g, ''), tek = filtre !== 'hepsi';
  if (!sorgu && !tek) return [];
  const out = [];
  for (const tip of ['gtip','isco','cpc','nace']){
    if (tek && filtre !== tip) continue;
    const v = VERI[tip]; if (!v.yuklendi) continue;
    let m;
    if (!sorgu){
      m = v.kayitlar.filter(k => gercekSeviye(k, tip) <= 2).slice(0, LIM).map(k => k._kod);
      v.toplam = m.length;
    } else {
      const sk = [];
      for (const k of v.kayitlar){
        let s = 0;
        if (k._l === sorgu || (st && k._t === st)) s = 100;
        else if (k._l.startsWith(sorgu) || (st && k._t.startsWith(st))) s = 80;
        else if (k._tr.startsWith(sorgu) || k._en.startsWith(sorgu)) s = 60;
        else if (k._tr.includes(sorgu) || k._en.includes(sorgu)) s = 40;
        else if (k._l.includes(sorgu)) s = 20;
        else if (k._sv.includes(sorgu)) s = 10;
        if (s) sk.push([s, k._kod]);
      }
      sk.sort((a, b) => b[0] - a[0]);
      v.toplam = sk.length; m = sk.slice(0, LIM).map(x => x[1]);
    }
    out.push(...agacKur(tip, v.map, m));
  }
  return out;
}
function yenidenAra(){ sonuclariCiz(kaynaklariTara($('arama').value.trim(), AKTIF_FILTRE)); }

// ============ 5. KDV & ÖTV ============
function oranBul(kod){ const k = KDV_DATA?.kayitlar?.find(x => x.kod === kod); return k ? k.oran : null; }
function kdvAd(kod){ const k = KDV_DATA?.kayitlar?.find(x => x.kod === kod); return k ? (aciklamaAdi(k) || kod) : kod; }

function kdvBul({ gtipKod, cpcKod, naceKod, iscoKod, islemTipi }){
  const tr = DIL === 'tr';
  if (islemTipi === 'ihracat')
    return { kod:'KDV-00', oran:0, ad: tr ? 'Sıfır Oran' : 'Zero Rate',
      gerekce: tr ? "İhracat teslimleri KDV'den istisnadır (KDVK md.11)." : "Export deliveries are VAT exempt (VAT Law Art. 11).", guven:0.98 };
  if (naceKod && /^(64|65|66)/.test(kodTemiz(naceKod)))
    return { kod:'KDV-MUAF', oran:null, ad: tr ? "KDV'den İstisna" : 'VAT Exempt',
      gerekce: tr ? "Finans ve sigorta işlemleri KDV'den istisnadır (KDVK md.17/4-e)." : "Financial and insurance transactions are VAT exempt (VAT Law Art. 17/4-e).", guven:0.95 };

  const kurallar = KOD_INTEG?.kayitlar || KOD_INTEG?.kurallar || [];
  for (const k of kurallar){
    if (k.oncelik === 99) continue;
    const e = (kod, pre) => kod && pre?.some(p => kodTemiz(kod).startsWith(kodTemiz(p)));
    if (e(gtipKod, k.gtip_prefix) || e(cpcKod, k.cpc_prefix) || e(naceKod, k.nace_prefix) || e(iscoKod, k.isco_prefix)){
      const ka = aciklamaAdi(k) || k.kod;
      return { kod:k.kdv_kodu, oran:oranBul(k.kdv_kodu), ad:kdvAd(k.kdv_kodu),
        gerekce: tr ? `Kod eşleşmesi: "${ka}" kuralına (${k.kod}) uyuyor.` : `Matched rule "${ka}" (${k.kod}).`, guven:0.90 };
    }
  }
  return { kod:'KDV-01', oran:0.20, ad: tr ? 'Genel Oran' : 'Standard Rate',
    gerekce: tr ? "Özel oran uygulanmayan mal ve hizmetler için genel KDV oranı %20'dir." : "Standard VAT rate of 20% applies to goods and services without a special rate.", guven:0.65 };
}

function otvBul(gtipKod, matrah){
  if (!gtipKod) return null;
  const gt = kodTemiz(gtipKod), tr = DIL === 'tr';
  if (OTV_DATA?.kayitlar?.length){
    for (const k of OTV_DATA.kayitlar){
      if (!(k.gtip_prefix || []).some(p => gt.startsWith(kodTemiz(p)))) continue;
      let oran = k.oran ?? null;
      if (Array.isArray(k.matrah_dilimleri)){
        const m = Number(matrah) || 0;
        for (const d of k.matrah_dilimleri){ if (m >= (d.min_matrah ?? 0) && m <= (d.max_matrah ?? Infinity)){ oran = d.oran; break; } }
      }
      const ad = alanSec(k,'ad') || '', tip = k.vergi_tipi, liste = k.liste || '';
      return { kod:k.kod, liste, tip, oran,
        ad: tr ? `${liste} Sayılı Liste — ${ad}` : `Schedule ${liste} — ${ad}`,
        aciklama: tr ? `${ad} kapsamında ÖTV uygulanır.` + (tip === 'maktu' ? ' Maktu vergi uygulanır.' : '')
                     : `SCT applies under ${ad}.` + (tip === 'maktu' ? ' Fixed amount applied.' : '') };
    }
  }
  // Yedek (veri yoksa)
  if (['2710','2711','2902','2905'].some(p => gt.startsWith(p)))
    return { kod:'OTV-I', ad: tr ? 'I Sayılı Liste — Petrol Ürünleri' : 'Schedule I — Petroleum Products', tip:'maktu',
      aciklama: tr ? 'Akaryakıt/doğal gaz/solvent için maktu ÖTV uygulanır.' : 'Fixed-rate SCT applies to fuel, natural gas and solvents.' };
  if (gt.startsWith('8703')){
    const m = Number(matrah) || 0, oran = m <= 85000 ? 0.45 : m <= 130000 ? 0.50 : 0.80;
    return { kod:'OTV-II', ad: tr ? 'II Sayılı Liste — Otomobil' : 'Schedule II — Passenger Car', tip:'oran', oran,
      aciklama: tr ? `Matrah ${sayi(m)} TL → ÖTV %${(oran*100).toFixed(0)}.` : `Tax base ${sayi(m)} TRY → SCT ${(oran*100).toFixed(0)}%.` };
  }
  if (gt.startsWith('8711')){
    const m = Number(matrah) || 0, oran = m <= 50000 ? 0.37 : 0.60;
    return { kod:'OTV-II', ad: tr ? 'II Sayılı Liste — Motosiklet' : 'Schedule II — Motorcycle', tip:'oran', oran,
      aciklama: tr ? `Matrah ${sayi(m)} TL → ÖTV %${(oran*100).toFixed(0)}.` : `Tax base ${sayi(m)} TRY → SCT ${(oran*100).toFixed(0)}%.` };
  }
  if (['2203','2204','2205','2206','2208','2402','2403'].some(p => gt.startsWith(p)))
    return { kod:'OTV-III', ad: tr ? 'III Sayılı Liste — Alkollü İçecek/Tütün' : 'Schedule III — Alcohol/Tobacco', tip:'karma',
      aciklama: tr ? 'Oran + asgari maktu vergi uygulanır.' : 'Rate + minimum fixed tax applies.' };
  if (['4303','7113','7114','8802','8903'].some(p => gt.startsWith(p)))
    return { kod:'OTV-IV', ad: tr ? 'IV Sayılı Liste — Lüks Ürün' : 'Schedule IV — Luxury Goods', tip:'oran', oran:0.20,
      aciklama: tr ? 'ÖTV IV sayılı liste kapsamındadır (%20).' : 'Subject to SCT Schedule IV (20%).' };
  if (['8418','8450','8508','8516'].some(p => gt.startsWith(p)))
    return { kod:'OTV-IV', ad: tr ? 'IV Sayılı Liste — Elektrikli Ev Aleti' : 'Schedule IV — Electrical Appliance', tip:'oran', oran:0.065,
      aciklama: tr ? 'ÖTV IV sayılı liste kapsamındadır (%6,5).' : 'Subject to SCT Schedule IV (6.5%).' };
  return null;
}

// ============ 6. SONUÇ LİSTESİ ============
const kaynakAdi = tip => ({ gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' }[tip]);

function sonuclariCiz(sonuclar){
  const alan = $('sonuc-alani');
  const q = $('arama').value.trim();

  if (!sonuclar.length){
    if (!q && AKTIF_FILTRE === 'hepsi'){
      alan.innerHTML = `<div class="bos-durum"><div class="ikon">🏷️</div><h3>${kacis(t('bos_baslik'))}</h3><p>${kacis(t('bos_aciklama'))}</p></div>`;
    } else if (bekleyenSayisi() > 0){
      alan.innerHTML = `<div class="bos-durum"><div class="ikon"><span class="cember" style="width:30px;height:30px"></span></div><h3>${kacis(t('bekle_b'))}</h3><p>${kacis(t('bekle_p'))}</p></div>`;
    } else {
      alan.innerHTML = `<div class="bos-durum"><div class="ikon">🔎</div><h3>${kacis(t('sonuc_yok_b'))}</h3><p>${kacis(t('sonuc_yok_p'))}</p></div>`;
    }
    return;
  }

  const gruplar = { gtip:[], isco:[], cpc:[], nace:[] };
  for (const s of sonuclar) gruplar[s.kaynak].push(s);
  const duz = [];
  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px;gap:12px;flex-wrap:wrap">
      <span style="font-size:.85rem;color:var(--muted);font-weight:600">${sayi(sonuclar.length)} ${kacis(t('satir'))} — ${kacis(t('agac_gorunumu'))}</span>
      <span style="font-size:.75rem;color:var(--soft)">${kacis(t('baglam_not'))}</span></div>`;

  for (const tip of ['gtip','isco','cpc','nace']){
    const g = gruplar[tip]; if (!g.length) continue;
    const v = VERI[tip], es = g.filter(s => s.eslesme).length;
    if (q && v.toplam > LIM)
      html += `<div class="not-bant">${kacis(kaynakAdi(tip))}: ${kacis(t('kirpildi').replace('{n}', LIM).replace('{t}', sayi(v.toplam)))}</div>`;
    html += `<div class="kaynak-baslik"><span class="kaynak-etiket kaynak-${tip}">${kaynakAdi(tip)}</span>
        <span>${kaynakAdi(tip)} ${kacis(t('kod_baslik'))}</span>
        <span class="sayi">${sayi(es)} ${kacis(t('eslesme'))} · ${sayi(g.length)} ${kacis(t('satir'))}</span></div>
      <div class="sonuc-liste">${g.map(s => { duz.push(s); return satirHTML(s, duz.length - 1); }).join('')}</div>`;
  }
  alan.innerHTML = html;
  alan._duz = duz;
}

function satirHTML(s, idx){
  const { kaynak, kayit, eslesme } = s;
  let mini = '';
  if (eslesme && kayit.kdv_kodu){
    const oran = oranBul(kayit.kdv_kodu);
    mini += `<span class="mr-kdv ${oran === 0 ? 'sifir' : ''}">${DIL === 'tr' ? 'KDV' : 'VAT'} ${oran !== null ? '%' + (oran*100).toFixed(0) : kacis(t('istisna'))}</span>`;
  }
  if (eslesme && kayit.otv_kodu) mini += `<span class="mr-otv">${kacis(t('otv'))}</span>`;
  return `<div class="sonuc-satir ${eslesme ? 'eslesme' : 'ata'}" data-idx="${idx}" data-seviye="${gercekSeviye(kayit, kaynak)}">
    <span class="kaynak-etiket kaynak-${kaynak}">${kaynakAdi(kaynak)}</span>
    <div class="sonuc-metin"><b>${kacis(kayitAdi(kayit))}</b><code>${kacis(kayit._kod)}</code>
      ${kayit.seviye_adi ? `<span class="seviye-rozet">${kacis(kayit.seviye_adi)}</span>` : ''}</div>
    ${mini ? `<div class="mini-rozet">${mini}</div>` : ''}</div>`;
}

// Tek olay dinleyici (event delegation) — her yeniden çizimde yüzlerce dinleyici eklenmez
$('sonuc-alani').addEventListener('click', e => {
  const el = e.target.closest('.sonuc-satir'); if (!el) return;
  document.querySelectorAll('.sonuc-satir.aktif').forEach(x => x.classList.remove('aktif'));
  el.classList.add('aktif');
  detayGoster($('sonuc-alani')._duz[Number(el.dataset.idx)]);
});

// ============ 7. DETAY ============
function detayGoster(s){
  const { kaynak, kayit } = s, kod = kayit._kod, ad = kayitAdi(kayit), tr = DIL === 'tr';
  const adDiger = tr ? (kayit.tanim_en || kayit.ad_en) : (kayit.tanim_tr || kayit.ad_tr);

  let kdv;
  if (kayit.kdv_kodu){
    kdv = { kod:kayit.kdv_kodu, oran:oranBul(kayit.kdv_kodu), ad:kdvAd(kayit.kdv_kodu), guven:0.95,
      gerekce: tr ? `"${ad}" kaydının kataloğunda tanımlı KDV kodu: ${kayit.kdv_kodu}.` : `VAT code defined in the catalog for "${ad}": ${kayit.kdv_kodu}.` };
  } else {
    kdv = kdvBul({ gtipKod: kaynak==='gtip'?kod:null, cpcKod: kaynak==='cpc'?kod:null, naceKod: kaynak==='nace'?kod:null, iscoKod: kaynak==='isco'?kod:null, islemTipi:'satis' });
  }
  const otv = otvBul(kaynak === 'gtip' ? kod : null, 0) ||
    (kayit.otv_kodu ? { kod:kayit.otv_kodu, ad: tr ? 'ÖTV uygulanır' : 'SCT applies', tip:'oran',
      aciklama: tr ? 'İlgili ÖTV listesine tabidir.' : 'Subject to the relevant SCT schedule.' } : null);

  let kdvSinif = 'kdv', oranSinif = 'accent';
  if (kdv.oran === 0.01) oranSinif = 'ok';
  else if (kdv.oran === 0.10) oranSinif = 'amber';
  else if (kdv.oran === 0){ kdvSinif += ' istisna'; oranSinif = 'ok'; }
  else if (kdv.kod === 'KDV-MUAF'){ kdvSinif += ' istisna'; oranSinif = 'ok'; }
  const kdvMetin = kdv.oran === null ? t('istisna') : kdv.oran === 0 ? '%0' : '%' + (kdv.oran*100).toFixed(0);

  let otvMetin = '—';
  if (otv) otvMetin = otv.oran != null ? '%' + (otv.oran*100).toFixed(1).replace(/\.0$/, '') : otv.tip === 'maktu' ? t('maktu') : t('karma');

  const kap = $('detay-kap'); kap.style.display = 'block';
  kap.innerHTML = `
    <div class="detay-ust"><div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <span class="kaynak-etiket kaynak-${kaynak}">${kaynakAdi(kaynak)}</span><span class="kod">${kacis(kod)}</span></div>
      <h2>${kacis(ad)}</h2>
      ${adDiger ? `<p style="font-size:.85rem;color:var(--muted);margin-top:6px">${kacis(adDiger)}</p>` : ''}
    </div><button class="kapat-btn" title="${kacis(t('kapat'))}" id="kapat-btn">✕</button></div>

    <div class="vergi-izgara">
      <div class="vergi-kart ${kdvSinif}">
        <div class="vk-baslik"><span>${kacis(t('kdv_orani'))}</span><span>${kacis(kdv.kod)}</span></div>
        <div class="vk-oran ${oranSinif}">${kacis(kdvMetin)}</div>
        <div class="vk-ad"><strong>${kacis(kdv.ad)}</strong></div>
        <div class="vk-detay">${kacis(kdv.gerekce)}</div></div>
      ${otv ? `<div class="vergi-kart otv">
        <div class="vk-baslik"><span>${kacis(t('otv'))}</span><span>${kacis(otv.kod)}</span></div>
        <div class="vk-oran amber">${kacis(otvMetin)}</div>
        <div class="vk-ad"><strong>${kacis(otv.ad)}</strong></div>
        <div class="vk-detay">${kacis(otv.aciklama)}</div></div>`
      : `<div class="vergi-kart yok">
        <div class="vk-baslik"><span>${kacis(t('otv'))}</span><span>—</span></div>
        <div class="vk-oran muted">${kacis(t('otv_yok'))}</div>
        <div class="vk-ad">${kacis(t('otv_yok_aciklama'))}</div></div>`}
    </div>

    <div class="gerekce-kart"><h3>📋 ${kacis(t('gerekce_baslik'))}</h3><ul>
      <li><strong>${kacis(t('kaynak_katalog'))}:</strong> ${kaynakAdi(kaynak)}<small>${kacis(kod)} — ${kacis(ad)}</small></li>
      <li><strong>${kacis(t('kdv_karari'))}:</strong> ${kacis(kdv.kod)} (${kacis(kdvMetin)})<small>${kacis(kdv.gerekce)}</small></li>
      <li><strong>${kacis(t('otv_karari'))}:</strong> ${otv ? kacis(otv.kod) : kacis(t('otv_uygulanmaz'))}<small>${kacis(otv ? otv.aciklama : t('otv_uygulanmaz_a'))}</small></li>
    </ul></div>

    <div class="guven-kart"><span class="guven-baslik">${kacis(t('guven'))}</span>
      <div class="guven-bar"><div class="guven-dolgu" style="width:${(kdv.guven*100).toFixed(0)}%"></div></div>
      <span class="guven-sayi">${(kdv.guven*100).toFixed(0)}%</span></div>`;

  $('kapat-btn').onclick = () => { kap.style.display = 'none'; document.querySelectorAll('.sonuc-satir.aktif').forEach(x => x.classList.remove('aktif')); };
  kap.scrollIntoView({ behavior:'smooth', block:'start' });
}

// ============ 8. OLAYLAR ============
let az;
$('arama').addEventListener('input', () => {
  clearTimeout(az);
  az = setTimeout(() => { yenidenAra(); $('detay-kap').style.display = 'none'; }, 120);
});
$('filtreler').addEventListener('click', e => {
  const b = e.target.closest('.cip'); if (!b) return;
  if (b.classList.contains('hata')){ kaynakYukle(b.dataset.tip); return; }  // hata ise tıklayınca tekrar dene
  document.querySelectorAll('.cip').forEach(x => x.classList.remove('aktif'));
  b.classList.add('aktif'); AKTIF_FILTRE = b.dataset.tip;
  yenidenAra(); $('detay-kap').style.display = 'none';
});
document.querySelectorAll('.yardim code').forEach(el => el.addEventListener('click', () => {
  $('arama').value = el.dataset.ornek; yenidenAra();
}));
$('dil-degistirici').addEventListener('click', e => { const b = e.target.closest('button'); if (b) dilDegistir(b.dataset.dil); });

// ============ 9. BAŞLAT ============
dilUygula();
yenidenAra();   // arayüz anında hazır
baslat();       // veri arka planda akar
</script>
