  <script>
  const UI = {

      marka_alt:        "HS · ISCO · CPC · NACE → VAT & SCT",
      nav_portal:       "Portal",

      otv_karari:       "SCT decision",
      otv_uygulanmaz:   "Not applicable",
      otv_uygulanmaz_a: "Product/service not listed in SCT schedules.",
      guven:            "Confidence",
      istisna:          "Exempt",
      maktu:            "Fixed",
      karma:            "Mixed",
      yukleniyor:       "Loading data sources…",
      eksik_kaynak:     "data sources could not be loaded",
      konsol_notu:      "Open DevTools (F12) to see which URLs failed.",
      kapat:            "Close",
    },
    tr: {
      marka_alt:        "GTİP · ISCO · CPC · NACE → KDV & ÖTV",
      nav_portal:       "Portal",
      nav_products:     "Ürün Arama",
      nav_curator:      "Küratör",
      sistem_aktif:     "Sistem Aktif",
      arama_yer:        "Ürün adı, GTİP, ISCO, CPC veya NACE kodu yazın…",
      filtre_hepsi:     "Tümü",
      ornek_baslik:     "Örnekler:",
      bos_baslik:       "Aramaya başlayın",
      bos_aciklama:     "Ürün adı, GTİP, ISCO (meslek), CPC veya NACE kodu yazın. Bir filtre seçip kutu boş bırakırsanız tüm ağaç görünür.",
      sonuc_yok_b:      "Sonuç bulunamadı",
      sonuc_yok_p:      "Farklı bir anahtar kelime veya kod deneyin. Örneğin: gömlek, 6105, 5120, otel.",
      satir:            "satır",
      agac_gorunumu:    "ağaç görünümü",
      baglam_not:       "Soluk satırlar bağlam · Koyu satırlar arama eşleşmesi",
      eslesme:          "eşleşme",
      kod_baslik:       "Kodları",
      kdv_orani:        "KDV Oranı",
      otv:              "ÖTV",
      otv_yok:          "Yok",
      otv_yok_aciklama: "Bu ürün/hizmet ÖTV kapsamında değildir.",
      gerekce_baslik:   "Karar Gerekçesi",
      kaynak_katalog:   "Kaynak katalog",
      kdv_karari:       "KDV kararı",
      otv_karari:       "ÖTV kararı",
      otv_uygulanmaz:   "Uygulanmaz",
      otv_uygulanmaz_a: "Ürün/hizmet ÖTV listelerinde yer almıyor.",
      guven:            "Güven Skoru",
      istisna:          "İstisna",
      maktu:            "Maktu",
      karma:            "Karma",
      yukleniyor:       "Veri kaynakları yükleniyor…",
      eksik_kaynak:     "kaynak yüklenemedi",
      konsol_notu:      "Konsolda (F12) hangi URL'lerin başarısız olduğunu görebilirsiniz.",
      kapat:            "Kapat",
    }
  };

  const TIP_SOZLUK = {
    tr: { liste:'Liste', agac:'Ağaç', harita:'Harita', tablo:'Tablo' },
    en: { liste:'List',  agac:'Tree', harita:'Map',    tablo:'Table' }
  };

  let DIL = 'en';

  function t(k){ return (UI[DIL] && UI[DIL][k]) || k; }

  function alanSec(obj, temelAd){
    if(!obj) return '';
    const en = obj[temelAd + '_en'];
    const tr = obj[temelAd + '_tr'];
    const eski = obj[temelAd];
    if(DIL === 'en') return en || tr || eski || '';
    return tr || eski || en || '';
  }

  function kayitAdi(k){
    const a = alanSec(k, 'tanim'); if(a) return a;
    const b = alanSec(k, 'ad');    if(b) return b;
    return '—';
  }

  function aciklamaAdi(o){ return alanSec(o, 'aciklama'); }

  const $ = id => document.getElementById(id);
  const kacis = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tr_lower = s => String(s ?? '').toLocaleLowerCase('tr-TR');
  const sayi = n => (n == null ? '—' : Number(n).toLocaleString(DIL === 'tr' ? 'tr-TR' : 'en-US'));
  const normKod = k => String(k ?? '').trim().replace(/\s+/g,'');
  const kodTemiz = k => normKod(k).replace(/\./g,'');

  function dilUygula(){
    document.documentElement.lang = DIL;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });

    const trBtn = $('lang-tr'), enBtn =$('lang-en');
    if(DIL === 'tr'){
      trBtn.className = 'px-2.5 py-1 rounded bg-win-500 text-white transition';
      enBtn.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-white transition';
    }else{
      enBtn.className = 'px-2.5 py-1 rounded bg-win-500 text-white transition';
      trBtn.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-white transition';
    }
  }

  function dilDegistir(yeni){
    if(yeni === DIL) return;
    DIL = yeni;
    dilUygula();
    const q = $('arama').value.trim();
    sonuclariCiz(kaynaklariTara(q, AKTIF_FILTRE));
    $('detay-kap').classList.add('hidden');
  }

  (function dilBelirle(){
    const url = new URLSearchParams(location.search).get('lang');
    if(url && ['tr','en'].includes(url)){ DIL = url; return; }
    DIL = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en';
  })();

  const VERI = {
    gtip: { kayitlar: [], yuklendi: false },
    isco: { kayitlar: [], yuklendi: false },
    cpc:  { kayitlar: [], yuklendi: false },
    nace: { kayitlar: [], yuklendi: false }
  };
  let KDV_DATA = null;
  let OTV_DATA = null;
  let KOD_INTEG = null;
  let AKTIF_FILTRE = 'hepsi';
  let AKTIF_KAYIT = null;
  let DETAY_LISTESI = [];
  let klavyeOdakIndex = -1;

  async function fetchJSON(yol){
    try{
      const r = await fetch(yol, { headers:{Accept:'application/json'} });
      if(!r.ok) return { ok:false, status:r.status, yol };
      return { ok:true, data: await r.json(), yol };
    }catch(e){
      return { ok:false, status:0, yol, hata:e.message };
    }
  }

  async function ilkBasari(anahtar, yollar){
    for(const y of yollar){
      const r = await fetchJSON(y);
      if(r.ok && r.data) return { ...r, denenen:yollar };
    }
    return { ok:false, data:null, yol:yollar[0], denenen:yollar };
  }

  async function tumVeriYukle(){
    const durum = $('durum-alani');
    durum.innerHTML = `
      <div class="bg-win-card border border-win-border rounded-xl p-4 flex items-center gap-3 text-win-100 text-xs">
        <div class="inline-block w-4 h-4 border-2 border-win-500 border-t-transparent rounded-full animate-spin"></div>
        <span>${t('yukleniyor')}</span>
      </div>`;

    const gorevler = {
      gtip:  ['/api/v1/tb/gtip-kodlari',   '/api/v1/genel/gtip-kodlari'],
      isco:  ['/api/v1/csgb/isco-kodlari', '/api/v1/genel/isco-kodlari'],
      cpc:   ['/api/v1/tb/cpc-kodlari',    '/api/v1/genel/cpc-kodlari'],
      nace:  ['/api/v1/hvmb/nace-kodlari', '/api/v1/tb/nace-kodlari', '/api/v1/genel/nace-kodlari'],
      kdv:   ['/api/v1/hvmb/kdv-oranlari', '/api/v1/hmb/kdv-oranlari'],
      otv:   ['/api/v1/hvmb/otv-oranlari', '/api/v1/hmb/otv-oranlari'],
      integ: ['/api/v1/genel/kod-entegrasyon', '/api/v1/tb/kod-entegrasyon', '/api/v1/hvmb/kod-entegrasyon']
    };

    const anahtarlar = Object.keys(gorevler);
    const sonuclar = await Promise.all(anahtarlar.map(k => ilkBasari(k, gorevler[k])));

    anahtarlar.forEach((anahtar, i) => {
      const r = sonuclar[i];
      if(r.ok && r.data){
        if(anahtar === 'kdv')   KDV_DATA  = r.data;
        if(anahtar === 'otv')   OTV_DATA  = r.data;
        if(anahtar === 'integ') KOD_INTEG = r.data;
        if(VERI[anahtar]){
          VERI[anahtar].kayitlar = r.data.kayitlar || r.data.kurallar || [];
          VERI[anahtar].yuklendi = true;
        }
      }
    });
    durum.innerHTML = '';
    sayilariGuncelle();
  }

  function sayilariGuncelle(){
    const c = v => v.kayitlar.length;
    $('sayi-gtip').textContent  = sayi(c(VERI.gtip));$('sayi-isco').textContent  = sayi(c(VERI.isco));
    $('sayi-cpc').textContent   = sayi(c(VERI.cpc));$('sayi-nace').textContent  = sayi(c(VERI.nace));
  }

  function karsilastirKod(a, b){
    const parcala = s => String(s).match(/\d+|[A-Za-zĞÜŞİÖÇğüşıöç]+/g) || [];
    const A = parcala(a), B = parcala(b);
    const n = Math.min(A.length, B.length);
    for(let i = 0; i < n; i++){
      const x = A[i], y = B[i];
      const xn = /^\d+$/.test(x), yn = /^\d+$/.test(y);
      if(xn && yn){
        const d = parseInt(x, 10) - parseInt(y, 10);
        if(d !== 0) return d;
      }else if(!xn && !yn){
        const c = x.localeCompare(y, 'tr');
        if(c !== 0) return c;
      }else{
        return xn ? -1 : 1;
      }
    }
    return A.length - B.length;
  }

  function gtipZinciri(kod){
    const tk = kodTemiz(kod);
    if(!/^\d+$/.test(tk)) return [normKod(kod)];
    const dilimler = [2, 4, 6, 8, 10, 12];
    const zincir = [];
    for(const d of dilimler){
      if(tk.length >= d) zincir.push(tk.slice(0, d));
    }
    return zincir;
  }

  function kayitYolu(kayit, kodMap, onbellek, kaynakTip){
    const kk = normKod(kayit.kod);
    const anahtar = kaynakTip + '::' + kk;
    if(onbellek.has(anahtar)) return onbellek.get(anahtar);

    let zincir = [];
    if(kaynakTip === 'gtip'){
      const g = gtipZinciri(kayit.kod);
      zincir = g.filter(x => kodMap.has(x));
      if(zincir[zincir.length-1] !== kk) zincir.push(kk);
    }else{
      const gorulen = new Set();
      let m = kayit;
      while(m){
        const mk = normKod(m.kod);
        if(gorulen.has(mk)) break;
        gorulen.add(mk);
        zincir.unshift(mk);
        m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
      }
    }
    onbellek.set(anahtar, zincir);
    return zincir;
  }

  function ataZinciri(kayit, kodMap, kaynakTip){
    const kod = normKod(kayit.kod);
    if(kaynakTip === 'gtip'){
      const g = gtipZinciri(kod);
      const kayitlar = [];
      for(const x of g){
        const k = kodMap.get(x);
        if(k) kayitlar.push(k);
      }
      const son = kayitlar[kayitlar.length-1];
      if(!son || normKod(son.kod) !== kod) kayitlar.push(kayit);
      return kayitlar;
    }
    const zincir = [];
    const gorulen = new Set();
    let m = kayit;
    while(m){
      const mk = normKod(m.kod);
      if(gorulen.has(mk)) break;
      gorulen.add(mk);
      zincir.unshift(m);
      m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
    }
    return zincir;
  }

  function hiyerarsiSirala(sonuclar, tumKayitlar, kaynakTip){
    const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
    const onbellek = new Map();
    return [...sonuclar].sort((a, b) => {
      const A = kayitYolu(a.kayit, kodMap, onbellek, kaynakTip);
      const B = kayitYolu(b.kayit, kodMap, onbellek, kaynakTip);
      const n = Math.min(A.length, B.length);
      for(let i = 0; i < n; i++){
        const c = karsilastirKod(A[i], B[i]);
        if(c !== 0) return c;
      }
      return A.length - B.length;
    });
  }

  function agacKur(kaynakTip, tumKayitlar, eslesenKodlar){
    const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
    const dahil = new Map();
    for(const kod of eslesenKodlar){
      const k = kodMap.get(kod);
      if(!k) continue;
      const zincir = ataZinciri(k, kodMap, kaynakTip);
      zincir.forEach((z, i) => {
        const zk = normKod(z.kod);
        const sonuncu = (i === zincir.length - 1);
        const mevcut = dahil.get(zk);
        if(!mevcut) dahil.set(zk, { kayit:z, eslesme:sonuncu });
        else if(sonuncu) mevcut.eslesme = true;
      });
    }
    const liste = [...dahil.values()].map(x => ({
      kaynak: kaynakTip, kayit: x.kayit, eslesme: x.eslesme
    }));
    return hiyerarsiSirala(liste, tumKayitlar, kaynakTip);
  }

  function kaynaklariTara(q, filtre){
    const sorgu = tr_lower(q || '');
    const sorguTemiz = sorgu.replace(/\./g,'').replace(/\s/g,'');
    const tekKaynak = filtre !== 'hepsi';
    if(!sorgu && !tekKaynak) return [];

    const kaynaklar = [];
    if(filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
    if(filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
    if(filtre === 'hepsi' || filtre === 'cpc')  kaynaklar.push(['cpc',  VERI.cpc]);
    if(filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

    const tumSonuclar = [];
    for(const [kaynakTip, veri] of kaynaklar){
      const eslesenKodlar = [];
      for(const k of veri.kayitlar){
        if(!sorgu){ eslesenKodlar.push(normKod(k.kod)); continue; }

        const kod    = normKod(k.kod);
        const kodL   = tr_lower(kod);
        const kodT   = kodTemiz(kod);
        const adTr   = tr_lower(k.tanim_tr || k.ad_tr || k.ad || '');
        const adEn   = tr_lower(k.tanim_en || k.ad_en || '');
        const seviye = tr_lower(k.seviye_adi || '');

        let ok = false;
        if(kodL === sorgu || kodT === sorguTemiz) ok = true;
        else if(kodL.startsWith(sorgu))           ok = true;
        else if(kodT.startsWith(sorguTemiz))      ok = true;
        else if(adTr.startsWith(sorgu))           ok = true;
        else if(adTr.includes(sorgu))             ok = true;
        else if(adEn.startsWith(sorgu))           ok = true;
        else if(adEn.includes(sorgu))             ok = true;
        else if(kodL.includes(sorgu))             ok = true;
        else if(seviye.includes(sorgu))           ok = true;

        if(ok) eslesenKodlar.push(kod);
      }
      tumSonuclar.push(...agacKur(kaynakTip, veri.kayitlar, eslesenKodlar));
    }
    return tumSonuclar;
  }

  function oranBul(kdvKodu){
    if(!KDV_DATA?.kayitlar) return null;
    const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
    return k ? k.oran : null;
  }

  function kdvAd(kdvKodu){
    if(!KDV_DATA?.kayitlar) return kdvKodu;
    const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
    if(!k) return kdvKodu;
    return aciklamaAdi(k) || kdvKodu;
  }

  function otvBul(gtipKod, matrah){
    if(!gtipKod) return null;
    const gt = kodTemiz(gtipKod);
    if(OTV_DATA?.kayitlar?.length){
      for(const k of OTV_DATA.kayitlar){
        const pref = k.gtip_prefix || [];
        if(!pref.some(p => gt.startsWith(kodTemiz(p)))) continue;
        let oran = k.oran ?? null;
        const ad = alanSec(k, 'ad') || '';
        return {
          kod: k.kod, liste: k.liste || '',
          ad: DIL === 'tr' ? `${k.liste} Sayılı Liste — ${ad}` : `Schedule ${k.liste} — ${ad}`,
          tip: k.vergi_tipi, oran,
          aciklama: DIL === 'tr' ? `${ad} kapsamında ÖTV uygulanır.` : `SCT applies under ${ad}.`
        };
      }
    }
    return null;
  }

  function gercekSeviye(kayit, kaynakTip){
    if(kaynakTip === 'gtip'){
      const tk = kodTemiz(kayit.kod);
      if(!/^\d+$/.test(tk)) return 1;
      if(tk.length <= 2) return 2;
      if(tk.length <= 4) return 3;
      if(tk.length <= 6) return 4;
      if(tk.length <= 8) return 5;
      if(tk.length <= 10) return 6;
      return 7;
    }
    return Math.max(1, Number(kayit.seviye) || 1);
  }

  const KAYNAK_ETIKET_SINIF = { gtip:'etiket-hs', isco:'etiket-isco', cpc:'etiket-cpc', nace:'etiket-nace' };

  function sonuclariCiz(sonuclar){
    const alan = $('sonuc-alani');
    klavyeOdakIndex = -1;

    if(!sonuclar.length){
      alan.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center py-16 text-center max-w-lg mx-auto">
          <div class="w-20 h-20 rounded-2xl bg-win-card border border-win-border text-slate-500 flex items-center justify-center text-3xl mb-6">🔎</div>
          <h2 class="text-xl font-bold text-white tracking-tight mb-2">${kacis(t('sonuc_yok_b'))}</h2>
          <p class="text-sm text-slate-400 leading-relaxed">${kacis(t('sonuc_yok_p'))}</p>
        </div>`;
      DETAY_LISTESI = [];
      return;
    }

    const gruplar = { gtip:[], isco:[], cpc:[], nace:[] };
    for(const s of sonuclar) gruplar[s.kaynak].push(s);
    const kaynakAd = { gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' };

    DETAY_LISTESI = [];
    let html = `
      <div class="flex items-center justify-between text-xs text-slate-400 px-1">
        <span class="font-semibold">${sayi(sonuclar.length)} ${kacis(t('satir'))} — ${kacis(t('agac_gorunumu'))}</span>
        <span class="text-slate-500">${kacis(t('baglam_not'))}</span>
      </div>`;

    for(const kaynak of ['gtip','isco','cpc','nace']){
      const g = gruplar[kaynak];
      if(!g.length) continue;
      const eslesmeSayisi = g.filter(s => s.eslesme).length;

      html += `
        <div class="bg-win-card border border-win-border rounded-xl overflow-hidden shadow-xl">
          <div class="flex items-center gap-2 px-4 py-3 border-b border-win-border bg-win-dark">
            <span class="etiket-${kaynak==='gtip'?'hs':kaynak} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${kaynakAd[kaynak]}</span>
            <span class="text-xs font-bold text-slate-300">${kaynakAd[kaynak]} ${kacis(t('kod_baslik'))}</span>
            <span class="ml-auto text-[10px] text-slate-500 font-medium">${sayi(eslesmeSayisi)} ${kacis(t('eslesme'))} · ${sayi(g.length)} ${kacis(t('satir'))}</span>
          </div>
          <div class="divide-y divide-win-border">
            ${g.map(s => {
              DETAY_LISTESI.push(s);
              return sonucKartHTML(s, DETAY_LISTESI.length - 1);
            }).join('')}
          </div>
        </div>`;
    }
    alan.innerHTML = html;
  }

  function sonucKartHTML(s, idx){
    const { kaynak, kayit, eslesme } = s;
    const kod = normKod(kayit.kod);
    const ad  = kayitAdi(kayit);
    const lvl = gercekSeviye(kayit, kaynak);
    const seviye = kayit.seviye_adi ? `<span class="text-[10px] text-slate-500 font-mono ml-1">${kacis(kayit.seviye_adi)}</span>` : '';
    const kaynakAd = { gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' }[kaynak];
    const etiketSinif = KAYNAK_ETIKET_SINIF[kaynak];

    let mini = '';
    if(eslesme && kayit.kdv_kodu){
      const oran = oranBul(kayit.kdv_kodu);
      const renk = oran === 0 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-win-500/10 text-win-100 border-win-500/20';
      const etiket = DIL === 'tr' ? 'KDV' : 'VAT';
      mini += `<span class="px-2 py-0.5 rounded-full border text-[10px] font-bold ${renk}">${etiket} ${oran !== null ? '%'+(oran*100).toFixed(0) : kacis(t('istisna'))}</span>`;
    }

    const opaklik = eslesme ? '' : 'opacity-50';
    const arka = eslesme ? 'bg-win-dark/60 border-l-2 border-win-500' : '';
    const kalınlık = eslesme ? 'font-semibold text-slate-100' : 'text-slate-400';

    return `
      <div class="tree-row ${opaklik} ${arka} flex items-center gap-3 pr-4 py-2.5 hover:bg-win-hover transition cursor-pointer"
           data-lvl="${lvl}" data-idx="${idx}" id="kart-${idx}">
        <span class="${etiketSinif} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider flex-none">${kaynakAd}</span>
        <div class="flex-1 min-w-0">
          <div class="text-sm ${kalınlık} truncate">${kacis(ad)}</div>
          <div class="flex items-center gap-1.5 mt-0.5">
            <code class="text-[11px] font-mono text-slate-500 bg-win-base px-1.5 py-0.5 rounded">${kacis(kod)}</code>
            ${seviye}
          </div>
        </div>
        ${mini ? `<div class="flex-none flex items-center gap-1.5">${mini}</div>` : ''}
      </div>`;
  }

  function detayGoster(s, updateHash = true){
    const { kaynak, kayit } = s;
    AKTIF_KAYIT = s;
    const kod = normKod(kayit.kod);
    const ad  = kayitAdi(kayit);
    const kaynakAd = { gtip: DIL === 'tr' ? 'GTİP' : 'HS', isco:'ISCO', cpc:'CPC', nace:'NACE' }[kaynak];
    const etiketSinif = KAYNAK_ETIKET_SINIF[kaynak];

    if(updateHash) history.replaceState(null, '', `#${kaynak}-${kod}`);

    let kdv = kayit.kdv_kodu ? {
      kod: kayit.kdv_kodu,
      oran: oranBul(kayit.kdv_kodu),
      ad: kdvAd(kayit.kdv_kodu),
      gerekce: DIL === 'tr' ? `Katalog KDV Kodu: ${kayit.kdv_kodu}` : `Catalog VAT Code: ${kayit.kdv_kodu}`,
      guven: 0.95
    } : { kod:'KDV-01', oran:0.20, ad: 'Standard Rate', gerekce: 'Standard VAT', guven:0.65 };

    const otv = otvBul(kaynak === 'gtip' ? kod : null, 0);
    const istisna = (kdv.oran === 0 || kdv.oran === null);
    const kdvOranMetin = kdv.oran === null ? kacis(t('istisna')) : kdv.oran === 0 ? '%0' : '%' + (kdv.oran*100).toFixed(0);

    const kap = $('detay-kap');
    kap.classList.remove('hidden');
    kap.innerHTML = `
      <div class="bg-win-card border border-win-border rounded-xl shadow-xl overflow-hidden">
        <div class="p-5 border-b border-win-border flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="${etiketSinif} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${kaynakAd}</span>
              <code class="text-xs font-mono text-win-100 bg-win-500/10 px-2 py-0.5 rounded border border-win-500/20">${kacis(kod)}</code>
            </div>
            <h2 class="text-xl lg:text-2xl font-extrabold text-white tracking-tight">${kacis(ad)}</h2>
          </div>
          <button id="kapat-btn" class="flex-none w-9 h-9 rounded-lg bg-win-dark hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition">✕</button>
        </div>

        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-win-border">
          <div class="bg-win-base border border-win-border rounded-lg p-4">
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">${kacis(t('kdv_orani'))}</div>
            <div class="text-3xl font-extrabold text-win-100 mb-1">${kdvOranMetin}</div>
            <div class="text-xs text-slate-400">${kacis(kdv.ad)}</div>
          </div>
        </div>
      </div>
    `;

    $('kapat-btn').addEventListener('click', () => {
      kap.classList.add('hidden');
      history.replaceState(null, '', location.pathname);
    });
    kap.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  let aramaZaman;
  $('arama').addEventListener('input', (e) => {
    clearTimeout(aramaZaman);
    const q = e.target.value.trim();
    aramaZaman = setTimeout(() => {
      sonuclariCiz(kaynaklariTara(q, AKTIF_FILTRE));
      $('detay-kap').classList.add('hidden');
    }, 150);
  });

  $('sonuc-alani').addEventListener('click', (e) => {
    const el = e.target.closest('.tree-row');
    if(!el) return;
    const idx = Number(el.dataset.idx);
    if(!Number.isFinite(idx) || !DETAY_LISTESI[idx]) return;
    detayGoster(DETAY_LISTESI[idx]);
  });

  $('filtreler').addEventListener('click', (e) => {
    const btn = e.target.closest('.cip');
    if(!btn) return;
    document.querySelectorAll('.cip').forEach(x => {
      x.classList.remove('bg-win-500','text-white');
      x.classList.add('bg-win-dark','text-slate-300');
    });
    btn.classList.add('bg-win-500','text-white');
    btn.classList.remove('bg-win-dark','text-slate-300');
    AKTIF_FILTRE = btn.dataset.tip;
    sonuclariCiz(kaynaklariTara($('arama').value.trim(), AKTIF_FILTRE));$('detay-kap').classList.add('hidden');
  });

  document.querySelectorAll('.ornek-chip').forEach(el => {
    el.addEventListener('click', () => {
      $('arama').value = el.dataset.ornek;
      $('arama').dispatchEvent(new Event('input'));$('arama').focus();
    });
  });

  $('lang-tr').addEventListener('click', () => dilDegistir('tr'));$('lang-en').addEventListener('click', () => dilDegistir('en'));

  // Başlat
  dilUygula();
  tumVeriYukle();
  </script>
</body>
