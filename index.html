<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDaaS — Parametrik Veri Servisi</title>
<style>
  :root{
    --bg:#f7f8fb; --sidebar:#ffffff; --panel:#ffffff; --ink:#111827;
    --muted:#6b7280; --soft:#9ca3af; --line:#e8ebf0; --line-2:#f1f3f7;
    --accent:#4f46e5; --accent-2:#6366f1; --accent-soft:#eef2ff;
    --ok:#059669; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
    --amber:#d97706; --r:14px; --r-s:9px;
    --gölge:0 1px 2px rgba(17,24,39,.04), 0 8px 24px -16px rgba(17,24,39,.15);
    --mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0f1a; --sidebar:#111726; --panel:#111726; --ink:#e8ecf5;
      --muted:#8b95a9; --soft:#5f6b80; --line:#1e2639; --line-2:#161d2e;
      --accent:#818cf8; --accent-2:#a5b4fc; --accent-soft:#1c2340;
      --ok:#34d399; --ok-soft:#0d2a23; --bad:#f87171; --bad-soft:#2a1215;
      --amber:#fbbf24; --gölge:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
  code,pre{font-family:var(--mono);font-size:.86em}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  a{color:var(--accent);text-decoration:none}
  
  .ust{height:60px;background:var(--sidebar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:50}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800}
  .marka b{font-size:.98rem;font-weight:700}
  .marka small{display:block;font-size:.72rem;color:var(--muted)}
  .ust-sag{margin-left:auto;font-size:.82rem;color:var(--muted)}
  .sağlık{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:var(--line-2)}
  .sağlık .nokta{width:7px;height:7px;border-radius:50%;background:var(--ok)}

  .uygulama{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 60px)}
  .agac{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .agac-ust{padding:20px 20px 12px}
  .agac-ust h2{font-size:1.05rem;font-weight:700}
  .agac-ust p{font-size:.82rem;color:var(--muted)}
  .agac-arama{padding:0 16px 12px}
  .agac-arama input{width:100%;height:38px;padding:0 12px 0 34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.88rem}
  .agac-liste{flex:1;overflow-y:auto;padding:6px 12px 20px}

  .bak{border-radius:11px;margin-bottom:6px;overflow:hidden}
  .bak-baslik{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;border-radius:11px;font-size:.9rem;font-weight:600}
  .bak-baslik:hover{background:var(--line-2)}
  .bak.acik .bak-baslik{background:var(--accent-soft);color:var(--accent)}
  .bak-ikon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--line-2)}
  .bak-metin{flex:1;min-width:0}
  .bak-metin b{display:block;font-size:.89rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bak-metin small{display:block;font-size:.74rem;color:var(--muted)}

  .bak-icerik{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s;margin:0 0 0 6px}
  .bak.acik .bak-icerik{grid-template-rows:1fr}
  .bak-icerik-ic{overflow:hidden}

  .srv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px 9px 20px;border-radius:9px;margin:1px 0;font-size:.86rem}
  .srv:hover{background:var(--line-2)}
  .srv.aktif{background:var(--accent);color:#fff}
  .srv-metin{flex:1;min-width:0}
  .srv-metin b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srv-tip{font-size:.68rem;padding:1px 7px;border-radius:999px;background:var(--line-2);color:var(--muted)}
  .srv.aktif .srv-tip{background:rgba(255,255,255,.2);color:#fff}
  .srv-sayi{font-size:.7rem;background:var(--line-2);color:var(--muted);padding:2px 8px;border-radius:999px}
  .srv.aktif .srv-sayi{background:rgba(255,255,255,.2);color:#fff}

  .detay{overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}
  .bos{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;text-align:center;color:var(--muted)}
  .bos-ikon{width:80px;height:80px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:2.2rem;margin-bottom:22px}
  .detay-ic{padding:28px 34px 60px;max-width:1000px;width:100%;margin:0 auto}

  .izgara{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:22px}
  .detay-baslik{margin-bottom:24px}
  .detay-baslik .ust-etiket{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:999px}
  .detay-baslik h1{font-size:1.7rem;font-weight:750;margin-top:8px}

  .uc-nokta{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:20px;box-shadow:var(--gölge)}
  .uc-nokta-etiket{font-size:.74rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .uc-nokta-et{background:var(--ok-soft);color:var(--ok);padding:2px 7px;border-radius:5px;font-size:.68rem}
  .uc-nokta-satir{display:flex;align-items:center;gap:10px}
  .uc-nokta-url{flex:1;background:#0d1117;color:#a5d6ff;padding:12px 15px;border-radius:var(--r-s);font-family:var(--mono);overflow-x:auto}
  .kopya-btn{padding:10px 14px;border-radius:var(--r-s);background:var(--line-2);font-weight:600}
  .kopya-btn.tamam{background:var(--ok-soft);color:var(--ok)}

  .sekmeler{display:flex;gap:2px;border-bottom:1px solid var(--line)}
  .sekme{padding:10px 16px;border-radius:var(--r-s) var(--r-s) 0 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
  .sekme.aktif{color:var(--accent);border-bottom-color:var(--accent)}
  .sekme-panel{display:none;padding-top:20px}
  .sekme-panel.aktif{display:block}

  .veri-kart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--gölge)}
  .veri-kaydir{overflow-x:auto}
  table.veri{width:100%;border-collapse:collapse}
  table.veri th{background:var(--line-2);font-size:.74rem;text-transform:uppercase;color:var(--muted);padding:14px 18px;text-align:left}
  table.veri td{padding:14px 18px;font-size:.88rem;border-bottom:1px solid var(--line-2)}
  table.veri tbody tr:hover td{background:var(--accent-soft)}
  .tablo-alt{padding:12px 18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);background:var(--line-2)}

  .terminal{background:#0d1117;border-radius:var(--r);overflow:hidden;border:1px solid #1f2937;font-family:var(--mono)}
  .terminal-ust{background:#161b22;padding:10px 14px;display:flex;align-items:center;justify-content:between;border-bottom:1px solid #1f2937}
  .terminal-icerik{padding:18px 20px;max-height:500px;overflow:auto;color:#c9d1d9;font-size:.83rem;white-space:pre}
  .yukleniyor{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--muted)}
  .cember{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:don .7s linear infinite}
  @keyframes don{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="ust">
  <div class="marka">
    <span class="logo">P</span>
    <div><b>PDaaS</b><small>Parametrik Veri Servisi</small></div>
  </div>
  <div class="ust-sag">
    <span class="sağlık"><span class="nokta"></span><span id="saglik-metin">Sistem Hazır</span></span>
  </div>
</header>

<div class="uygulama">
  <aside class="agac">
    <div class="agac-ust">
      <h2>Veri Kataloğu</h2>
      <p id="agac-ozet">Yükleniyor…</p>
    </div>
    <div class="agac-arama"><input type="text" id="agac-arama" placeholder="Servis ara…"></div>
    <div class="agac-liste" id="agac-liste">
      <div class="yukleniyor"><span class="cember"></span> Katalog yükleniyor…</div>
    </div>
  </aside>

  <main class="detay">
    <div class="bos" id="bos-durum">
      <div class="bos-ikon">🗂️</div>
      <h3>Bir veri seti seçin</h3>
      <p>Soldaki listeden bir servise tıklayarak verileri ve API uç noktasını inceleyin.</p>
    </div>
    <div class="detay-ic" id="detay-ic" style="display:none;"></div>
  </main>
</div>

<script>
let KATALOG = [];

const $ = id => document.getElementById(id);
const sayi = n => (n == null ? '–' : Number(n).toLocaleString('tr-TR'));
const kacis = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));

function bakanlikIkon(ad=''){
  const a = ad.toLocaleLowerCase('tr-TR');
  if (a.includes('mali') || a.includes('vergi')) return '💰';
  if (a.includes('ticaret') || a.includes('gümrük')) return '🚢';
  if (a.includes('çalışma') || a.includes('sosyal')) return '🤝';
  return '🏛️';
}

async function kopyala(metin, btn){
  try { await navigator.clipboard.writeText(metin); } catch(_){}
  if (btn){
    const eski = btn.innerHTML;
    btn.innerHTML = '✓ Kopyalandı';
    btn.classList.add('tamam');
    setTimeout(() => { btn.innerHTML = eski; btn.classList.remove('tamam'); }, 1600);
  }
}

async function katalogYukle(){
  try {
    const res = await fetch('/api/v1/katalog');
    const data = await res.json();
    KATALOG = data.servisler || [];

    const gruplar = {};
    for (const sv of KATALOG){
      const k = sv.bakanlik_adi || 'Diğer Kurumlar';
      if (!gruplar[k]) gruplar[k] = [];
      gruplar[k].push(sv);
    }

    $('agac-ozet').textContent = `${Object.keys(gruplar).length} kurum · ${KATALOG.length} servis`;

    $('agac-liste').innerHTML = Object.entries(gruplar).map(([kurum, liste]) => `
      <div class="bak acik" data-kurum="${kacis(kurum)}">
        <button class="bak-baslik" type="button">
          <span class="bak-ikon">${bakanlikIkon(kurum)}</span>
          <span class="bak-metin"><b>${kacis(kurum)}</b><small>${liste.length} servis</small></span>
        </button>
        <div class="bak-icerik"><div class="bak-icerik-ic"><div>
          ${liste.map(sv => `
            <button class="srv" type="button" data-endpoint="${kacis(sv.endpoint)}" data-ad="${kacis(sv.servis_adi)}" data-sayi="${sv.kayit_sayisi}">
              <span class="srv-metin"><b>${kacis(sv.servis_adi)}</b><span class="srv-tip">${kacis(sv.tip)}</span></span>
              <span class="srv-sayi">${sayi(sv.kayit_sayisi)}</span>
            </button>
          `).join('')}
        </div></div></div>
      </div>
    `).join('');
  } catch(err) {
    $('agac-liste').innerHTML = `<div class="hata-kutu">Katalog yüklenemedi.</div>`;
  }
}

$('agac-liste').addEventListener('click', (e) => {
  const bakBtn = e.target.closest('.bak-baslik');
  if (bakBtn){ bakBtn.closest('.bak').classList.toggle('acik'); return; }

  const srvBtn = e.target.closest('.srv');
  if (srvBtn){
    document.querySelectorAll('.srv.aktif').forEach(b => b.classList.remove('aktif'));
    srvBtn.classList.add('aktif');
    servisSec({
      endpoint: srvBtn.dataset.endpoint,
      ad: srvBtn.dataset.ad,
      sayi: parseInt(srvBtn.dataset.sayi, 10) || 0
    });
  }
});

async function servisSec(sv){
  $('bos-durum').style.display = 'none';
  const ic = $('detay-ic');
  ic.style.display = 'block';

  const tam = window.location.origin + sv.endpoint;

  ic.innerHTML = `
    <div class="izgara"><button type="button" onclick="location.reload()">Katalog</button> › <span class="son">${kacis(sv.ad)}</span></div>
    <div class="detay-baslik">
      <span class="ust-etiket">${kacis(sv.ad)}</span>
      <h1>${kacis(sv.ad)}</h1>
    </div>
    <div class="uc-nokta">
      <div class="uc-nokta-etiket"><span class="uc-nokta-et">GET</span> API Uç Noktası</div>
      <div class="uc-nokta-satir">
        <code class="uc-nokta-url">${kacis(tam)}</code>
        <button class="kopya-btn" type="button" onclick="kopyala('${tam}', this)">📋 Kopyala</button>
      </div>
    </div>
    <div class="yukleniyor"><span class="cember"></span> Veriler yükleniyor…</div>
  `;

  try {
    const res = await fetch(sv.endpoint);
    const body = await res.json();
    const kayitlar = body.kayitlar || body.data || [];

    ic.innerHTML = `
      <div class="izgara"><button type="button" onclick="location.reload()">Katalog</button> › <span class="son">${kacis(sv.ad)}</span></div>
      <div class="detay-baslik">
        <span class="ust-etiket">${kacis(sv.ad)}</span>
        <h1>${kacis(sv.ad)}</h1>
      </div>
      <div class="uc-nokta">
        <div class="uc-nokta-etiket"><span class="uc-nokta-et">GET</span> API Uç Noktası</div>
        <div class="uc-nokta-satir">
          <code class="uc-nokta-url">${kacis(tam)}</code>
          <button class="kopya-btn" type="button" onclick="kopyala('${tam}', this)">📋 Kopyala</button>
        </div>
      </div>

      <div class="sekmeler">
        <button class="sekme aktif" type="button" onclick="tabloGoster()">📊 Veri Tablosu (${sayi(kayitlar.length)})</button>
        <button class="sekme" type="button" onclick="jsonGoster()">▶ Konsol (JSON)</button>
      </div>

      <div class="sekme-panel aktif" id="panel-tablo">
        <div class="veri-kart">
          <div class="veri-kaydir">
            <table class="veri">
              <thead><tr><th>Kod</th><th>Tanım</th><th>Kapsam</th><th>Kapsam Dışı</th></tr></thead>
              <tbody>
                ${kayitlar.slice(0, 100).map(k => `
                  <tr>
                    <td><b>${kacis(k.kod)}</b></td>
                    <td>${kacis(k.tanim_tr || k.ad)}</td>
                    <td>${kacis(k.kapsam_tr || '—')}</td>
                    <td>${kacis(k.kapsamdisi_tr || '—')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div class="tablo-alt">İlk 100 kayıt gösteriliyor · Toplam <b>${sayi(kayitlar.length)}</b> kayıt</div>
        </div>
      </div>

      <div class="sekme-panel" id="panel-json">
        <div class="terminal">
          <div class="terminal-ust"><span>Yanıt Konsolu</span></div>
          <pre class="terminal-icerik"><code>${kacis(JSON.stringify(body, null, 2))}</code></pre>
        </div>
      </div>
    `;
  } catch(err) {
    ic.innerHTML += `<div class="hata-kutu">Veriler yüklenirken hata oluştu.</div>`;
  }
}

function tabloGoster(){
  document.querySelectorAll('.sekme').forEach(s => s.classList.remove('aktif'));
  document.querySelectorAll('.sekme-panel').forEach(p => p.classList.remove('aktif'));
  event.currentTarget.classList.add('aktif');
  $('panel-tablo').classList.add('aktif');
}

function jsonGoster(){
  document.querySelectorAll('.sekme').forEach(s => s.classList.remove('aktif'));
  document.querySelectorAll('.sekme-panel').forEach(p => p.classList.remove('aktif'));
  event.currentTarget.classList.add('aktif');
  $('panel-json').classList.add('aktif');
}

$('agac-arama').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.srv').forEach(srv => {
    const ad = srv.dataset.ad.toLowerCase();
    srv.style.display = ad.includes(q) ? '' : 'none';
  });
});

katalogYukle();
</script>
</body>
</html>
