name: PDaaS Şema Doğrulama

on:
  push:
    paths:
      - '**.json'
      - 'schema.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate all JSON files
        run: |
          python - <<'EOF'
          import json, glob, sys
          from jsonschema import Draft202012Validator

          with open("schema.json") as f:
              schema = json.load(f)
          validator = Draft202012Validator(schema)

          errors = 0
          for path in glob.glob("**/*.json", recursive=True):
              if "node_modules" in path or ".git" in path:
                  continue
              if path in ("schema.json", "manifest.json"):
                  continue  # bunlar kendine özel
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  for err in validator.iter_errors(data):
                      print(f"❌ {path}: {err.message}")
                      errors += 1
              except json.JSONDecodeError as e:
                  print(f"❌ {path}: JSON parse hatası — {e}")
                  errors += 1

          if errors:
              sys.exit(1)
          print("✅ Tüm dosyalar şemaya uygun")
          EOF
