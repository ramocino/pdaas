<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDaaS · Ürün & Meslek Vergi Sorgulama</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/pdaas-tailwind.js"></script>
  <link rel="stylesheet" href="assets/pdaas.css">
</head>

<body class="bg-win-base text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-win-500 selection:text-white">

  <div id="pdaas-header"></div>

    <main class="flex-1 px-4 lg:px-8 pt-3 pb-8 flex flex-col gap-4 max-w-6xl mx-auto w-full" id="main-content">
    <div id="durum-alani" class="hidden"></div>

    <div class="bg-win-card border border-win-border rounded-xl shadow-xl overflow-hidden sticky top-20 z-30 glass-panel">
      <div class="p-4 space-y-4">
        <div class="relative">
          <svg class="w-5 h-5 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="arama" class="w-full h-12 pl-12 pr-4 bg-win-base border border-win-border rounded-lg text-white text-sm font-medium focus:outline-none focus:border-win-500 transition placeholder-slate-500" data-i18n-placeholder="arama_yer" placeholder="Ürün adı, GTİP, ISCO, CPC veya NACE kodu yazın…" autocomplete="off" autofocus>
        </div>

        <div class="flex flex-wrap items-center gap-2" id="filtreler">
          <button class="cip aktif px-3 py-1.5 rounded text-xs font-bold transition bg-win-500 text-white" data-tip="hepsi" data-i18n="filtre_hepsi">Tümü</button>
          <button class="cip px-3 py-1.5 rounded text-xs font-bold transition bg-win-dark text-slate-300 hover:bg-win-hover border border-win-border flex items-center gap-1.5" data-tip="gtip">
            <span>📦 GTİP</span> <span class="px-1.5 py-0.5 text-[10px] bg-win-base rounded" id="sayi-gtip">0</span>
          </button>
          <button class="cip px-3 py-1.5 rounded text-xs font-bold transition bg-win-dark text-slate-300 hover:bg-win-hover border border-win-border flex items-center gap-1.5" data-tip="cpc">
            <span>⚙️ CPC</span> <span class="px-1.5 py-0.5 text-[10px] bg-win-base rounded" id="sayi-cpc">0</span>
          </button>
          <button class="cip px-3 py-1.5 rounded text-xs font-bold transition bg-win-dark text-slate-300 hover:bg-win-hover border border-win-border flex items-center gap-1.5" data-tip="nace">
            <span>🏭 NACE</span> <span class="px-1.5 py-0.5 text-[10px] bg-win-base rounded" id="sayi-nace">0</span>
          </button>
          <button class="cip px-3 py-1.5 rounded text-xs font-bold transition bg-win-dark text-slate-300 hover:bg-win-hover border border-win-border flex items-center gap-1.5" data-tip="isco">
            <span>👤 ISCO</span> <span class="px-1.5 py-0.5 text-[10px] bg-win-base rounded" id="sayi-isco">0</span>
          </button>
        </div>

        <div id="filtre-notu" class="hidden text-[11px] text-slate-500 flex items-center gap-2"></div>
      </div>
    </div>

    <div id="sonuc-alani" class="space-y-4">
      <div class="flex-1 flex flex-col items-center justify-center py-16 text-center max-w-lg mx-auto">
        <div class="w-20 h-20 rounded-2xl bg-win-card border border-win-border text-win-500 flex items-center justify-center text-3xl mb-6 shadow-xl">⚡</div>
        <h2 class="text-2xl font-bold text-white tracking-tight mb-2" data-i18n="bos_baslik">Aramaya başlayın</h2>
        <p class="text-sm text-slate-400 leading-relaxed" data-i18n="bos_aciklama">Hiyerarşik ağaç görünümü için bir ürün adı veya kod yazın ya da bir filtre seçin.</p>
      </div>
    </div>

    <div id="yukleniyor-spinner" class="hidden py-6 text-center">
      <div class="inline-block w-6 h-6 border-2 border-win-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </main>

  <button id="btn-scroll-top" type="button" aria-label="Yukarı git" class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-xl bg-win-500 hover:bg-win-600 text-white shadow-2xl flex items-center justify-center transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19V5m-7 7l7-7 7 7"/>
    </svg>
  </button>

  <div id="detay-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="detay-overlay" class="absolute inset-0 bg-black/70 glass-panel"></div>
    <div id="detay-icerik" class="relative max-w-3xl w-full max-h-[90vh] overflow-y-auto modal-anim"></div>
  </div>

  <script type="module">
    import { CONFIG, apiUrl, apiFetch } from './assets/pdaas-config.js';
    import { $, kacis, sayi, normKod, kodTemiz, tr_lower } from './assets/pdaas-utils.js';
    import { t, dilBaslat, dilUygula, alanSec, kayitAdi, UI } from './assets/pdaas-i18n.js';
    import { renderLayout } from './assets/pdaas-layout.js';

    // ─── Sayfaya özel i18n anahtarları ───
    Object.assign(UI.tr, {
      arama_yer: "Ürün adı, GTİP, ISCO, CPC veya NACE kodu yazın…",
      filtre_hepsi: "Tümü",
      bos_baslik: "Aramaya başlayın",
      bos_aciklama: "Hiyerarşik ağaç görünümü için bir ürün adı veya kod yazın ya da bir filtre seçin.",
      sonuc_yok_b: "Sonuç bulunamadı",
      sonuc_yok_p: "Farklı bir kelime veya kod deneyin.",
      satir: "satır",
      agac_gorunumu: "ağaç görünümü",
      baglam_not: "Soluk satırlar bağlam · Koyu satırlar arama eşleşmesi",
      kod_baslik: "Kodları",
      kdv_orani: "KDV Oranı",
      otv: "ÖTV",
      otv_yok: "Yok",
      otv_yok_aciklama: "Bu ürün/hizmet ÖTV kapsamında değildir.",
      otv_muaf: "Muaf",
      gerekce_baslik: "Karar Gerekçesi",
      guven: "Güven Skoru",
      kapat: "Kapat",
      yukleniyor: "Veriler yükleniyor…",
      vergi_disi: "Vergi dışı kayıt",
      vergi_disi_aciklama: "Sektör/meslek kodu — KDV/ÖTV konusu değildir",
      sadece_kdv: "Hizmet: ÖTV uygulanmaz",
      sadece_kdv_uzun: "Hizmetler yalnızca KDV'ye tabidir; ÖTV fiziki mallarda uygulanır.",
      filtre_notu_urun: "Ürün kayıtları (GTİP): KDV ve ÖTV gösterilir.",
      filtre_notu_hizmet: "Hizmet kayıtları (CPC): KDV gösterilir; ÖTV uygulanmaz.",
      filtre_notu_nace: "NACE sektör kodları: vergi bilgisi yoktur (faaliyet alanı tanımlayıcısı).",
      filtre_notu_isco: "ISCO meslek kodları: vergi bilgisi yoktur (çalışan meslek sınıfı).",
    });
    Object.assign(UI.en, {
      arama_yer: "Type a product name, GTİP, ISCO, CPC or NACE code…",
      filtre_hepsi: "All",
      bos_baslik: "Start searching",
      bos_aciklama: "Type a product name, GTİP, ISCO, CPC or NACE code to view the hierarchical tree.",
      sonuc_yok_b: "No results found",
      sonuc_yok_p: "Try a different keyword or code.",
      satir: "rows",
      agac_gorunumu: "tree view",
      baglam_not: "Faded rows are context · Highlighted rows are matches",
      kod_baslik: "Codes",
      kdv_orani: "VAT Rate",
      otv: "SCT (Excise)",
      otv_yok: "None",
      otv_yok_aciklama: "This product/service is not subject to SCT.",
      otv_muaf: "Exempt",
      gerekce_baslik: "Decision Reasoning",
      guven: "Confidence",
      kapat: "Close",
      yukleniyor: "Loading data sources…",
      vergi_disi: "Tax-exempt record",
      vergi_disi_aciklama: "Sector/occupation code — not subject to VAT/SCT",
      sadece_kdv: "Service: no SCT applied",
      sadece_kdv_uzun: "Services are subject to VAT only; SCT applies to physical goods.",
      filtre_notu_urun: "Product records (GTİP): VAT and SCT are shown.",
      filtre_notu_hizmet: "Service records (CPC): VAT is shown; SCT does not apply.",
      filtre_notu_nace: "NACE sector codes: no tax info (business activity identifier).",
      filtre_notu_isco: "ISCO occupation codes: no tax info (employee occupation).",
    });

    // ─── Başlat ───
    dilBaslat();
    renderLayout({ activePage: 'urunhizmetara.html' });
    dilUygula();

    // ─── Sabitler ───
    const KAYNAK_ETIKET = { gtip: 'GTİP', isco: 'ISCO', cpc: 'CPC', nace: 'NACE' };
    const KAYNAK_SINIF  = { gtip: 'etiket-hs', isco: 'etiket-isco', cpc: 'etiket-cpc', nace: 'etiket-nace' };
    const KAYNAK_IKON   = { gtip: '📦', cpc: '⚙️', nace: '🏭', isco: '👤' };

    const VERGI_KAYNAKLARI = new Set(['gtip', 'cpc']);
    const OTV_KAYNAKLARI   = new Set(['gtip']);

    const VERI = {
      gtip: { kayitlar: [], yuklendi: false },
      isco: { kayitlar: [], yuklendi: false },
      cpc:  { kayitlar: [], yuklendi: false },
      nace: { kayitlar: [], yuklendi: false }
    };
    let KDV_DATA = null, OTV_DATA = null, AKTIF_FILTRE = 'hepsi', TUM_SONUCLAR = [], GORUNEN_LIMIT = 100;

    async function fetchJSON(yol) {
      try {
        const r = await apiFetch(yol);
        if (!r.ok) return { ok: false };
        return { ok: true, data: await r.json() };
      } catch (e) { return { ok: false }; }
    }

    async function tumVeriYukle() {
      const durum = $('durum-alani');
      durum.classList.remove('hidden');
      durum.innerHTML = `
        <div class="bg-win-card border border-win-border rounded-lg p-3 flex items-center gap-3 text-win-100 text-xs">
          <div class="inline-block w-4 h-4 border-2 border-win-500 border-t-transparent rounded-full animate-spin"></div>
          <span>${t('yukleniyor')}</span>
        </div>`;

      const gorevler = {
        gtip: ['/api/v1/ham/gtip-kodlari.json'],
        isco: ['/api/v1/ham/isco-kodlari.json'],
        cpc:  ['/api/v1/ham/cpc-kodlari.json'],
        nace: ['/api/v1/ham/nace-kodlari.json'],
        kdv:  ['/api/v1/ham/kdv-oranlari.json'],
        otv:  ['/api/v1/ham/otv-oranlari.json']
      };

      for (const k of Object.keys(gorevler)) {
        for (const y of gorevler[k]) {
          const res = await fetchJSON(y);
          if (res.ok && res.data) {
            if (k === 'kdv') KDV_DATA = res.data;
            if (k === 'otv') OTV_DATA = res.data;
            if (VERI[k]) { VERI[k].kayitlar = res.data.kayitlar || res.data.kurallar || []; VERI[k].yuklendi = true; }
            break;
          }
        }
      }
      durum.innerHTML = '';
      sayilariGuncelle();
    }

    function sayilariGuncelle() {
      $('sayi-gtip').textContent = sayi(VERI.gtip.kayitlar.length);
      $('sayi-isco').textContent = sayi(VERI.isco.kayitlar.length);
      $('sayi-cpc').textContent = sayi(VERI.cpc.kayitlar.length);
      $('sayi-nace').textContent = sayi(VERI.nace.kayitlar.length);
    }

    function gtipZinciri(kod) {
      const tk = kodTemiz(kod);
      if (!/^\d+$/.test(tk)) return [normKod(kod)];
      const dilimler = [2, 4, 6, 8, 10, 12];
      const zincir = [];
      for (const d of dilimler) { if (tk.length >= d) zincir.push(tk.slice(0, d)); }
      return zincir;
    }

    function ataZinciri(kayit, kodMap, kaynakTip) {
      const kod = normKod(kayit.kod);
      if (kaynakTip === 'gtip') {
        const g = gtipZinciri(kod);
        const kayitlar = [];
        for (const x of g) { const k = kodMap.get(x); if (k) kayitlar.push(k); }
        const son = kayitlar[kayitlar.length - 1];
        if (!son || normKod(son.kod) !== kod) kayitlar.push(kayit);
        return kayitlar;
      }
      const zincir = [];
      const gorulen = new Set();
      let m = kayit;
      while (m) {
        const mk = normKod(m.kod);
        if (gorulen.has(mk)) break;
        gorulen.add(mk);
        zincir.unshift(m);
        m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
      }
      return zincir;
    }

    function agacKur(kaynakTip, tumKayitlar, eslesenKodlar) {
      const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
      const dahil = new Map();
      for (const kod of eslesenKodlar) {
        const k = kodMap.get(kod);
        if (!k) continue;
        const zincir = ataZinciri(k, kodMap, kaynakTip);
        zincir.forEach((z, i) => {
          const zk = normKod(z.kod);
          const sonuncu = (i === zincir.length - 1);
          const mevcut = dahil.get(zk);
          if (!mevcut) dahil.set(zk, { kayit: z, eslesme: sonuncu });
          else if (sonuncu) mevcut.eslesme = true;
        });
      }
      return [...dahil.values()].map(x => ({ kaynak: kaynakTip, kayit: x.kayit, eslesme: x.eslesme }));
    }

    function kaynaklariTara(q, filtre) {
      const sorgu = tr_lower(q || '').trim();
      const tekKaynak = filtre !== 'hepsi';
      if (!sorgu && !tekKaynak) return [];

      const kaynaklar = [];
      if (filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
      if (filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
      if (filtre === 'hepsi' || filtre === 'cpc')  kaynaklar.push(['cpc',  VERI.cpc]);
      if (filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

      const tumSonuclar = [];
      for (const [kaynakTip, veri] of kaynaklar) {
        const eslesenKodlar = [];
        for (const k of veri.kayitlar) {
          if (!sorgu) { eslesenKodlar.push(normKod(k.kod)); continue; }
          const kod = normKod(k.kod);
          const ad = tr_lower(kayitAdi(k));
          if (kod.includes(sorgu) || ad.includes(sorgu)) {
            eslesenKodlar.push(kod);
            if (eslesenKodlar.length > 3000) break;
          }
        }
        tumSonuclar.push(...agacKur(kaynakTip, veri.kayitlar, eslesenKodlar));
      }
      return tumSonuclar;
    }

    function oranBul(kdvKodu) {
      if (!KDV_DATA?.kayitlar) return 0.20;
      const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
      return k ? k.oran : 0.20;
    }
    function kdvAd(kdvKodu) {
      if (!KDV_DATA?.kayitlar) return kdvKodu;
      const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
      return k ? (kayitAdi(k) || kdvKodu) : kdvKodu;
    }
    function otvBul(gtipKod, arananMetin = '') {
      if (!gtipKod && !arananMetin) return null;
      const gt = kodTemiz(gtipKod);
      if (gt && OTV_DATA?.kayitlar) {
        for (const k of OTV_DATA.kayitlar) {
          const pref = k.gtip_prefix || [];
          if (pref.some(p => gt.startsWith(kodTemiz(p)))) {
            const ad = alanSec(k, 'ad') || '';
            return { liste: k.liste || '', ad: `${k.liste} Sayılı Liste — ${ad}`, oran: k.oran ?? 0.42 };
          }
        }
      }
      return null;
    }

    function filtreNotunuGuncelle() {
      const not = $('filtre-notu');
      const notlar = {
        gtip: t('filtre_notu_urun'),
        cpc: t('filtre_notu_hizmet'),
        nace: t('filtre_notu_nace'),
        isco: t('filtre_notu_isco'),
        hepsi: ''
      };
      const metin = notlar[AKTIF_FILTRE] || '';
      if (metin) { not.classList.remove('hidden'); not.innerHTML = `<span class="text-win-400">ℹ️</span> <span>${kacis(metin)}</span>`; }
      else { not.classList.add('hidden'); not.innerHTML = ''; }
    }

    function sonuclariCiz() {
      const alan = $('sonuc-alani');
      const sonuclar = TUM_SONUCLAR.slice(0, GORUNEN_LIMIT);
      const aktifKaynaklar = AKTIF_FILTRE === 'hepsi' ? ['gtip', 'cpc', 'nace', 'isco'] : [AKTIF_FILTRE];
      const kdvKolonu = aktifKaynaklar.some(k => VERGI_KAYNAKLARI.has(k));
      const otvKolonu = aktifKaynaklar.some(k => OTV_KAYNAKLARI.has(k));

      if (!sonuclar.length) {
        alan.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center py-16 text-center max-w-lg mx-auto">
            <div class="w-20 h-20 rounded-2xl bg-win-card border border-win-border text-slate-500 flex items-center justify-center text-3xl mb-6">🔎</div>
            <h2 class="text-xl font-bold text-white tracking-tight mb-2">${kacis(t('sonuc_yok_b'))}</h2>
            <p class="text-sm text-slate-400 leading-relaxed">${kacis(t('sonuc_yok_p'))}</p>
          </div>`;
        return;
      }

      const gruplar = { gtip: [], isco: [], cpc: [], nace: [] };
      for (const s of sonuclar) gruplar[s.kaynak].push(s);

      const kolonBaslik = (kdvKolonu || otvKolonu) ? `
        <div class="flex-none flex items-center gap-1.5 pr-1">
          ${kdvKolonu ? `<span class="w-[52px] text-center text-[10px] font-bold uppercase tracking-wider text-slate-500">KDV</span>` : ''}
          ${otvKolonu ? `<span class="w-[52px] text-center text-[10px] font-bold uppercase tracking-wider text-slate-500">ÖTV</span>` : ''}
        </div>` : '';

      let html = `
        <div class="flex items-center justify-between text-xs text-slate-400 px-1 flex-wrap gap-2">
          <span class="font-semibold">${sayi(TUM_SONUCLAR.length)} ${kacis(t('satir'))} (Gösterilen: ${sayi(sonuclar.length)}) — ${kacis(t('agac_gorunumu'))}</span>
          <span class="text-slate-500 hidden sm:inline">${kacis(t('baglam_not'))}</span>
        </div>`;

      for (const kaynak of ['gtip', 'cpc', 'nace', 'isco']) {
        const g = gruplar[kaynak];
        if (!g.length) continue;
        const kaynakKdvVar = VERGI_KAYNAKLARI.has(kaynak);
        const kaynakOtvVar = OTV_KAYNAKLARI.has(kaynak);

        html += `
          <div class="bg-win-card border border-win-border rounded-xl overflow-hidden shadow-xl mb-4">
            <div class="flex items-center gap-2 px-4 py-3 border-b border-win-border bg-win-dark">
              <span class="text-base">${KAYNAK_IKON[kaynak]}</span>
              <span class="${KAYNAK_SINIF[kaynak]} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${KAYNAK_ETIKET[kaynak]}</span>
              <span class="text-xs font-bold text-slate-300">${KAYNAK_ETIKET[kaynak]} ${kacis(t('kod_baslik'))}</span>
              ${!kaynakKdvVar ? `<span class="text-[10px] text-slate-500 italic hidden sm:inline">· ${kacis(t('vergi_disi_aciklama'))}</span>` : ''}
              <span class="ml-auto text-[10px] text-slate-500 font-medium whitespace-nowrap">${sayi(g.length)} ${kacis(t('satir'))}</span>
              ${kolonBaslik}
            </div>
            <div class="divide-y divide-win-border/60">
              ${g.map(s => {
                const globalIdx = TUM_SONUCLAR.indexOf(s);
                const ad = kayitAdi(s.kayit);
                const kod = normKod(s.kayit.kod);
                const eslesme = s.eslesme;
                const opak = eslesme ? 'text-slate-100 font-semibold bg-win-dark/40' : 'text-slate-400 opacity-60';

                let kdvCell = `<span class="text-slate-600 text-xs">—</span>`;
                if (kaynakKdvVar) {
                  const oran = s.kayit.kdv_kodu ? oranBul(s.kayit.kdv_kodu) : 0.20;
                  kdvCell = `<span class="px-2 py-0.5 rounded-full bg-win-500/10 text-win-100 border border-win-500/20 text-[10px] font-bold whitespace-nowrap">%${(oran * 100).toFixed(0)}</span>`;
                }
                let otvCell = `<span class="text-slate-600 text-xs">—</span>`;
                if (kaynakOtvVar) {
                  const otv = otvBul(kod, ad);
                  otvCell = otv
                    ? `<span class="px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-bold whitespace-nowrap">%${(otv.oran * 100).toFixed(0)}</span>`
                    : `<span class="text-slate-500 text-[10px]">${kacis(t('otv_muaf'))}</span>`;
                }
                const vergiAlanlari = (kdvKolonu || otvKolonu) ? `
                  <div class="flex-none flex items-center gap-1.5">
                    ${kdvKolonu ? `<span class="w-[52px] text-center ${!kaynakKdvVar ? 'opacity-40' : ''}">${kdvCell}</span>` : ''}
                    ${otvKolonu ? `<span class="w-[52px] text-center ${!kaynakOtvVar ? 'opacity-40' : ''}">${otvCell}</span>` : ''}
                  </div>` : '';

                return `
                  <div class="px-4 py-3 hover:bg-win-hover transition cursor-pointer flex items-center justify-between gap-3 kart-tikla ${opak}" data-idx="${globalIdx}">
                    <div class="min-w-0 flex items-center gap-3 flex-1">
                      <span class="text-base flex-none" title="${KAYNAK_ETIKET[kaynak]}">${KAYNAK_IKON[kaynak]}</span>
                      <code class="text-xs font-mono text-win-100 bg-win-base px-2 py-1 rounded border border-win-border flex-none">${kacis(kod)}</code>
                      <span class="text-sm truncate">${kacis(ad)}</span>
                    </div>
                    ${vergiAlanlari}
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      alan.innerHTML = html;
      if (GORUNEN_LIMIT < TUM_SONUCLAR.length) $('yukleniyor-spinner').classList.remove('hidden');
      else $('yukleniyor-spinner').classList.add('hidden');
    }

    function aramayiBaslat() {
      const q = $('arama').value.trim();
      GORUNEN_LIMIT = 100;
      TUM_SONUCLAR = kaynaklariTara(q, AKTIF_FILTRE);
      filtreNotunuGuncelle();
      sonuclariCiz();
    }

    function detayGoster(s) {
      const { kaynak, kayit } = s;
      const kod = normKod(kayit.kod);
      const ad = kayitAdi(kayit);
      const kaynakKdvVar = VERGI_KAYNAKLARI.has(kaynak);
      const kaynakOtvVar = OTV_KAYNAKLARI.has(kaynak);

      const kdvOrani = kayit.kdv_kodu ? oranBul(kayit.kdv_kodu) : 0.20;
      const kdvMetin = kdvOrani === 0 ? '%0' : `%${(kdvOrani * 100).toFixed(0)}`;
      const kdvAciklama = kayit.kdv_kodu ? kdvAd(kayit.kdv_kodu) : 'Standart Oran (%20)';
      const otv = (kaynak === 'gtip') ? otvBul(kod, ad) : null;

      let vergiBloku = '';
      if (kaynakKdvVar || kaynakOtvVar) {
        vergiBloku = `
          <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
            ${kaynakKdvVar ? `
              <div class="bg-win-base border border-win-border rounded-lg p-4 space-y-2">
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${t('kdv_orani')}</div>
                <div class="text-3xl font-extrabold text-win-100">${kdvMetin}</div>
                <div class="text-xs text-slate-400 leading-relaxed">${kacis(kdvAciklama)}</div>
              </div>` : ''}
            ${kaynakOtvVar ? `
              <div class="bg-win-base border border-win-border rounded-lg p-4 space-y-2">
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${t('otv')}</div>
                <div class="text-xl font-extrabold text-white">${otv ? `%${(otv.oran * 100).toFixed(0)}` : t('otv_yok')}</div>
                <div class="text-xs text-slate-400 leading-relaxed">${otv ? kacis(otv.ad) : t('otv_yok_aciklama')}</div>
              </div>` : `
              <div class="bg-win-base border border-win-border rounded-lg p-4 space-y-2">
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">${t('otv')}</div>
                <div class="text-sm font-semibold text-slate-400 flex items-center gap-2">
                  <span>ℹ️</span><span>${kacis(t('sadece_kdv'))}</span>
                </div>
                <div class="text-xs text-slate-500 leading-relaxed">${kacis(t('sadece_kdv_uzun'))}</div>
              </div>`}
          </div>`;
      } else {
        vergiBloku = `
          <div class="p-5">
            <div class="bg-slate-500/5 border border-slate-500/20 rounded-lg p-4 flex items-start gap-3">
              <span class="text-xl flex-none">ℹ️</span>
              <div>
                <div class="text-xs font-bold text-slate-300 mb-1">${t('vergi_disi')}</div>
                <div class="text-xs text-slate-500 leading-relaxed">${t('vergi_disi_aciklama')}</div>
              </div>
            </div>
          </div>`;
      }

      $('detay-icerik').innerHTML = `
        <div class="bg-win-card border border-win-border rounded-xl shadow-2xl overflow-hidden">
          <div class="p-5 border-b border-win-border flex items-start justify-between gap-4 bg-win-dark">
            <div class="min-w-0">
              <span class="text-base mr-1">${KAYNAK_IKON[kaynak]}</span>
              <span class="${KAYNAK_SINIF[kaynak]} px-2 py-0.5 rounded text-[10px] font-bold tracking-wider">${KAYNAK_ETIKET[kaynak]}</span>
              <code class="text-xs font-mono text-win-100 bg-win-500/10 px-2 py-0.5 rounded border border-win-500/20 ml-2">${kacis(kod)}</code>
              <h2 class="text-xl font-extrabold text-white tracking-tight mt-2">${kacis(ad)}</h2>
            </div>
            <button id="kapat-btn" type="button" title="${t('kapat')}" class="flex-none w-9 h-9 rounded-lg bg-win-dark hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition">✕</button>
          </div>
          ${vergiBloku}
          <div class="px-5 py-3 bg-win-dark border-t border-win-border flex items-center justify-between text-xs text-slate-400">
            <span>${t('gerekce_baslik')}</span>
            <span class="font-mono text-emerald-400">${t('guven')}: %95</span>
          </div>
        </div>`;

      const modal = $('detay-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      $('kapat-btn').addEventListener('click', detayKapat);
    }

    function detayKapat() {
      const modal = $('detay-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    // ─── Olaylar ───
    document.addEventListener('pdaas:dil', () => {
      detayKapat();
      aramayiBaslat();
    });

    $('detay-overlay').addEventListener('click', detayKapat);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') detayKapat(); });

    let aramaZaman;
    $('arama').addEventListener('input', () => {
      clearTimeout(aramaZaman);
      aramaZaman = setTimeout(() => { aramayiBaslat(); detayKapat(); }, 250);
    });

    $('sonuc-alani').addEventListener('click', e => {
      const el = e.target.closest('.kart-tikla');
      if (!el) return;
      const idx = Number(el.dataset.idx);
      if (TUM_SONUCLAR[idx]) detayGoster(TUM_SONUCLAR[idx]);
    });

    $('filtreler').addEventListener('click', e => {
      const btn = e.target.closest('.cip');
      if (!btn) return;
      document.querySelectorAll('.cip').forEach(x => { x.classList.remove('bg-win-500', 'text-white'); x.classList.add('bg-win-dark', 'text-slate-300'); });
      btn.classList.add('bg-win-500', 'text-white');
      btn.classList.remove('bg-win-dark', 'text-slate-300');
      AKTIF_FILTRE = btn.dataset.tip;
      aramayiBaslat();
      detayKapat();
    });

    const scrollTopBtn = $('btn-scroll-top');
    window.addEventListener('scroll', () => {
      if (!$('detay-modal').classList.contains('hidden')) return;
      if (window.scrollY > 300) scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      else scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        if (GORUNEN_LIMIT < TUM_SONUCLAR.length) { GORUNEN_LIMIT += 100; sonuclariCiz(); }
      }
    });
    scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ─── Başlat ───
    tumVeriYukle();
  </script>
</body>
</html>
