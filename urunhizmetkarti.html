<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDaaS · Ürün &amp; Hizmet Kartı</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/pdaas-tailwind.js"></script>
  <link rel="stylesheet" href="assets/pdaas.css">
</head>

<body
  class="bg-win-base text-slate-100 font-sans h-screen flex flex-col overflow-hidden antialiased selection:bg-win-500 selection:text-white">

  <div id="pdaas-header"></div>

  <div class="flex-1 flex overflow-hidden relative min-h-0">
    <aside id="sidebar"
      class="w-72 lg:w-80 flex-none bg-win-dark border-r border-win-border flex flex-col fixed lg:static top-16 bottom-0 left-0 z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out min-h-0">
      <div class="p-4 border-b border-win-border space-y-2 flex-none">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold tracking-tight text-white uppercase flex items-center gap-2">
            <svg class="w-4 h-4 text-win-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
            <span data-i18n="kategoriler_title">Kategoriler</span>
          </h2>
          <span id="toplam-sayi"
            class="px-2 py-0.5 text-[11px] font-semibold bg-win-card text-slate-300 rounded border border-win-border">0</span>
        </div>
        <p class="text-[11px] text-slate-500" data-i18n="kategoriler_desc">Kaynak türüne göre filtreleyin</p>
      </div>
      <div id="filter-list" class="flex-1 overflow-y-auto overscroll-contain p-3 space-y-2 min-h-0"></div>
      <div
        class="p-3 border-t border-win-border bg-win-dark/50 text-[11px] text-slate-500 flex items-center justify-between flex-none">
        <span>REST JSON API</span>
        <span class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span data-i18n="live_connection">Canlı Bağlantı</span>
        </span>
      </div>
    </aside>

    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-20 hidden lg:hidden mica-panel"></div>

    <main id="main-content" class="flex-1 overflow-y-auto overscroll-contain bg-win-base flex flex-col min-h-0">
      <div class="max-w-screen-2xl w-full mx-auto p-4 lg:p-8 space-y-6">
        <div>
          <h1 class="text-2xl lg:text-3xl font-extrabold text-white tracking-tight" data-i18n="sayfa_baslik"></h1>
          <p class="text-sm text-slate-400 mt-1" data-i18n="sayfa_aciklama"></p>
        </div>
        <div id="durum-alani" class="hidden"></div>
        <div
          class="bg-win-card border border-win-border rounded-xl shadow-xl overflow-hidden sticky top-4 z-30 backdrop-blur-md">
          <div class="p-4 space-y-3">
            <div class="relative">
              <svg class="w-5 h-5 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input type="text" id="arama"
                class="w-full h-12 pl-12 pr-4 bg-win-base border border-win-border rounded-lg text-white text-sm font-medium focus:outline-none focus:border-win-500 transition placeholder-slate-500"
                data-i18n-placeholder="arama_yer" autocomplete="off" autofocus>
            </div>
            <div id="filtre-notu" class="hidden text-[11px] text-slate-500 flex items-center gap-2"></div>
          </div>
        </div>
        <div id="sonuc-alani" class="space-y-4">
          <div class="flex-1 flex flex-col items-center justify-center py-16 text-center max-w-lg mx-auto">
            <div
              class="w-20 h-20 rounded-2xl bg-win-card border border-win-border text-win-500 flex items-center justify-center text-3xl mb-6 shadow-xl">
              📋</div>
            <h2 class="text-2xl font-bold text-white tracking-tight mb-2" data-i18n="bos_baslik"></h2>
            <p class="text-sm text-slate-400 leading-relaxed" data-i18n="bos_aciklama"></p>
          </div>
        </div>
        <div id="yukleniyor-spinner" class="hidden py-6 text-center">
          <div class="inline-block w-6 h-6 border-2 border-win-500 border-t-transparent rounded-full animate-spin">
          </div>
        </div>
      </div>
    </main>
  </div>

  <button id="btn-scroll-top" type="button" aria-label="Yukarı git"
    class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-xl bg-win-500 hover:bg-win-600 text-white shadow-2xl flex items-center justify-center transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19V5m-7 7l7-7 7 7" />
    </svg>
  </button>

  <div id="detay-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="detay-overlay" class="absolute inset-0 bg-black/70 glass-panel"></div>
    <div id="detay-icerik" class="relative max-w-5xl w-full max-h-[92vh] overflow-y-auto modal-anim"></div>
  </div>

  <script type="module">
    import { CONFIG, apiUrl, apiFetch } from './assets/pdaas-config.js';
    import { $, kacis, normKod, kodTemiz, tr_lower } from './assets/pdaas-utils.js';
    import { t, dilBaslat, dilUygula, kayitAdi, UI, getDil, showToast } from './assets/pdaas-i18n.js';
    import { renderLayout } from './assets/pdaas-layout.js';

    const dil = () => getDil();
    const sayi = n => Number(n || 0).toLocaleString(dil() === 'en' ? 'en-US' : 'tr-TR');
    const yuzde = oran => `%${(Number(oran) * 100).toLocaleString(dil() === 'en' ? 'en-US' : 'tr-TR', { maximumFractionDigits: 2 })}`;
    const secAd = o => (dil() === 'en' ? (o?.ad_en || o?.tanim_en || o?.ad_tr || o?.tanim_tr) : (o?.ad_tr || o?.tanim_tr || o?.ad_en || o?.tanim_en)) || '';
    const enumEtiketi = val => ({
      kosullu: t('belge_kosullu'), zorunlu: t('belge_zorunlu'), opsiyonel: t('belge_opsiyonel'),
      diploma: t('tur_diploma'), ruhsat: t('tur_ruhsat'), tescil: t('tur_tescil'),
      yeterlilik: t('tur_yeterlilik'), diger_ulkeler: t('mense_diger_ulkeler')
    })[val] || val || '—';
    const SUREC_ADLARI = {
      bugday_un: ['Buğdaydan un üretimi', 'Wheat milling'], domates_salca: ['Domates salçası üretimi', 'Tomato paste production'],
      aycicek_yagi: ['Ayçiçeği yağı üretimi', 'Sunflower oil production'], pamuk_iplik: ['Pamuktan iplik üretimi', 'Cotton spinning'],
      seker_pancar: ['Şeker pancarından şeker üretimi', 'Sugar production from sugar beet'],
      'demir-cevheri-pik': ['Demir cevherinden pik demir', 'Pig iron production from iron ore'],
      ham_petrol_benzin: ['Ham petrolden benzin üretimi', 'Gasoline refining from crude oil'],
      linyit_yarikok: ['Linyitten yarı kok üretimi', 'Semi-coke production from lignite'],
      'tas-komur-kok': ['Taş kömüründen kok üretimi', 'Coke production from hard coal']
    };
    const surecAdi = r => secAd(r) || SUREC_ADLARI[r.surec_kodu]?.[dil() === 'en' ? 1 : 0] || String(r.surec_kodu || '').replaceAll('_', ' ');

    const baslikDiliniUygula = () => {
      document.title = dil() === 'en' ? 'PDaaS · Product & Service Card' : 'PDaaS · Ürün & Hizmet Kartı';
      $('btn-scroll-top').setAttribute('aria-label', t('yukari_git'));
    };

    dilBaslat();
    renderLayout({ activePage: 'urunhizmetkarti.html' });
    dilUygula();
    baslikDiliniUygula();

    const KAYNAK_ETIKET = { gtip: 'GTİP', isco: 'ISCO', cpc: 'CPC', nace: 'NACE' };
    const KAYNAK_SINIF = { gtip: 'etiket-hs', isco: 'etiket-isco', cpc: 'etiket-cpc', nace: 'etiket-nace' };
    const KAYNAK_IKON = { gtip: '📦', cpc: '⚙️', nace: '🏭', isco: '👤' };

    const KART_TIPI = {
      gtip: { tip: 'urun', baslikKey: 'kart_urun', descKey: 'kart_urun_desc' },
      cpc: { tip: 'hizmet', baslikKey: 'kart_hizmet', descKey: 'kart_hizmet_desc' },
      nace: { tip: 'faaliyet', baslikKey: 'kart_faaliyet', descKey: 'kart_faaliyet_desc' },
      isco: { tip: 'meslek', baslikKey: 'kart_meslek', descKey: 'kart_meslek_desc' },
    };

    const VERI = {
      gtip: { kayitlar: [], kayitSayisi: null, yuklendi: false, yukleniyor: false, istek: null, kaynak: null },
      cpc: { kayitlar: [], kayitSayisi: null, yuklendi: false, yukleniyor: false, istek: null, kaynak: null },
      nace: { kayitlar: [], kayitSayisi: null, yuklendi: false, yukleniyor: false, istek: null, kaynak: null },
      isco: { kayitlar: [], kayitSayisi: null, yuklendi: false, yukleniyor: false, istek: null, kaynak: null },
    };

    let AKTIF_FILTRE = 'hepsi', TUM_SONUCLAR = [], GORUNEN_LIMIT = 100;
    let SECILI = null;
    let KATALOG_PROMISE = null;
    let BASARISIZ_KAYNAKLAR = null;
    let ARAMA_SIRA = 0;

    function durumDiliniUygula() {
      if (!BASARISIZ_KAYNAKLAR) return;
      const durum = $('durum-alani');
      durum.innerHTML = BASARISIZ_KAYNAKLAR.length
        ? `<div class="bg-amber-500/10 border border-amber-500/20 rounded-lg p-3 text-amber-300 text-xs">${kacis(t('yukleme_hatasi'))}: ${BASARISIZ_KAYNAKLAR.map(k => KAYNAK_ETIKET[k]).join(', ')}</div>`
        : `<div class="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-3 text-emerald-400 text-xs">${kacis(t('yuklendi'))}</div>`;
    }


    const FILTRE_ITEMS = [
      { tip: 'hepsi', ikon: '🗂️', etiketKey: 'filtre_hepsi', altKey: 'kategori_hepsi_desc' },
      { tip: 'gtip', ikon: '📦', etiket: 'GTİP', altKey: 'kategori_gtip_desc' },
      { tip: 'cpc', ikon: '⚙️', etiket: 'CPC', altKey: 'kategori_cpc_desc' },
      { tip: 'nace', ikon: '🏭', etiket: 'NACE', altKey: 'kategori_nace_desc' },
      { tip: 'isco', ikon: '👤', etiket: 'ISCO', altKey: 'kategori_isco_desc' },
    ];

    function updateFilterCounts() {
      const adet = tip => VERI[tip].yuklendi ? VERI[tip].kayitlar.length : VERI[tip].kayitSayisi;
      const tipler = Object.keys(VERI);
      const toplam = tipler.reduce((n, tip) => n + (adet(tip) || 0), 0);
      const setVal = (id, v) => { const el = $(id); if (el) el.textContent = v; };
      const count = tip => adet(tip) == null ? '—' : sayi(adet(tip));
      setVal('sayi-hepsi', tipler.every(tip => adet(tip) != null) ? sayi(toplam) : '—');
      setVal('sayi-gtip', count('gtip'));
      setVal('sayi-cpc', count('cpc')); setVal('sayi-nace', count('nace'));
      setVal('sayi-isco', count('isco'));
      setVal('toplam-sayi', toplam);
    }

    function renderFilterList() {
      const container = $('filter-list');
      if (!container) return;
      container.innerHTML = FILTRE_ITEMS.map(item => {
        const aktif = item.tip === AKTIF_FILTRE;
        const etiket = item.etiket || t(item.etiketKey);
        const altEtiket = t(item.altKey);
        const btnCls = aktif ? 'bg-win-500/20 border-win-500/40 text-win-400' : 'bg-win-card border-win-border text-slate-200 hover:bg-win-hover';
        const badgeCls = aktif ? 'bg-win-500/30 text-win-300' : 'bg-win-base text-slate-400';

        const isLoading = item.tip === 'hepsi'
          ? Object.values(VERI).some(v => v.yukleniyor)
          : Boolean(VERI[item.tip]?.yukleniyor);
        const sayiDegeri = item.tip === 'hepsi'
          ? (Object.values(VERI).every(v => v.yuklendi || v.kayitSayisi != null)
            ? sayi(Object.values(VERI).reduce((n, v) => n + (v.yuklendi ? v.kayitlar.length : (v.kayitSayisi || 0)), 0)) : '—')
          : (VERI[item.tip]?.yuklendi ? sayi(VERI[item.tip].kayitlar.length) : (VERI[item.tip]?.kayitSayisi == null ? '—' : sayi(VERI[item.tip].kayitSayisi)));
        const badgeHtml = isLoading
          ? `<div class="inline-block w-3 h-3 border-2 border-win-400 border-t-transparent rounded-full animate-spin"></div>`
          : `<span id="sayi-${item.tip}" class="px-2 py-0.5 text-[10px] font-bold rounded flex-none ${badgeCls}">${sayiDegeri}</span>`;

        return `
          <button class="filter-btn w-full px-3 py-2.5 rounded-md border transition text-left flex items-center justify-between group ${btnCls}" data-tip="${item.tip}">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-base flex-none">${item.ikon}</span>
              <div class="text-left min-w-0">
                <div class="text-sm font-semibold truncate">${kacis(etiket)}</div>
                <div class="text-[10px] text-slate-500 truncate">${kacis(altEtiket)}</div>
              </div>
            </div>
            ${badgeHtml}
          </button>`;
      }).join('');

      updateFilterCounts();

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          AKTIF_FILTRE = btn.dataset.tip;
          renderFilterList();

          await aramayiBaslat();

          detayKapat();
          closeMobileSidebar();
        });
      });
    }

    async function fetchGuvenli(yol) {
      try {
        const r = await apiFetch(yol);
        if (!r.ok) return null;
        return await r.json();
      } catch (e) { return null; }
    }

    async function fetchKaynak(kaynakTip) {
      const veri = VERI[kaynakTip];
      if (!veri || veri.yuklendi) return Boolean(veri?.yuklendi);
      if (veri.istek) return veri.istek;
      veri.istek = (async () => {
        veri.yukleniyor = true;
        renderFilterList();
        if (!veri.kaynak) await KATALOG_PROMISE;
        const d = veri.kaynak ? await fetchGuvenli(veri.kaynak) : null;
        if (d && Array.isArray(d.kayitlar)) {
          veri.kayitlar = d.kayitlar;
          veri.yuklendi = true;
          BASARISIZ_KAYNAKLAR = Object.keys(VERI).filter(k => !VERI[k].yuklendi);
          updateFilterCounts();
          renderFilterList();
          return true;
        }
        return false;
      })().finally(() => {
        veri.yukleniyor = false;
        veri.istek = null;
        renderFilterList();
      });
      return veri.istek;
    }

    async function tumVeriYukle() {
      const durum = $('durum-alani');
      durum.classList.add('hidden');
      // Katalog açılışta okunur; büyük konsolide dosyalar arama/filtre isteğine kadar indirilmez.
      VERI.gtip.kaynak = 'konsolide/gtip-konsolide.json';
      VERI.cpc.kaynak = 'konsolide/cpc-konsolide.json';
      VERI.nace.kaynak = 'konsolide/nace-konsolide.json';
      VERI.isco.kaynak = 'konsolide/isco-konsolide.json';
      KATALOG_PROMISE = (async () => {
        const KATALOG_ENDPOINT = CONFIG?.KATALOG_ENDPOINT || '/katalog.json';
        const kat = await fetchGuvenli(KATALOG_ENDPOINT);

        if (Array.isArray(kat?.varliklar?.konsolide)) {
          const getAsset = kod => kat.varliklar.konsolide.find(x => x.kod === kod) || null;
          for (const [tip, kod] of Object.entries({ gtip: 'gtip-konsolide', cpc: 'cpc-konsolide', nace: 'nace-konsolide', isco: 'isco-konsolide' })) {
            const asset = getAsset(kod);
            if (asset?.dosya) VERI[tip].kaynak = asset.dosya;
            if (asset?.kayit_sayisi != null && Number.isFinite(Number(asset.kayit_sayisi))) VERI[tip].kayitSayisi = Number(asset.kayit_sayisi);
          }
          updateFilterCounts();
          renderFilterList();
          return;
        }

        if (kat && kat.servisler) {
          const getUrl = (kod) => {
            const s = kat.servisler.find(x => x.kod === kod);
            if (!s) return null;
            const k = s.katmanlar?.konsolide || s.katmanlar?.ham;
            if (!k || !k.url) return null;
            if (k.url.endsWith('/index.json')) return k.url.replace('/index.json', '.json');
            return k.url;
          };

          if (getUrl('gtip-konsolide') || getUrl('gtip-tam') || getUrl('gtip-kodlari')) {
            VERI.gtip.kaynak = getUrl('gtip-konsolide') || getUrl('gtip-tam') || getUrl('gtip-kodlari');
          }
          if (getUrl('cpc-konsolide') || getUrl('cpc-tam') || getUrl('cpc-kodlari')) {
            VERI.cpc.kaynak = getUrl('cpc-konsolide') || getUrl('cpc-tam') || getUrl('cpc-kodlari');
          }
          if (getUrl('nace-konsolide') || getUrl('nace-tam') || getUrl('nace-kodlari')) {
            VERI.nace.kaynak = getUrl('nace-konsolide') || getUrl('nace-tam') || getUrl('nace-kodlari');
          }
          if (getUrl('isco-konsolide') || getUrl('isco-tam') || getUrl('isco-kodlari')) {
            VERI.isco.kaynak = getUrl('isco-konsolide') || getUrl('isco-tam') || getUrl('isco-kodlari');
          }
        }
      })();

      await KATALOG_PROMISE;
      BASARISIZ_KAYNAKLAR = [];
      updateFilterCounts();
      renderFilterList();
    }

    function gtipZinciri(kod) {
      const tk = kodTemiz(kod);
      if (!/^\d+$/.test(tk)) return [normKod(kod)];
      const dilimler = [2, 4, 6, 8, 10, 12];
      const zincir = [];
      for (const d of dilimler) { if (tk.length >= d) zincir.push(tk.slice(0, d)); }
      return zincir;
    }

    function ataZinciri(kayit, kodMap, kaynakTip) {
      const kod = normKod(kayit.kod);
      if (kaynakTip === 'gtip') {
        const g = gtipZinciri(kod);
        const kayitlar = [];
        for (const x of g) { const k = kodMap.get(x); if (k) kayitlar.push(k); }
        const son = kayitlar[kayitlar.length - 1];
        if (!son || normKod(son.kod) !== kod) kayitlar.push(kayit);
        return kayitlar;
      }
      const zincir = [];
      const gorulen = new Set();
      let m = kayit;
      while (m) {
        const mk = normKod(m.kod);
        if (gorulen.has(mk)) break;
        gorulen.add(mk);
        zincir.unshift(m);
        m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
      }
      return zincir;
    }

    function agacKur(kaynakTip, tumKayitlar, eslesenKodlarSet) {
      const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
      const dahil = new Map();

      for (const kod of eslesenKodlarSet) {
        const k = kodMap.get(kod);
        if (!k) continue;
        const zincir = ataZinciri(k, kodMap, kaynakTip);
        zincir.forEach((z, i) => {
          const zk = normKod(z.kod);
          const sonuncu = (i === zincir.length - 1);
          const mevcut = dahil.get(zk);
          if (!mevcut) dahil.set(zk, { kayit: z, eslesme: sonuncu });
          else if (sonuncu) mevcut.eslesme = true;
        });
      }
      return [...dahil.values()].map(x => ({ kaynak: kaynakTip, kayit: x.kayit, eslesme: x.eslesme }));
    }

    function kaynaklariTara(q, filtre) {
      const sorgu = tr_lower(q || '').trim();
      const kaynaklar = [];
      if (filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
      if (filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
      if (filtre === 'hepsi' || filtre === 'cpc') kaynaklar.push(['cpc', VERI.cpc]);
      if (filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

      const tumSonuclar = [];
      const MAX_SONUC = 50000;

      for (const [kaynakTip, veri] of kaynaklar) {
        if (!veri.yuklendi) continue;
        const eslesenKodlarSet = new Set();

        for (const k of veri.kayitlar) {
          if (!sorgu) {
            eslesenKodlarSet.add(normKod(k.kod));
            if (eslesenKodlarSet.size >= MAX_SONUC) break;
            continue;
          }
          const kod = normKod(k.kod);
          const adlar = [k.ad_tr, k.ad_en, k.tanim_tr, k.tanim_en].filter(Boolean).map(tr_lower);
          if (kod.includes(sorgu) || adlar.some(ad => ad.includes(sorgu))) {
            eslesenKodlarSet.add(kod);
            if (eslesenKodlarSet.size >= MAX_SONUC) break;
          }
        }

        if (!sorgu) {
          for (const k of veri.kayitlar) {
            if (eslesenKodlarSet.has(normKod(k.kod))) {
              tumSonuclar.push({ kaynak: kaynakTip, kayit: k, eslesme: true });
            }
          }
        } else {
          tumSonuclar.push(...agacKur(kaynakTip, veri.kayitlar, eslesenKodlarSet));
        }
      }
      return tumSonuclar;
    }

    function filtreNotunuGuncelle() {
      const not = $('filtre-notu');
      const notlar = { gtip: t('filtre_notu_urun'), cpc: t('filtre_notu_hizmet'), nace: t('filtre_notu_nace'), isco: t('filtre_notu_isco'), hepsi: '' };

    function renderBadges(kaynak, kayit) {
      const badges = [];
      const badgeBase = 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-sans font-semibold border';
      const badge = (css, title, label) => `<span class="${badgeBase} ${css}" title="${kacis(title)}">${kacis(label)}</span>`;

      if (kaynak !== 'cpc' && Array.isArray(kayit.cpc) && kayit.cpc.length > 0) {
        badges.push(badge('bg-blue-500/10 border-blue-500/30 text-blue-400', t('bagli_cpc'), 'CPC'));
      }
      if (kaynak !== 'nace' && Array.isArray(kayit.nace) && kayit.nace.length > 0) {
        badges.push(badge('bg-emerald-500/10 border-emerald-500/30 text-emerald-400', t('bagli_nace'), 'NACE'));
      }
      if (kaynak !== 'gtip' && Array.isArray(kayit.gtip) && kayit.gtip.length > 0) {
        badges.push(badge('bg-orange-500/10 border-orange-500/30 text-orange-400', t('bagli_gtip'), 'GTİP'));
      }
      if (kaynak !== 'isco' && Array.isArray(kayit.isco) && kayit.isco.length > 0) {
        badges.push(badge('bg-indigo-500/10 border-indigo-500/30 text-indigo-400', t('bagli_isco'), 'ISCO'));
      }

      // Teşvik Adayı kontrolü
      if (Array.isArray(kayit.tesvik_adaylari) && kayit.tesvik_adaylari.length > 0) {
        badges.push(badge('bg-yellow-500/10 border-yellow-500/30 text-yellow-400', t('bagli_tesvik'), t('bagli_tesvik')));
      }

      // SGK Aday listesi var mı kontrolü
      if (Array.isArray(kayit.sgk_adaylari) && kayit.sgk_adaylari.length > 0) {
        badges.push(badge('bg-teal-500/10 border-teal-500/30 text-teal-400', t('bagli_sgk'), t('bagli_sgk')));
      }

      // Mesleki Belgeler kontrolü
      if (Array.isArray(kayit.mesleki_belgeler) && kayit.mesleki_belgeler.length > 0) {
        badges.push(badge('bg-indigo-500/10 border-indigo-500/30 text-indigo-400', t('bagli_mesleki'), t('bagli_mesleki')));
      }
      if (Array.isArray(kayit.faaliyet_belgeleri) && kayit.faaliyet_belgeleri.length > 0) {
        badges.push(badge('bg-teal-500/10 border-teal-500/30 text-teal-400', t('bagli_belge'), dil() === 'en' ? 'Activity docs' : 'Faaliyet belgesi'));
      }

      let hasVergi = false;
      if (kayit.vergi && typeof kayit.vergi === 'object') {
        hasVergi = Boolean(vergiModeliniAl(kayit.vergi) && Object.keys(vergiModeliniAl(kayit.vergi)).length);
      }
      if (hasVergi) badges.push(badge('bg-rose-500/10 border-rose-500/30 text-rose-400', t('bagli_vergi'), t('vergi')));

      let hasRandiman = false;
      if (Array.isArray(kayit.randiman)) {
        hasRandiman = kayit.randiman.length > 0;
      } else if (kayit.randiman && typeof kayit.randiman === 'object') {
        hasRandiman = (kayit.randiman.girdi_oldugu_kurallar?.length > 0) || (kayit.randiman.cikti_oldugu_kurallar?.length > 0) || Object.keys(kayit.randiman).length > 0;
      }
      if (hasRandiman) badges.push(badge('bg-purple-500/10 border-purple-500/30 text-purple-400', t('bagli_randiman'), t('randiman_baslik')));

      let hasBelge = false;
      if (Array.isArray(kayit.belgeler)) {
        hasBelge = kayit.belgeler.length > 0;
      } else if (kayit.belgeler && typeof kayit.belgeler === 'object') {
        const b = kayit.belgeler;
        if ((Array.isArray(b.yurtici) && b.yurtici.length > 0) || (Array.isArray(b.ithalat) && b.ithalat.length > 0) || (Array.isArray(b.ihracat) && b.ihracat.length > 0)) hasBelge = true;
      }
      if (hasBelge) badges.push(badge('bg-slate-500/10 border-slate-500/30 text-slate-400', t('bagli_belge'), t('belge_baslik')));

      if (!badges.length) return '';
      return `<div class="flex items-center gap-1.5 flex-wrap justify-end">${badges.join('')}</div>`;
    }

      return `

    function secVergiKaydi(deger) {
      if (!Array.isArray(deger)) return deger;
      if (!deger.length) return null;
      if (deger.length === 1) return deger[0];
      const farkliOranlar = new Set(deger.map(v => JSON.stringify([v?.oran ?? null, v?.istisna ?? null, v?.uygulama ?? null, v?.durum ?? null]))).size > 1;
      return farkliOranlar
        ? { durum: 'gtip_bazli', ref: t('gtip_ayrinti') }
        : { ...deger[0], ref: t('gtip_ayrinti') };
    }

    function vergiModeliniAl(kaynak) {
      if (!kaynak || typeof kaynak !== 'object') return null;
      const senaryolar = ['yurtici', 'ithalat', 'ihracat'];
      if (senaryolar.some(s => Object.prototype.hasOwnProperty.call(kaynak, s))) return kaynak;
      const kategoriler = {
        kdv: 'kdv', otv: 'otv', tevkifat: 'tevkifat',
        gumruk_vergisi: 'gumruk-vergisi', ilave_gumruk_vergisi: 'ilave-gumruk-vergisi'
      };
      const model = {};
      for (const senaryo of senaryolar) {
        const satir = {};
        for (const [alan, gorunumAdi] of Object.entries(kategoriler)) {
          const deger = kaynak[alan]?.[senaryo];
          if (deger && (Array.isArray(deger) ? deger.length : Object.keys(deger).length)) satir[gorunumAdi] = deger;
        }
        if (Object.keys(satir).length) model[senaryo] = satir;
      }
      return model;
    }

    function gumrukTarifeOzeti(deger) {
      const oranlar = (deger?.listeler || []).flatMap(l => l.oranlar || []);
      if (!oranlar.length) return '';
      const gorunen = oranlar.map(x => {
        const ulke = dil() === 'en' ? (x.ulke_adi_en || x.ulke_adi_tr || x.ulke_grubu) : (x.ulke_adi_tr || x.ulke_adi_en || x.ulke_grubu);
        return `${ulke}: ${yuzde(x.oran)}`;
      });
      const uygunluk = deger.uygulanabilirlik;
      const uygunlukMetni = uygunluk ? ` · ${dil() === 'en' ? 'Applicability requires verification' : 'Menşe/rejim doğrulaması gerekir'}` : '';
      return gorunen.join(' · ') + uygunlukMetni;
    }

    function kartUret(secim) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const kartTip = KART_TIPI[kaynak];

      const temelSatirlar = kaynakBazliAlanlar(secim);
      const temelHtml = birlesikTabloCiz(temelSatirlar);

      let vergiHtml = '';
      const vergiModel = vergiModeliniAl(kayit.vergi);

      if (vergiModel && typeof vergiModel === 'object') {
        const vergiBloklari = [];
        const isDolu = (obj) => obj && Object.keys(obj).length > 0;

        if (isDolu(vergiModel.yurtici)) {
          const v = vergiModel.yurtici;
          let kdvVal = secVergiKaydi(v.kdv);
          let kdvText = kdvVal?.durum === 'gtip_bazli' ? t('gtip_bazli') : t('oran_bilinmiyor'), kdvSub = '', kdvClass = 'text-amber-400';
          if (kdvVal) {

          if (hasYurtici || hasIthalat || hasIhracat) {
            const count = [hasYurtici, hasIthalat, hasIhracat].filter(Boolean).length;
            const gridCols = count === 3 ? 'grid-cols-1 md:grid-cols-3' : (count === 2 ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-1');

            const renderBelgeListesi = (liste) => {
              if (!liste || liste.length === 0) return '';
              return `<div class="space-y-2">` + liste.map(b => {
                const seviye = b.durum || b.seviye || 'opsiyonel';
                const kosulObj = b.kosul || {};
                const kosul = typeof kosulObj === 'object' ? (dil() === 'en' ? (kosulObj.en || kosulObj.tr) : (kosulObj.tr || kosulObj.en)) : kosulObj;
                const seviyeEtiket = seviye === 'zorunlu' ? t('belge_zorunlu') : seviye === 'kosullu' ? t('belge_kosullu') : t('belge_opsiyonel');
                const adMetin = secAd(b);
                const seviyeRenk = seviye === 'zorunlu' ? 'bg-rose-500/10 border-rose-500/20 text-rose-400' : (seviye === 'kosullu' ? 'bg-amber-500/10 border-amber-500/20 text-amber-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400');

                return `<div class="bg-win-card border border-win-border rounded p-2.5 flex flex-col gap-1">
                  <div class="flex justify-between items-start gap-2">
                    <span class="text-xs font-semibold text-slate-200">${kacis(adMetin)}</span>
                    <span class="px-1.5 py-0.5 text-[9px] font-bold rounded border ${seviyeRenk} whitespace-nowrap">${seviyeEtiket}</span>
                  </div>
                  ${b.tur ? `<div class="text-[10px] text-slate-500">${kacis(enumEtiketi(b.tur))}</div>` : ''}
                  ${kosul ? `<div class="text-[10px] text-slate-400">${kacis(kosul)}</div>` : ''}
                </div>`;
              }).join('') + `</div>`;
            };

            belgeHtml = `
              <div class="border-b border-win-border bg-win-dark/20 p-5">
                <h3 class="text-[11px] font-bold uppercase tracking-wider text-win-400 mb-4 flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                  ${t('belge_baslik')}
                </h3>
                
                <div class="grid ${gridCols} gap-4">
                  ${hasYurtici ? `
                  <div class="bg-win-card border border-win-border rounded-xl p-4 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-win-500"></div>
                    <div class="flex items-center justify-between mb-3 pl-2">
                      <h4 class="font-bold text-white text-xs">${t('islem_yurtici')}</h4>
                    </div>
                    <div class="pl-2">
                      ${renderBelgeListesi(belgeler.yurtici)}
                    </div>
                  </div>
                  ` : ''}

                  ${hasIthalat ? `
                  <div class="bg-win-card border border-win-border rounded-xl p-4 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                    <div class="flex items-center justify-between mb-3 pl-2">
                      <h4 class="font-bold text-white text-xs">${t('islem_ithalat')}</h4>
                    </div>
                    <div class="pl-2">
                      ${renderBelgeListesi(belgeler.ithalat)}
                    </div>
                  </div>
                  ` : ''}

                  ${hasIhracat ? `
                  <div class="bg-win-card border border-win-border rounded-xl p-4 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                    <div class="flex items-center justify-between mb-3 pl-2">
                      <h4 class="font-bold text-white text-xs">${t('islem_ihracat')}</h4>
                    </div>
                    <div class="pl-2">
                      ${renderBelgeListesi(belgeler.ihracat)}
                    </div>
                  </div>
                  ` : ''}
                </div>
              </div>
            `;
          }
        }
      }

      // NACE faaliyet belgeleri, GTİP ürün belgelerinden ayrı bir ilişki türüdür.
      let faaliyetBelgeHtml = '';
      if (kaynak === 'nace' && Array.isArray(kayit.faaliyet_belgeleri) && kayit.faaliyet_belgeleri.length) {
        faaliyetBelgeHtml = `
          <div class="border-b border-win-border bg-win-dark/20 p-5">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-win-400 mb-4 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              ${dil() === 'en' ? 'Activity documents' : 'Faaliyet belgeleri'}
            </h3>
            <div class="bg-win-card border border-win-border rounded-xl overflow-hidden shadow-sm">
              <table class="w-full text-left">
                <thead class="bg-win-hover text-slate-400 font-semibold uppercase tracking-wider text-[10px]"><tr>
                  <th class="px-4 py-2.5">${t('belge_adi')}</th><th class="px-4 py-2.5">${t('durum')}</th><th class="px-4 py-2.5">${dil() === 'en' ? 'Applies to' : 'Uygulama alanı'}</th>
                </tr></thead>
                <tbody class="divide-y divide-win-border/40">
                  ${kayit.faaliyet_belgeleri.map(b => {
                    const kosulObj = b.kosul || {};
                    const kosul = typeof kosulObj === 'object' ? (dil() === 'en' ? (kosulObj.en || kosulObj.tr) : (kosulObj.tr || kosulObj.en)) : kosulObj;
                    const yonler = (Array.isArray(b.yon) ? b.yon : []).map(y => ({ yurtici: t('islem_yurtici'), ithalat: t('islem_ithalat'), ihracat: t('islem_ihracat') })[y] || y).join(', ');
                    const seviye = b.durum || 'opsiyonel';
                    const renk = seviye === 'zorunlu' ? 'text-rose-400' : seviye === 'kosullu' ? 'text-amber-400' : 'text-emerald-400';
                    return `<tr class="hover:bg-win-hover/40 transition">
                      <td class="px-4 py-2.5 text-xs text-slate-200 font-medium">${kacis(secAd(b))}${b.kod ? `<div class="text-[10px] text-slate-500 font-mono">${kacis(b.kod)}</div>` : ''}${kosul ? `<div class="text-[10px] text-slate-400 mt-1">${kacis(kosul)}</div>` : ''}</td>
                      <td class="px-4 py-2.5 text-xs font-semibold ${renk}">${kacis(enumEtiketi(seviye))}</td>
                      <td class="px-4 py-2.5 text-xs text-slate-400">${kacis(yonler || '—')}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
      }

      // --- MESLEKİ BELGELER ---
      let meslekiBelgeHtml = '';
      if (Array.isArray(kayit.mesleki_belgeler) && kayit.mesleki_belgeler.length > 0) {
        meslekiBelgeHtml = `
          <div class="border-b border-win-border bg-win-dark/20 p-5">
            <h3 class="text-[11px] font-bold uppercase tracking-wider text-win-400 mb-4 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              ${t('mesleki_belgeler')}
            </h3>
            <div class="bg-win-card border border-win-border rounded-xl overflow-hidden shadow-sm">
              <table class="w-full text-left">
                <thead class="bg-win-hover text-slate-400 font-semibold uppercase tracking-wider text-[10px]">
                  <tr>
                    <th class="px-4 py-2.5">${t('belge_adi')}</th>
                    <th class="px-4 py-2.5">${t('tur')}</th>
                    <th class="px-4 py-2.5 text-center">${t('durum')}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-win-border/40">
                  ${kayit.mesleki_belgeler.map(b => {
          const seviye = b.durum || 'opsiyonel';
          const seviyeEtiket = seviye === 'zorunlu' ? t('belge_zorunlu') : seviye === 'kosullu' ? t('belge_kosullu') : t('belge_opsiyonel');
          const seviyeRenk = seviye === 'zorunlu' ? 'bg-rose-500/10 border-rose-500/20 text-rose-400' : (seviye === 'kosullu' ? 'bg-amber-500/10 border-amber-500/20 text-amber-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400');
          const adMetin = secAd(b);
          const turMetin = enumEtiketi(b.tur);

          return `
                      <tr class="hover:bg-win-hover/40 transition">
                        <td class="px-4 py-2.5 text-xs text-slate-300 font-medium">${kacis(adMetin)}</td>
                        <td class="px-4 py-2.5 text-xs text-slate-400">${kacis(turMetin)}</td>
                        <td class="px-4 py-2.5 text-center">
                          <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${seviyeRenk} whitespace-nowrap">${seviyeEtiket}</span>
                        </td>
                      </tr>
                    `;
        }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      let tesvikHtml = '';
      if (Array.isArray(kayit.tesvik_adaylari) && kayit.tesvik_adaylari.length > 0) {
        tesvikHtml = tesvikListeCiz(t('tesvik_adaylari'), kayit.tesvik_adaylari);
      }

      let referansHtml = '';
      if (kaynak !== 'gtip') {
        const gtipList = Array.isArray(kayit.gtip) ? kayit.gtip : [];
        if (gtipList.length > 0) referansHtml += referansListeCiz('GTİP', gtipList, 'orange', 'gtip');
      }
      if (kaynak !== 'cpc' && kaynak !== 'gtip') {
        const cpcList = Array.isArray(kayit.cpc) ? kayit.cpc : [];
        if (cpcList.length > 0) referansHtml += referansListeCiz('CPC', cpcList, 'blue', 'cpc');
      }
      if (kaynak !== 'nace') {
        const naceList = Array.isArray(kayit.nace) ? kayit.nace : [];
        if (naceList.length > 0) referansHtml += referansListeCiz('NACE', naceList, 'emerald', 'nace');
      }
      if (kaynak !== 'isco') {
        const iscoList = Array.isArray(kayit.isco) ? kayit.isco : [];
        if (iscoList.length > 0) referansHtml += referansListeCiz('ISCO', iscoList, 'indigo', 'isco');
      }

      if (Array.isArray(kayit.sgk_adaylari) && kayit.sgk_adaylari.length > 0) {
        // SGK meslek kodları ayrı bir kod sistemidir; ISCO kartına yanlış yönlendirme yapılmaz.
        referansHtml += referansListeCiz(t('sgk_aday'), kayit.sgk_adaylari, 'teal', null);
      }

      const referansWrapper = referansHtml ? `
        <div class="border-b border-win-border bg-win-dark/20 p-5">
          <h3 class="text-[11px] font-bold uppercase tracking-wider text-win-400 mb-4 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            ${t('iliskili_kodlar')}
          </h3>
          ${referansHtml}
        </div>
      ` : '';

      return `
        <div class="bg-win-card border border-win-border rounded-xl shadow-2xl overflow-hidden modal-anim">
          <div class="p-5 border-b border-win-border bg-win-dark flex items-start justify-between gap-4 sticky top-0 z-10">
            <div class="min-w-0 flex items-center gap-3 flex-wrap">
              <span class="text-base">${KAYNAK_IKON[kaynak]}</span>
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-[11px] font-bold tracking-wider border ${KAYNAK_SINIF[kaynak]}">${t(kartTip.baslikKey)}</span>
              <code class="text-xs font-mono text-win-100 bg-win-500/10 px-2 py-0.5 rounded border border-win-500/20">${kacis(kod)}</code>
            </div>
            <button id="kapat-btn" type="button" title="${t('kapat')}" class="flex-none w-9 h-9 rounded-lg bg-win-dark hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition">✕</button>
          </div>
          ${temelHtml}
          ${vergiHtml}
          ${sgkHtml}
          ${randimanHtml}
          ${belgeHtml}
          ${faaliyetBelgeHtml}
          ${meslekiBelgeHtml}
          ${tesvikHtml}
          ${referansWrapper}
        </div>`;
    }

    function kaynakBazliAlanlar(secim) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const adTR = kayit.tanim_tr || kayit.ad_tr || '';
      const adEN = kayit.tanim_en || kayit.ad_en || '';
      const ad = dil() === 'en' ? (adEN || adTR) : (adTR || adEN);
      const satirlar = [];

      let cpcKod = '', cpcTR = '', cpcEN = '';
      if (Array.isArray(kayit.cpc) && kayit.cpc.length > 0) {
        cpcKod = kayit.cpc[0].kod;
        cpcTR = kayit.cpc[0].ad_tr || '';
        cpcEN = kayit.cpc[0].ad_en || '';
      } else if (kayit.cpc && kayit.cpc.kod) {
        cpcKod = kayit.cpc.kod;
        cpcTR = kayit.cpc.ad_tr || '';
        cpcEN = kayit.cpc.ad_en || '';
      }

      let naceKod = '', naceTR = '', naceEN = '';
      if (Array.isArray(kayit.nace) && kayit.nace.length > 0) {
        naceKod = kayit.nace[0].kod;
        naceTR = kayit.nace[0].ad_tr || '';
        naceEN = kayit.nace[0].ad_en || '';
      } else if (kayit.nace && kayit.nace.kod) {
        naceKod = kayit.nace.kod;
        const hedefKod = String(naceKod).replace(/\./g, '');
        const naceObj = VERI.nace.kayitlar.find(n => String(n.kod).replace(/\./g, '') === hedefKod);
        if (naceObj) {
          naceTR = naceObj.tanim_tr || naceObj.ad_tr || naceObj.ad || '';
          naceEN = naceObj.tanim_en || naceObj.ad_en || '';
        }
      }

      if (kaynak === 'gtip') {
        satirlar.push({ alan: t('gtip_kod'), deger: kod, vurgu: 'kod' });
        if (ad) satirlar.push({ alan: t('urun_adi'), deger: ad });
        if (cpcKod) {
          satirlar.push({ alan: t('cpc_kod'), deger: cpcKod, vurgu: 'kod' });
          const cpcAd = dil() === 'en' ? (cpcEN || cpcTR) : (cpcTR || cpcEN);
          if (cpcAd) satirlar.push({ alan: t('hizmet_adi'), deger: cpcAd });
        }
        if (naceKod) {
          satirlar.push({ alan: t('nace_kod'), deger: naceKod, vurgu: 'kod' });
          const naceAd = dil() === 'en' ? (naceEN || naceTR) : (naceTR || naceEN);
          if (naceAd) satirlar.push({ alan: t('faaliyet_adi'), deger: naceAd });
        }
      }

      if (kaynak === 'cpc') {
        satirlar.push({ alan: t('cpc_kod'), deger: kod, vurgu: 'kod' });
        if (ad) satirlar.push({ alan: t('hizmet_adi'), deger: ad });
        if (naceKod) {
          satirlar.push({ alan: t('nace_kod'), deger: naceKod, vurgu: 'kod' });
          const naceAd = dil() === 'en' ? (naceEN || naceTR) : (naceTR || naceEN);
          if (naceAd) satirlar.push({ alan: t('faaliyet_adi'), deger: naceAd });
        }
      }

      if (kaynak === 'nace') {
        satirlar.push({ alan: t('nace_kod'), deger: kod, vurgu: 'kod' });
        if (ad) satirlar.push({ alan: t('faaliyet_adi'), deger: ad });
      }

      if (kaynak === 'isco') {
        satirlar.push({ alan: t('isco_kod'), deger: kod, vurgu: 'kod' });
        if (ad) satirlar.push({ alan: t('meslek_adi'), deger: ad });
      }

      return satirlar;
    }

    function birlesikTabloCiz(satirlar) {
      const rowsHtml = satirlar.map(s => {
        if (s.tip === 'baslik') {
          return `<tr class="bg-win-dark/60 border-t border-win-border/40"><td colspan="2" class="px-4 py-2 text-[10px] font-bold uppercase tracking-wider text-win-400">${kacis(s.metin)}</td></tr>`;
        }
        const bosMu = !s.deger || s.deger === '' || s.deger === '—';
        if (s.vurgu === 'kod') {
          return `<tr class="bg-win-dark/20 hover:bg-win-hover/40 transition">
            <td class="px-4 py-3 align-top text-slate-400 text-xs font-semibold whitespace-nowrap">${kacis(s.alan)}</td>
            <td class="px-4 py-3 align-top font-mono text-base text-emerald-300 font-bold">${kacis(s.deger)}</td>
          </tr>`;
        }
        const degerClass = s.vurgu === 'kdv' ? 'text-win-100 font-bold' : s.vurgu === 'otv' ? 'text-rose-400 font-bold' : s.vurgu === 'muaf' ? 'text-emerald-400 font-semibold' : 'text-slate-100';
        const degerGoster = bosMu ? '—' : s.deger;
        return `<tr class="hover:bg-win-hover/40 transition">
          <td class="px-4 py-2.5 align-top text-slate-300 text-xs font-medium">${kacis(s.alan)}</td>
          <td class="px-4 py-2.5 align-top font-mono text-xs ${bosMu ? 'text-slate-600 italic' : degerClass}">${kacis(degerGoster)}</td>
        </tr>`;
      }).join('');

      return `
        <div class="overflow-x-auto border-b border-win-border">
          <table class="w-full text-left">
            <thead class="bg-win-hover border-b border-win-border text-slate-400 font-semibold uppercase tracking-wider text-[10px]">
              <tr>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('alan_adi')}</th>
                <th class="px-4 py-2.5">${t('deger')}</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-win-border/40">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    function toggleMobileSidebar() {
      const sidebar = $('sidebar'); const overlay = $('mobile-overlay');
      const acik = !sidebar.classList.contains('-translate-x-full');
      if (acik) { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
      else { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
    }
    function closeMobileSidebar() {
      $('sidebar').classList.add('-translate-x-full'); $('mobile-overlay').classList.add('hidden');
    }
    $('btn-mobile-menu')?.addEventListener('click', toggleMobileSidebar);
    $('mobile-overlay')?.addEventListener('click', closeMobileSidebar);

    document.addEventListener('pdaas:dil', () => {
      baslikDiliniUygula();
      durumDiliniUygula();
      renderFilterList();
      if (SECILI) detayGoster(SECILI);
      aramayiBaslat();
    });

    $('detay-overlay').addEventListener('click', detayKapat);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') detayKapat(); });

    let aramaZaman;
    $('arama').addEventListener('input', () => {
      clearTimeout(aramaZaman);
      aramaZaman = setTimeout(() => { aramayiBaslat(); detayKapat(); }, 250);
    });

    $('sonuc-alani').addEventListener('click', e => {
      const el = e.target.closest('.kart-tikla');
      if (!el) return;
      const idx = Number(el.dataset.idx);
      if (TUM_SONUCLAR[idx]) detayGoster(TUM_SONUCLAR[idx]);
    });

    const mainEl = $('main-content');
    const scrollTopBtn = $('btn-scroll-top');
    mainEl.addEventListener('scroll', () => {
      if (!$('detay-modal').classList.contains('hidden')) return;
      if (mainEl.scrollTop > 300) scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      else scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      if ((mainEl.clientHeight + mainEl.scrollTop) >= mainEl.scrollHeight - 500) {
        if (GORUNEN_LIMIT < TUM_SONUCLAR.length) { GORUNEN_LIMIT += 100; sonuclariCiz(); }
      }
    });
    scrollTopBtn.addEventListener('click', () => mainEl.scrollTo({ top: 0, behavior: 'smooth' }));

    renderFilterList();
    tumVeriYukle().then(() => {
    });
  </script>
</body>

</html>
