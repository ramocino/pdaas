<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDaaS · Ürün &amp; Hizmet Kartı</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/pdaas-tailwind.js"></script>
  <link rel="stylesheet" href="assets/pdaas.css">
</head>

<body
  class="bg-win-base text-slate-100 font-sans h-screen flex flex-col overflow-hidden antialiased selection:bg-win-500 selection:text-white">

  <div id="pdaas-header"></div>

  <div class="flex-1 flex overflow-hidden relative min-h-0">
    <aside id="sidebar"
      class="w-72 lg:w-80 flex-none bg-win-dark border-r border-win-border flex flex-col fixed lg:static top-16 bottom-0 left-0 z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out min-h-0">
      <div class="p-4 border-b border-win-border space-y-2 flex-none">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold tracking-tight text-white uppercase flex items-center gap-2">
            <svg class="w-4 h-4 text-win-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
            <span data-i18n="kategoriler_title">Kategoriler</span>
          </h2>
          <span id="toplam-sayi"
            class="px-2 py-0.5 text-[11px] font-semibold bg-win-card text-slate-300 rounded border border-win-border">0</span>
        </div>
        <p class="text-[11px] text-slate-500" data-i18n="kategoriler_desc">Kaynak türüne göre filtreleyin</p>
      </div>
      <div id="filter-list" class="flex-1 overflow-y-auto overscroll-contain p-3 space-y-2 min-h-0"></div>
      <div
        class="p-3 border-t border-win-border bg-win-dark/50 text-[11px] text-slate-500 flex items-center justify-between flex-none">
        <span>REST JSON API</span>
        <span class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span data-i18n="live_connection">Canlı Bağlantı</span>
        </span>
      </div>
    </aside>

    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-20 hidden lg:hidden mica-panel"></div>

    <main id="main-content" class="flex-1 overflow-y-auto overscroll-contain bg-win-base flex flex-col min-h-0">
      <div class="max-w-6xl w-full mx-auto p-4 lg:p-8 space-y-6">
        <div>
          <h1 class="text-2xl lg:text-3xl font-extrabold text-white tracking-tight" data-i18n="sayfa_baslik"></h1>
          <p class="text-sm text-slate-400 mt-1" data-i18n="sayfa_aciklama"></p>
        </div>
        <div id="durum-alani" class="hidden"></div>
        <div
          class="bg-win-card border border-win-border rounded-xl shadow-xl overflow-hidden sticky top-4 z-30 backdrop-blur-md">
          <div class="p-4 space-y-3">
            <div class="relative">
              <svg class="w-5 h-5 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input type="text" id="arama"
                class="w-full h-12 pl-12 pr-4 bg-win-base border border-win-border rounded-lg text-white text-sm font-medium focus:outline-none focus:border-win-500 transition placeholder-slate-500"
                data-i18n-placeholder="arama_yer" autocomplete="off" autofocus>
            </div>
            <div id="filtre-notu" class="hidden text-[11px] text-slate-500 flex items-center gap-2"></div>
          </div>
        </div>
        <div id="sonuc-alani" class="space-y-4">
          <div class="flex-1 flex flex-col items-center justify-center py-16 text-center max-w-lg mx-auto">
            <div
              class="w-20 h-20 rounded-2xl bg-win-card border border-win-border text-win-500 flex items-center justify-center text-3xl mb-6 shadow-xl">
              📋</div>
            <h2 class="text-2xl font-bold text-white tracking-tight mb-2" data-i18n="bos_baslik"></h2>
            <p class="text-sm text-slate-400 leading-relaxed" data-i18n="bos_aciklama"></p>
          </div>
        </div>
        <div id="yukleniyor-spinner" class="hidden py-6 text-center">
          <div class="inline-block w-6 h-6 border-2 border-win-500 border-t-transparent rounded-full animate-spin">
          </div>
        </div>
      </div>
    </main>
  </div>

  <button id="btn-scroll-top" type="button" aria-label="Yukarı git"
    class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-xl bg-win-500 hover:bg-win-600 text-white shadow-2xl flex items-center justify-center transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19V5m-7 7l7-7 7 7" />
    </svg>
  </button>

  <div id="detay-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="detay-overlay" class="absolute inset-0 bg-black/70 glass-panel"></div>
    <div id="detay-icerik" class="relative max-w-5xl w-full max-h-[92vh] overflow-y-auto modal-anim"></div>
  </div>

  <script type="module">
    import { CONFIG, apiUrl, apiFetch } from './assets/pdaas-config.js';
    import { $, kacis, sayi, normKod, kodTemiz, tr_lower } from './assets/pdaas-utils.js';
    import { t, dilBaslat, dilUygula, kayitAdi, UI, getDil } from './assets/pdaas-i18n.js';
    import { renderLayout } from './assets/pdaas-layout.js';

    const dil = () => getDil();

    dilBaslat();
    renderLayout({ activePage: 'urunhizmetkarti.html' });
    dilUygula();

    const KAYNAK_ETIKET = { gtip: 'GTİP', isco: 'ISCO', cpc: 'CPC', nace: 'NACE' };
    const KAYNAK_SINIF = { gtip: 'etiket-hs', isco: 'etiket-isco', cpc: 'etiket-cpc', nace: 'etiket-nace' };
    const KAYNAK_IKON = { gtip: '📦', cpc: '⚙️', nace: '🏭', isco: '👤' };

    const KART_TIPI = {
      gtip: { tip: 'urun', baslikKey: 'kart_urun', descKey: 'kart_urun_desc', kdvVar: true, otvVar: true, belgeVar: true, randimanVar: true },
      cpc: { tip: 'hizmet', baslikKey: 'kart_hizmet', descKey: 'kart_hizmet_desc', kdvVar: true, otvVar: false, belgeVar: true, randimanVar: true },
      nace: { tip: 'faaliyet', baslikKey: 'kart_faaliyet', descKey: 'kart_faaliyet_desc', kdvVar: false, otvVar: false, belgeVar: true, randimanVar: false },
      isco: { tip: 'meslek', baslikKey: 'kart_meslek', descKey: 'kart_meslek_desc', kdvVar: false, otvVar: false, belgeVar: true, randimanVar: false },
    };

    const VERGI_KAYNAKLARI = new Set(['gtip', 'cpc']);

    const VERI = {
      gtip: { kayitlar: [], yuklendi: false, kaynak: '/api/v1/ham/gtip-kodlari.json' },
      cpc: { kayitlar: [], yuklendi: false, kaynak: '/api/v1/ham/cpc-kodlari.json' },
      nace: { kayitlar: [], yuklendi: false, kaynak: '/api/v1/ham/nace-kodlari.json' },
      isco: { kayitlar: [], yuklendi: false, kaynak: '/api/v1/ham/isco-kodlari.json' },
    };

    const EK_KAYNAK = {
      kurumlar: '/api/v1/meta/kurumlar.json',
      gtipBelge: '/api/v1/ham/gtip-ozel-izin-belge.json',
      gtipRandiman: '/api/v1/ham/gtip-randiman.json',
      cpcBelge: '/api/v1/ham/cpc-ozel-izin-belge.json',
      cpcRandiman: '/api/v1/ham/cpc-randiman.json',
      naceBelge: '/api/v1/ham/nace-ozel-izin-belge.json',
      iscoBelge: '/api/v1/ham/isco-ozel-izin-belge.json'
    };

    let AKTIF_FILTRE = 'hepsi', TUM_SONUCLAR = [], GORUNEN_LIMIT = 100;
    let SECILI = null;

    const EK_VERI = {
      kurumlar: null,
      gtip: { belge: null, randiman: null },
      cpc: { belge: null, randiman: null },
      nace: { belge: null, randiman: null },
      isco: { belge: null, randiman: null },
    };

    const FILTRE_ITEMS = [
      { tip: 'hepsi', ikon: '🗂️', etiketKey: 'filtre_hepsi', altKey: 'kategori_hepsi_desc' },
      { tip: 'gtip', ikon: '📦', etiket: 'GTİP', altKey: 'kategori_gtip_desc' },
      { tip: 'cpc', ikon: '⚙️', etiket: 'CPC', altKey: 'kategori_cpc_desc' },
      { tip: 'nace', ikon: '🏭', etiket: 'NACE', altKey: 'kategori_nace_desc' },
      { tip: 'isco', ikon: '👤', etiket: 'ISCO', altKey: 'kategori_isco_desc' },
    ];

    function updateFilterCounts() {
      const toplam = VERI.gtip.kayitlar.length + VERI.cpc.kayitlar.length + VERI.nace.kayitlar.length + VERI.isco.kayitlar.length;
      const setVal = (id, v) => { const el = $(id); if (el) el.textContent = sayi(v); };
      setVal('sayi-hepsi', toplam); setVal('sayi-gtip', VERI.gtip.kayitlar.length);
      setVal('sayi-cpc', VERI.cpc.kayitlar.length); setVal('sayi-nace', VERI.nace.kayitlar.length);
      setVal('sayi-isco', VERI.isco.kayitlar.length);
      setVal('toplam-sayi', toplam);
    }

    function renderFilterList() {
      const container = $('filter-list');
      if (!container) return;
      container.innerHTML = FILTRE_ITEMS.map(item => {
        const aktif = item.tip === AKTIF_FILTRE;
        const etiket = item.etiket || t(item.etiketKey);
        const altEtiket = t(item.altKey);
        const btnCls = aktif ? 'bg-win-500/20 border-win-500/40 text-win-400' : 'bg-win-card border-win-border text-slate-200 hover:bg-win-hover';
        const badgeCls = aktif ? 'bg-win-500/30 text-win-300' : 'bg-win-base text-slate-400';
        return `
          <button class="filter-btn w-full px-3 py-2.5 rounded-md border transition text-left flex items-center justify-between group ${btnCls}" data-tip="${item.tip}">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-base flex-none">${item.ikon}</span>
              <div class="text-left min-w-0">
                <div class="text-sm font-semibold truncate">${kacis(etiket)}</div>
                <div class="text-[10px] text-slate-500 truncate">${kacis(altEtiket)}</div>
              </div>
            </div>
            <span id="sayi-${item.tip}" class="px-2 py-0.5 text-[10px] font-bold rounded flex-none ${badgeCls}">0</span>
          </button>`;
      }).join('');

      updateFilterCounts();

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          AKTIF_FILTRE = btn.dataset.tip;
          renderFilterList();
          aramayiBaslat();
          detayKapat();
          closeMobileSidebar();
        });
      });
    }

    async function fetchGuvenli(yol) {
      try {
        const r = await apiFetch(yol);
        if (!r.ok) return null;
        return await r.json();
      } catch (e) { return null; }
    }

    async function kurumlariYukle() {
      const d = await fetchGuvenli(EK_KAYNAK.kurumlar);
      if (!d) { EK_VERI.kurumlar = {}; return; }
      const duz = {};
      const k = d.kurumlar || d;
      if (Array.isArray(k)) {
        for (const item of k) if (item?.kod) duz[item.kod] = item;
      } else {
        for (const v of Object.values(k)) {
          if (v && typeof v === 'object' && !v.ad_tr && !v.ad) Object.assign(duz, v);
          else if (v && typeof v === 'object' && v.ad_tr) {
            const kod = Object.keys(k).find(x => k[x] === v);
            if (kod) duz[kod] = v;
          }
        }
      }
      EK_VERI.kurumlar = duz;
    }

    async function ekVeriYukle(kaynak) {
      if (!EK_VERI[kaynak]) return;
      const harita = {
        gtip: { belge: EK_KAYNAK.gtipBelge, randiman: EK_KAYNAK.gtipRandiman },
        cpc: { belge: EK_KAYNAK.cpcBelge, randiman: EK_KAYNAK.cpcRandiman },
        nace: { belge: EK_KAYNAK.naceBelge, randiman: null },
        isco: { belge: EK_KAYNAK.iscoBelge, randiman: null },
      };
      const y = harita[kaynak];
      if (!y) return;
      const gorevler = [];
      if (y.belge && !EK_VERI[kaynak].belge) gorevler.push(fetchGuvenli(y.belge).then(d => { if (d) EK_VERI[kaynak].belge = d; }));
      if (y.randiman && !EK_VERI[kaynak].randiman) gorevler.push(fetchGuvenli(y.randiman).then(d => { if (d) EK_VERI[kaynak].randiman = d; }));
      await Promise.all(gorevler);
    }

    async function tumVeriYukle() {
      const durum = $('durum-alani');
      durum.classList.remove('hidden');
      durum.innerHTML = `<div class="bg-win-card border border-win-border rounded-lg p-3 flex items-center gap-3 text-win-100 text-xs"><div class="inline-block w-4 h-4 border-2 border-win-500 border-t-transparent rounded-full animate-spin"></div><span>${t('yukleniyor')}</span></div>`;

      try {
        const KATALOG_ENDPOINT = CONFIG?.KATALOG_ENDPOINT || '/katalog.json';
        const kat = await fetchGuvenli(KATALOG_ENDPOINT);

        if (kat && kat.servisler) {
          const getUrl = (kod) => {
            const s = kat.servisler.find(x => x.kod === kod);
            if (!s) return null;
            const k = s.katmanlar.ham || s.katmanlar.konsolide;
            if (!k || !k.url) return null;
            // Katalog index.json (parça listesi) döndürüyorsa, aynı klasördeki
            // tek dosyayı tercih et — çünkü bu sayfa "kayitlar" bekliyor.
            if (k.url.endsWith('/index.json')) {
              return k.url.replace('/index.json', '.json');
            }
            return k.url;
          };

          const gtipTamUrl = getUrl('gtip-tam');
          if (gtipTamUrl) VERI.gtip.kaynak = gtipTamUrl;
          else if (getUrl('gtip-kodlari')) VERI.gtip.kaynak = getUrl('gtip-kodlari');

          const cpcTamUrl = getUrl('cpc-tam');
          if (cpcTamUrl) VERI.cpc.kaynak = cpcTamUrl;
          else if (getUrl('cpc-kodlari')) VERI.cpc.kaynak = getUrl('cpc-kodlari');

          const naceTamUrl = getUrl('nace-tam');
          if (naceTamUrl) VERI.nace.kaynak = naceTamUrl;
          else if (getUrl('nace-kodlari')) VERI.nace.kaynak = getUrl('nace-kodlari');

          const iscoTamUrl = getUrl('isco-tam');
          if (iscoTamUrl) VERI.isco.kaynak = iscoTamUrl;
          else if (getUrl('isco-kodlari')) VERI.isco.kaynak = getUrl('isco-kodlari');

          if (getUrl('gtip-ozel-izin-belge')) EK_KAYNAK.gtipBelge = getUrl('gtip-ozel-izin-belge');
          if (getUrl('gtip-randiman')) EK_KAYNAK.gtipRandiman = getUrl('gtip-randiman');
          if (getUrl('cpc-ozel-izin-belge')) EK_KAYNAK.cpcBelge = getUrl('cpc-ozel-izin-belge');
          if (getUrl('cpc-randiman')) EK_KAYNAK.cpcRandiman = getUrl('cpc-randiman');
          if (getUrl('nace-ozel-izin-belge')) EK_KAYNAK.naceBelge = getUrl('nace-ozel-izin-belge');
          if (getUrl('isco-ozel-izin-belge')) EK_KAYNAK.iscoBelge = getUrl('isco-ozel-izin-belge');
        }

        const [gtipR, cpcR, naceR, iscoR] = await Promise.all([
          fetchGuvenli(VERI.gtip.kaynak), fetchGuvenli(VERI.cpc.kaynak), fetchGuvenli(VERI.nace.kaynak), fetchGuvenli(VERI.isco.kaynak),
        ]);

        if (gtipR) { VERI.gtip.kayitlar = gtipR.kayitlar || []; VERI.gtip.yuklendi = true; }
        if (cpcR) { VERI.cpc.kayitlar = cpcR.kayitlar || []; VERI.cpc.yuklendi = true; }
        if (naceR) { VERI.nace.kayitlar = naceR.kayitlar || []; VERI.nace.yuklendi = true; }
        if (iscoR) { VERI.isco.kayitlar = iscoR.kayitlar || []; VERI.isco.yuklendi = true; }

        kurumlariYukle();
        updateFilterCounts();

        durum.innerHTML = `<div class="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-3 flex items-center gap-3 text-emerald-400 text-xs"><span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${t('yuklendi')}</span></div>`;
        setTimeout(() => { durum.classList.add('hidden'); durum.innerHTML = ''; }, 2000);
      } catch (e) {
        console.error("Veri yükleme hatası:", e);
        durum.innerHTML = `<div class="bg-rose-500/10 border border-rose-500/20 rounded-lg p-3 text-rose-400 text-xs">${t('yukleme_hatasi')}</div>`;
      }
    }

    function kurumAdi(kurum_kod) {
      if (!kurum_kod) return '—';
      if (EK_VERI.kurumlar && EK_VERI.kurumlar[kurum_kod]) {
        const k = EK_VERI.kurumlar[kurum_kod];
        return dil() === 'en' ? (k.ad_en || k.ad_tr) : (k.ad_tr || k.ad_en);
      }
      return kurum_kod;
    }

    function gtipZinciri(kod) {
      const tk = kodTemiz(kod);
      if (!/^\d+$/.test(tk)) return [normKod(kod)];
      const dilimler = [2, 4, 6, 8, 10, 12];
      const zincir = [];
      for (const d of dilimler) { if (tk.length >= d) zincir.push(tk.slice(0, d)); }
      return zincir;
    }

    function ataZinciri(kayit, kodMap, kaynakTip) {
      const kod = normKod(kayit.kod);
      if (kaynakTip === 'gtip') {
        const g = gtipZinciri(kod);
        const kayitlar = [];
        for (const x of g) { const k = kodMap.get(x); if (k) kayitlar.push(k); }
        const son = kayitlar[kayitlar.length - 1];
        if (!son || normKod(son.kod) !== kod) kayitlar.push(kayit);
        return kayitlar;
      }
      const zincir = [];
      const gorulen = new Set();
      let m = kayit;
      while (m) {
        const mk = normKod(m.kod);
        if (gorulen.has(mk)) break;
        gorulen.add(mk);
        zincir.unshift(m);
        m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
      }
      return zincir;
    }

    function agacKur(kaynakTip, tumKayitlar, eslesenKodlar) {
      const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
      const dahil = new Map();
      for (const kod of eslesenKodlar) {
        const k = kodMap.get(kod);
        if (!k) continue;
        const zincir = ataZinciri(k, kodMap, kaynakTip);
        zincir.forEach((z, i) => {
          const zk = normKod(z.kod);
          const sonuncu = (i === zincir.length - 1);
          const mevcut = dahil.get(zk);
          if (!mevcut) dahil.set(zk, { kayit: z, eslesme: sonuncu });
          else if (sonuncu) mevcut.eslesme = true;
        });
      }
      return [...dahil.values()].map(x => ({ kaynak: kaynakTip, kayit: x.kayit, eslesme: x.eslesme }));
    }

    function kaynaklariTara(q, filtre) {
      const sorgu = tr_lower(q || '').trim();
      const kaynaklar = [];
      if (filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
      if (filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
      if (filtre === 'hepsi' || filtre === 'cpc') kaynaklar.push(['cpc', VERI.cpc]);
      if (filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

      const tumSonuclar = [];
      const MAX_SONUC = 50000;

      for (const [kaynakTip, veri] of kaynaklar) {
        const eslesenKodlar = [];
        for (const k of veri.kayitlar) {
          if (!sorgu) {
            eslesenKodlar.push(normKod(k.kod));
            if (eslesenKodlar.length >= MAX_SONUC) break;
            continue;
          }
          const kod = normKod(k.kod);
          const ad = tr_lower(kayitAdi(k));
          if (kod.includes(sorgu) || ad.includes(sorgu)) {
            eslesenKodlar.push(kod);
            if (eslesenKodlar.length >= MAX_SONUC) break;
          }
        }

        if (!sorgu) {
          for (const k of veri.kayitlar) {
            if (eslesenKodlar.includes(normKod(k.kod))) {
              tumSonuclar.push({ kaynak: kaynakTip, kayit: k, eslesme: true });
            }
          }
        } else {
          tumSonuclar.push(...agacKur(kaynakTip, veri.kayitlar, eslesenKodlar));
        }
      }
      return tumSonuclar;
    }

    function filtreNotunuGuncelle() {
      const not = $('filtre-notu');
      const notlar = { gtip: t('filtre_notu_urun'), cpc: t('filtre_notu_hizmet'), nace: t('filtre_notu_nace'), isco: t('filtre_notu_isco'), hepsi: '' };
      const metin = notlar[AKTIF_FILTRE] || '';
      if (metin) { not.classList.remove('hidden'); not.innerHTML = `<span class="text-win-400">ℹ️</span> <span>${kacis(metin)}</span>`; }
      else { not.classList.add('hidden'); not.innerHTML = ''; }
    }

    function sonuclariCiz() {
      const alan = $('sonuc-alani');
      const sonuclar = TUM_SONUCLAR.slice(0, GORUNEN_LIMIT);

      if (!sonuclar.length) {
        alan.innerHTML = `

                </div>
                <div class="pl-2">
                  ${renderBelgeListesi(belgeler.yurtici)}
                </div>
              </div>

              ${!isNaceVeyaIsco ? `
              <div class="bg-win-card border border-win-border rounded-xl p-4 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                <div class="flex items-center justify-between mb-3 pl-2">
                  <h4 class="font-bold text-white text-xs">${dil() === 'en' ? 'Import' : 'İthalat'}</h4>
                  <span class="bg-amber-500/20 text-amber-300 text-[9px] px-1.5 py-0.5 rounded border border-amber-500/30">${dil() === 'en' ? 'Foreign' : 'Dış Alım'}</span>
                </div>
                <div class="pl-2">
                  ${renderBelgeListesi(belgeler.ithalat)}
                </div>
              </div>

              <div class="bg-win-card border border-win-border rounded-xl p-4 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                <div class="flex items-center justify-between mb-3 pl-2">
                  <h4 class="font-bold text-white text-xs">${t('islem_ihracat')}</h4>
                  <span class="bg-emerald-500/20 text-emerald-300 text-[9px] px-1.5 py-0.5 rounded border border-emerald-500/30">${dil() === 'en' ? 'Export' : 'Yurt Dışı'}</span>
                </div>
                <div class="pl-2">
                  ${renderBelgeListesi(belgeler.ihracat)}
                </div>
              </div>
              ` : ''}
            </div>
          </div>
        `;
      }

      return `
        <div class="bg-win-card border border-win-border rounded-xl shadow-2xl overflow-hidden modal-anim">
          <div class="p-5 border-b border-win-border bg-win-dark flex items-start justify-between gap-4 sticky top-0 z-10">
            <div class="min-w-0 flex items-center gap-3 flex-wrap">
              <span class="text-base">${KAYNAK_IKON[kaynak]}</span>
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-[11px] font-bold tracking-wider border ${KAYNAK_SINIF[kaynak]}">${t(kartTip.baslikKey)}</span>
              <code class="text-xs font-mono text-win-100 bg-win-500/10 px-2 py-0.5 rounded border border-win-500/20">${kacis(kod)}</code>
            </div>
            <button id="kapat-btn" type="button" title="${t('kapat')}" class="flex-none w-9 h-9 rounded-lg bg-win-dark hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition">✕</button>
          </div>
          ${temelHtml}
          ${vergiHtml}
          ${sgkHtml}
          ${randimanHtml}
          ${belgeHtml}
        </div>`;
    }
    function kaynakBazliAlanlar(secim) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const adTR = kayit.tanim_tr || kayit.ad_tr || '';
      const adEN = kayit.tanim_en || kayit.ad_en || '';
      const satirlar = [];

      // NACE verisini hazırla
      let naceKod = '', naceTR = '', naceEN = '';
      if (kayit.nace && kayit.nace.kod) {
        naceKod = kayit.nace.kod;

        // Noktaları kaldırarak eşleştir (01.11 ile 0111'i eşitler)
        const hedefKod = String(naceKod).replace(/\./g, '');
        const naceObj = VERI.nace.kayitlar.find(n => String(n.kod).replace(/\./g, '') === hedefKod);

        if (naceObj) {
          // Farklı veri setlerindeki olası alan adlarını kontrol et
          naceTR = naceObj.tanim_tr || naceObj.ad_tr || naceObj.ad || '';
          naceEN = naceObj.tanim_en || naceObj.ad_en || '';
        }
      }

      // --- GTİP KARTI ---
      if (kaynak === 'gtip') {
        satirlar.push({ alan: t('gtip_kod'), deger: kod, kurum: `${t('kurum_ticaret')} / ${t('kurum_tuik')}`, vurgu: 'kod' });
        satirlar.push({ alan: t('urun_ad_tr'), deger: adTR, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('urun_ad_en'), deger: adEN, kurum: t('kurum_ticaret') });

        if (naceKod) {
          satirlar.push({ alan: t('nace_kod'), deger: naceKod, kurum: t('kurum_tuik'), vurgu: 'kod' });
          satirlar.push({ alan: t('faaliyet_ad_tr'), deger: naceTR, kurum: t('kurum_tuik') });
          satirlar.push({ alan: t('faaliyet_ad_en'), deger: naceEN, kurum: t('kurum_tuik') });
        } else {
          satirlar.push({ alan: t('nace_kod'), deger: '—', kurum: t('kurum_tuik'), vurgu: 'bos' });
        }
      }


      // --- CPC KARTI ---
      if (kaynak === 'cpc') {
        const ilkHane = String(kod).charAt(0);
        const hizmetMi = (kaynak === 'cpc' && ['5', '6', '7', '8', '9'].includes(ilkHane));
        const isNaceVeyaIsco = (kaynak === 'nace' || kaynak === 'isco' || hizmetMi);
        const gridCols = isNaceVeyaIsco ? 'grid-cols-1' : 'grid-cols-1 md:grid-cols-3';

        satirlar.push({ alan: t('cpc_kod'), deger: kod, kurum: t('kurum_tuik'), vurgu: 'kod' });
        satirlar.push({ alan: t('hizmet_ad_tr'), deger: adTR, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('hizmet_ad_en'), deger: adEN, kurum: t('kurum_ticaret') });

        if (naceKod) {
          satirlar.push({ alan: t('nace_kod'), deger: naceKod, kurum: t('kurum_tuik'), vurgu: 'kod' });
          satirlar.push({ alan: t('faaliyet_ad_tr'), deger: naceTR, kurum: t('kurum_tuik') });
          satirlar.push({ alan: t('faaliyet_ad_en'), deger: naceEN, kurum: t('kurum_tuik') });
        } else {
          satirlar.push({ alan: t('nace_kod'), deger: '—', kurum: t('kurum_tuik'), vurgu: 'bos' });
        }
      }

      // --- NACE KARTI ---
      if (kaynak === 'nace') {
        satirlar.push({ alan: t('nace_kod'), deger: kod, kurum: t('kurum_tuik'), vurgu: 'kod' });
        satirlar.push({ alan: t('faaliyet_ad_tr'), deger: adTR, kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('faaliyet_ad_en'), deger: adEN, kurum: t('kurum_tuik') });
      }

      // --- ISCO KARTI ---
      if (kaynak === 'isco') {
        satirlar.push({ alan: t('isco_kod'), deger: kod, kurum: `${t('kurum_tuik')} / ${t('kurum_calisma')}`, vurgu: 'kod' });
        satirlar.push({ alan: t('meslek_ad_tr'), deger: adTR, kurum: t('kurum_calisma') });
        satirlar.push({ alan: t('meslek_ad_en'), deger: adEN, kurum: t('kurum_calisma') });
      }

      return satirlar;
    }


    function birlesikTabloCiz(satirlar) {
      const rowsHtml = satirlar.map(s => {
        if (s.tip === 'baslik') {
          return `<tr class="bg-win-dark/60 border-t border-win-border/40"><td colspan="3" class="px-4 py-2 text-[10px] font-bold uppercase tracking-wider text-win-400">${kacis(s.metin)}</td></tr>`;
        }
        const bosMu = !s.deger || s.deger === '' || s.deger === '—';
        if (s.vurgu === 'kod') {
          return `<tr class="bg-win-dark/20 hover:bg-win-hover/40 transition">
            <td class="px-4 py-3 align-top text-slate-400 text-xs font-semibold whitespace-nowrap">${kacis(s.alan)}</td>
            <td class="px-4 py-3 align-top font-mono text-base text-emerald-300 font-bold">${kacis(s.deger)}</td>
            <td class="px-4 py-3 align-top text-[11px] text-slate-500">${kacis(s.kurum || '')}</td>
          </tr>`;
        }
        const degerClass = s.vurgu === 'kdv' ? 'text-win-100 font-bold' : s.vurgu === 'otv' ? 'text-rose-400 font-bold' : s.vurgu === 'muaf' ? 'text-emerald-400 font-semibold' : 'text-slate-100';
        const degerGoster = bosMu ? '—' : s.deger;
        return `<tr class="hover:bg-win-hover/40 transition">
          <td class="px-4 py-2.5 align-top text-slate-300 text-xs font-medium">${kacis(s.alan)}</td>
          <td class="px-4 py-2.5 align-top font-mono text-xs ${bosMu ? 'text-slate-600 italic' : degerClass}">${kacis(degerGoster)}</td>
          <td class="px-4 py-2.5 align-top text-[11px] text-slate-500">${kacis(s.kurum || '')}</td>
        </tr>`;
      }).join('');

      return `
        <div class="overflow-x-auto border-b border-win-border">
          <table class="w-full text-left">
            <thead class="bg-win-hover border-b border-win-border text-slate-400 font-semibold uppercase tracking-wider text-[10px]">
              <tr>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('alan_adi')}</th>
                <th class="px-4 py-2.5">${t('deger')}</th>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('kurum')}</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-win-border/40">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    function toggleMobileSidebar() {
      const sidebar = $('sidebar'); const overlay = $('mobile-overlay');
      const acik = !sidebar.classList.contains('-translate-x-full');
      if (acik) { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
      else { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
    }
    function closeMobileSidebar() {
      $('sidebar').classList.add('-translate-x-full'); $('mobile-overlay').classList.add('hidden');
    }
    $('btn-mobile-menu')?.addEventListener('click', toggleMobileSidebar);
    $('mobile-overlay')?.addEventListener('click', closeMobileSidebar);

    document.addEventListener('pdaas:dil', () => {
      renderFilterList();
      if (SECILI) detayGoster(SECILI);
      aramayiBaslat();
    });

    $('detay-overlay').addEventListener('click', detayKapat);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') detayKapat(); });

    let aramaZaman;
    $('arama').addEventListener('input', () => {
      clearTimeout(aramaZaman);
      aramaZaman = setTimeout(() => { aramayiBaslat(); detayKapat(); }, 250);
    });

    $('sonuc-alani').addEventListener('click', e => {
      const el = e.target.closest('.kart-tikla');
      if (!el) return;
      const idx = Number(el.dataset.idx);
      if (TUM_SONUCLAR[idx]) detayGoster(TUM_SONUCLAR[idx]);
    });

    const mainEl = $('main-content');
    const scrollTopBtn = $('btn-scroll-top');
    mainEl.addEventListener('scroll', () => {
      if (!$('detay-modal').classList.contains('hidden')) return;
      if (mainEl.scrollTop > 300) scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      else scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      if ((mainEl.clientHeight + mainEl.scrollTop) >= mainEl.scrollHeight - 500) {
        if (GORUNEN_LIMIT < TUM_SONUCLAR.length) { GORUNEN_LIMIT += 100; sonuclariCiz(); }
      }
    });
    scrollTopBtn.addEventListener('click', () => mainEl.scrollTo({ top: 0, behavior: 'smooth' }));

    renderFilterList();
    tumVeriYukle().then(() => {
      // Veriler yüklendikten sonra listeyi otomatik çiz
      aramayiBaslat();
    });
  </script>
</body>

</html>
