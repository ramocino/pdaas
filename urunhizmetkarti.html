    function kelimelereAyir(metin) {
      return String(metin || '')
        .toLocaleLowerCase('tr-TR')
        .split(/[^\p{L}\p{N}]+/u)
        .map(w => w.trim())
        .filter(w => w.length >= 4 && !STOP_WORDS.has(w) && !/^\d+$/.test(w));
    }
    function kelimeSeti(metin) {
      const set = new Set();
      for (const w of kelimelereAyir(metin)) set.add(w);
      return set;
    }

    // VERİ YÜKLEME
    // ============================================================
    async function fetchGuvenli(yol) {
      try {
        const r = await apiFetch(yol);
        if (!r.ok) return null;
        return await r.json();
      } catch (e) { return null; }
    }

    async function kurumlariYukle() {
      const d = await fetchGuvenli(EK_KAYNAK.kurumlar);
      if (!d) { EK_VERI.kurumlar = {}; return; }
      const duz = {};
      const k = d.kurumlar || d;
      if (Array.isArray(k)) {
        for (const item of k) if (item?.kod) duz[item.kod] = item;
      } else {
        for (const v of Object.values(k)) {
          if (v && typeof v === 'object' && !v.ad_tr && !v.ad) Object.assign(duz, v);
          else if (v && typeof v === 'object' && v.ad_tr) {
            const kod = Object.keys(k).find(x => k[x] === v);
            if (kod) duz[kod] = v;
          }
        }
      }
      EK_VERI.kurumlar = duz;
    }

    async function ekVeriYukle(kaynak) {
      if (!EK_VERI[kaynak]) return;
      const harita = {
        gtip: { belge: EK_KAYNAK.gtipBelge, randiman: EK_KAYNAK.gtipRandiman },
        cpc: { belge: EK_KAYNAK.cpcBelge, randiman: EK_KAYNAK.cpcRandiman },
        nace: { belge: EK_KAYNAK.naceBelge, randiman: null },
        isco: { belge: EK_KAYNAK.iscoBelge, randiman: null },
      };
      const y = harita[kaynak];
      if (!y) return;
      const gorevler = [];
      if (y.belge && !EK_VERI[kaynak].belge) gorevler.push(fetchGuvenli(y.belge).then(d => { if (d) EK_VERI[kaynak].belge = d; }));
      if (y.randiman && !EK_VERI[kaynak].randiman) gorevler.push(fetchGuvenli(y.randiman).then(d => { if (d) EK_VERI[kaynak].randiman = d; }));
      await Promise.all(gorevler);
    }

    // ============================================================
    // YARDIMCILAR
    // ============================================================
    function kayitAdiKisa(k) {
      const ad = kayitAdi(k);
      return ad.length > 120 ? ad.slice(0, 120) + '…' : ad;
    }

    function kurumAdi(kurum_kod) {
      if (!kurum_kod) return '—';
      if (EK_VERI.kurumlar && EK_VERI.kurumlar[kurum_kod]) {
        const k = EK_VERI.kurumlar[kurum_kod];
        return dil() === 'en' ? (k.ad_en || k.ad_tr) : (k.ad_tr || k.ad_en);
      }
      return kurum_kod;
    }

    function belgeleriBul(kaynak, kod) {
      const dosya = EK_VERI[kaynak]?.belge;
      if (!dosya?.kurallar?.length) return [];
      const prefixKey = kaynak + '_prefix';
      const kk = kodTemiz(kod);
      const eslesenler = [];
      for (const kural of dosya.kurallar) {
        for (const prefix of (kural[prefixKey] || [])) {
          const p = kodTemiz(prefix);
          if (p && kk.startsWith(p)) eslesenler.push({ kural, prefixUzunlugu: p.length });
        }
      }
      eslesenler.sort((a, b) => b.prefixUzunlugu - a.prefixUzunlugu);
      const gorulen = new Set();
      const belgeler = [];
      for (const es of eslesenler) {
        for (const belge of (es.kural.belgeler || [])) {
          if (gorulen.has(belge.kod)) continue;
          gorulen.add(belge.kod);
          belgeler.push(belge);
        }
      }
      const siralama = { zorunlu: 0, kosullu: 1, opsiyonel: 2 };
      belgeler.sort((a, b) => (siralama[a.seviye] ?? 9) - (siralama[b.seviye] ?? 9));
      return belgeler;
    }

    function randimanBul(kaynak, kod) {
      const dosya = EK_VERI[kaynak]?.randiman;
      if (!dosya?.kurallar?.length) return [];
      const prefixKey = kaynak + '_prefix';
      const kk = kodTemiz(kod);
      const eslesenler = [];
      for (const kural of dosya.kurallar) {
        for (const prefix of (kural[prefixKey] || [])) {
          const p = kodTemiz(prefix);
          if (p && kk.startsWith(p)) eslesenler.push({ kural, prefixUzunlugu: p.length });
        }
      }
      eslesenler.sort((a, b) => b.prefixUzunlugu - a.prefixUzunlugu);
      const sonuclar = [];
      const gorulen = new Set();
      for (const es of eslesenler) {
        const altOgeler = es.kural.randiman_kurallari || es.kural.verimlilik_gostergeleri || [];
        for (const alt of altOgeler) {
          let uyar = false;
          if (kaynak === 'gtip') {
            const girisKod = alt.gtip_girdi ? kodTemiz(alt.gtip_girdi) : '';
            const cikisKod = alt.gtip_cikti ? kodTemiz(alt.gtip_cikti) : '';
            if (girisKod && (kk.startsWith(girisKod) || girisKod.startsWith(kk))) uyar = true;
            if (!uyar && cikisKod && (kk.startsWith(cikisKod) || cikisKod.startsWith(kk))) uyar = true;
          } else if (kaynak === 'cpc') {
            const altPrefix = alt.cpc_prefix ? kodTemiz(alt.cpc_prefix) : '';
            if (!altPrefix || kk.startsWith(altPrefix)) uyar = true;
          } else uyar = true;
          if (!uyar) continue;
          const anahtar = alt.kod || alt.gosterge || JSON.stringify(alt);
          if (gorulen.has(anahtar)) continue;
          gorulen.add(anahtar);
          sonuclar.push(alt);
        }
      }
      return sonuclar;
    }

    function iliskiliKodlarBul(secilenKaynak, secilenKayit) {
      const kelimeler = kelimelereAyir(kayitAdi(secilenKayit));
      if (!kelimeler.length) return [];
      const kaynaklar = ['gtip', 'cpc', 'nace', 'isco'].filter(k => k !== secilenKaynak);
      const sonuc = [];
      for (const k of kaynaklar) {
        const eslesenler = [];
        for (const r of VERI[k].kayitlar) {
          const hedefSet = kelimeSeti(kayitAdi(r));
          const ortak = kelimeler.filter(w => hedefSet.has(w));
          const anlamli = ortak.filter(w => w.length >= 5);
          if (ortak.length >= 2 || anlamli.length >= 1) {
            eslesenler.push(r);
            if (eslesenler.length >= 3) break;
          }
        }
        if (eslesenler.length) sonuc.push({ kaynak: k, kayitlar: eslesenler });
      }
      return sonuc;
    }

    // ============================================================
    // ARAMA + LİSTE
    // ============================================================
    function gtipZinciri(kod) {
      const tk = kodTemiz(kod);
      if (!/^\d+$/.test(tk)) return [normKod(kod)];
      const dilimler = [2, 4, 6, 8, 10, 12];
      const zincir = [];
      for (const d of dilimler) { if (tk.length >= d) zincir.push(tk.slice(0, d)); }
      return zincir;
    }

    function ataZinciri(kayit, kodMap, kaynakTip) {
      const kod = normKod(kayit.kod);
      if (kaynakTip === 'gtip') {
        const g = gtipZinciri(kod);
        const kayitlar = [];
        for (const x of g) { const k = kodMap.get(x); if (k) kayitlar.push(k); }
        const son = kayitlar[kayitlar.length - 1];
        if (!son || normKod(son.kod) !== kod) kayitlar.push(kayit);
        return kayitlar;
      }
      const zincir = [];
      const gorulen = new Set();
      let m = kayit;
      while (m) {
        const mk = normKod(m.kod);
        if (gorulen.has(mk)) break;
        gorulen.add(mk);
        zincir.unshift(m);
        m = m.ust_kod ? kodMap.get(normKod(m.ust_kod)) : null;
      }
      return zincir;
    }

    function agacKur(kaynakTip, tumKayitlar, eslesenKodlar) {
      const kodMap = new Map(tumKayitlar.map(k => [normKod(k.kod), k]));
      const dahil = new Map();
      for (const kod of eslesenKodlar) {
        const k = kodMap.get(kod);
        if (!k) continue;
        const zincir = ataZinciri(k, kodMap, kaynakTip);
        zincir.forEach((z, i) => {
          const zk = normKod(z.kod);
          const sonuncu = (i === zincir.length - 1);
          const mevcut = dahil.get(zk);
          if (!mevcut) dahil.set(zk, { kayit: z, eslesme: sonuncu });
          else if (sonuncu) mevcut.eslesme = true;
        });
      }
      return [...dahil.values()].map(x => ({ kaynak: kaynakTip, kayit: x.kayit, eslesme: x.eslesme }));
    }

    function kaynaklariTara(q, filtre) {
      const sorgu = tr_lower(q || '').trim();
      const tekKaynak = filtre !== 'hepsi';

      const kaynaklar = [];
      if (filtre === 'hepsi' || filtre === 'gtip') kaynaklar.push(['gtip', VERI.gtip]);
      if (filtre === 'hepsi' || filtre === 'isco') kaynaklar.push(['isco', VERI.isco]);
      if (filtre === 'hepsi' || filtre === 'cpc') kaynaklar.push(['cpc', VERI.cpc]);
      if (filtre === 'hepsi' || filtre === 'nace') kaynaklar.push(['nace', VERI.nace]);

      const tumSonuclar = [];
      const MAX_SONUC = 1000; // Tarayıcıyı dondurmamak için sınır

      for (const [kaynakTip, veri] of kaynaklar) {
        const eslesenKodlar = [];
        for (const k of veri.kayitlar) {
          if (!sorgu) {
            eslesenKodlar.push(normKod(k.kod));
            if (eslesenKodlar.length >= MAX_SONUC) break;
            continue;
          }
          const kod = normKod(k.kod);
          const ad = tr_lower(kayitAdi(k));
          if (kod.includes(sorgu) || ad.includes(sorgu)) {
            eslesenKodlar.push(kod);
            if (eslesenKodlar.length >= MAX_SONUC) break;
          }
        }

        if (!sorgu) {
          // Arama yoksa ağaç kurmadan direkt listele
          for (const k of veri.kayitlar) {
            if (eslesenKodlar.includes(normKod(k.kod))) {
              tumSonuclar.push({ kaynak: kaynakTip, kayit: k, eslesme: true });
            }
          }
        } else {
          // Arama varsa ağaç yapısını kur
          tumSonuclar.push(...agacKur(kaynakTip, veri.kayitlar, eslesenKodlar));
        }
      }
      return tumSonuclar;
    }

    function kartUret(secim, iliskili) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const kartTip = KART_TIPI[kaynak];
      const satirlar = [];
      satirlar.push(...kaynakBazliAlanlar(secim, iliskili));

      // VERGİ
      if (kartTip.kdvVar || kartTip.otvVar) {
        satirlar.push({ tip: 'baslik', metin: t('vergi') });

        if (kartTip.kdvVar) {
          // DOĞRUDAN gtit-tam İÇİNDEKİ kdv OBJESİNİ OKUYORUZ
          let kdvSonuc = kayit.kdv;

          // Eğer gtit-tam değil de eski bir dosya gelirse (yedek mekanizma)
          if (!kdvSonuc) {
            const oran = kayit.kdv_kodu ? oranBul(kayit.kdv_kodu) : 0.20;
            kdvSonuc = { oran: oran, aciklama: 'Genel Oran', grup: null };
          }

          const kdvOran = kdvSonuc.oran != null ? kdvSonuc.oran : 0.20;
          const kdvAciklamaMetin = kdvSonuc.grup ? `Grup: ${kdvSonuc.grup}` : 'Genel Oran';

          satirlar.push({
            alan: t('kdv_orani'),
            deger: `%${(kdvOran * 100).toFixed(0)}`,
            kurum: `${t('kurum_gib')} — ${kdvAciklamaMetin}`,
            vurgu: 'kdv'
          });
        }

        if (kartTip.otvVar) {
          const otv = kayit.otv;

          if (otv && otv.grup && otv.grup !== 'otv_yok') {
            let otvDeger = 'Uygulanır';
            let otvAciklama = '';

            let oranMetin = '';
            let maktuMetin = '';

            // 1. NİSPİ ORAN KONTROLÜ (Doğrudan derle.py'den gelen kalem verisi)
            if (otv.oran != null && otv.oran > 0) {
              oranMetin = `%${(otv.oran * 100).toFixed(0)}`;
            }
            // Eğer oran yoksa Matrah Dilimlerine bak (Otomobil, Telefon vb.)
            else if (otv.matrah_dilimleri && otv.matrah_dilimleri.length > 0) {
              const oranlar = otv.matrah_dilimleri.map(m => m.oran || 0).filter(o => o > 0);
              if (oranlar.length > 0) {
                const minOran = Math.min(...oranlar);
                const maxOran = Math.max(...oranlar);
                if (minOran === maxOran) {
                  oranMetin = `%${(minOran * 100).toFixed(1).replace('.0', '')}`;
                } else {
                  oranMetin = `%${(minOran * 100).toFixed(0)} - %${(maxOran * 100).toFixed(0)}`;
                  otvAciklama += ` · Matraha göre değişkenlik gösterir`;
                }
              }
            }

            // 2. MAKTU VE ASGARİ MAKTU TUTARLARI KONTROLÜ
            if (otv.asgari_maktu != null) {
              maktuMetin += `Asgari Maktu: ${otv.asgari_maktu} TL`;
            }
            if (otv.maktu != null) {
              if (maktuMetin) maktuMetin += ', ';
              maktuMetin += `Maktu: ${otv.maktu} TL`;
            }

            // Eğer üst düzeyde maktu yoksa matrah dilimlerinin içine bak (yedek kontrol)
            if (!maktuMetin && otv.matrah_dilimleri && otv.matrah_dilimleri.length > 0 && otv.matrah_dilimleri[0].asgari_maktu != null) {
              maktuMetin = `Asgari Maktu: ${otv.matrah_dilimleri[0].asgari_maktu} TL`;
            }

            // Değerleri Birleştir
            if (oranMetin) otvDeger = oranMetin;
            else if (otv.vergi_tipi === 'maktu') otvDeger = 'Maktu';

            if (maktuMetin) {
              otvAciklama = ` · ${maktuMetin}${otvAciklama}`;
            }

            if (otv.ornekler_tr && otv.ornekler_tr.length > 0) {
              otvAciklama += ` · Örn: ${otv.ornekler_tr.slice(0, 2).join(', ')}`;
            }

            const listeAdi = otv.liste ? `${otv.liste} Sayılı Liste` : 'ÖTV Listesi';

            satirlar.push({
              alan: t('otv_orani'),
              deger: otvDeger,
              kurum: `${t('kurum_gib')} — ${listeAdi}${otvAciklama}`,
              vurgu: 'otv'
            });
          } else {
            satirlar.push({
              alan: t('otv_orani'),
              deger: t('otv_muaf'),
              kurum: `${t('kurum_gib')} — ${t('otv_yok')}`,
              vurgu: 'muaf'
            });
          }
        }
        // TEVKİFAT BİLGİSİ
        if (kartTip.kdvVar && kayit.tevkifat && kayit.tevkifat.grup && kayit.tevkifat.grup !== 'tevkifat_yok') {
          const tevk = kayit.tevkifat;
          satirlar.push({
            alan: "KDV Tevkifatı",
            deger: tevk.oran_kesir ? `%${(tevk.oran * 100).toFixed(0)} (${tevk.oran_kesir})` : `%${(tevk.oran * 100).toFixed(0)}`,
            kurum: `${t('kurum_gib')} — ${tevk.ad_tr || tevk.grup}`,
            vurgu: 'kdv' // Mavi renkte görünmesi için
          });
        }
      }

      // RANDIMAN
      if (kartTip.randimanVar) {
        const kurallar = randimanBul(kaynak, kod);
        if (kurallar.length) {
          satirlar.push({ tip: 'baslik', metin: (kaynak === 'gtip' ? t('randiman_baslik') : t('verimlilik_baslik')) + ` (${kurallar.length})` });
          for (const r of kurallar) {
            const kurumAd = r.kaynak_kod ? kurumAdi(r.kaynak_kod) : '';
            if (kaynak === 'gtip') {
              if (r.randiman_orani != null) satirlar.push({ alan: `${r.urun || r.urun_grubu || ''} — ${t('randiman_oran')}`, deger: `%${(r.randiman_orani * 100).toFixed(1)}`, kurum: kurumAd, vurgu: r.randiman_orani >= 0.75 ? 'muaf' : '' });
              if (r.fire_orani != null) satirlar.push({ alan: `${r.urun || r.urun_grubu || ''} — ${t('fire_oran')}`, deger: `%${(r.fire_orani * 100).toFixed(1)}`, kurum: kurumAd, vurgu: r.fire_orani > 0.30 ? 'otv' : '' });
            } else {
              const hedef = r.hedef_deger != null ? (r.hedef_deger < 10 ? `%${(r.hedef_deger * 100).toFixed(0)}` : String(r.hedef_deger)) : '—';
              satirlar.push({ alan: `${r.gosterge || ''} — ${t('hedef_deger')}`, deger: hedef, kurum: `${kurumAd}${r.birim ? ' · ' + r.birim : ''}` });
            }
          }
        }
      }

      // BELGELER
      if (kartTip.belgeVar) {
        const belgeler = belgeleriBul(kaynak, kod);
        satirlar.push({ tip: 'baslik', metin: belgeler.length ? `${t('belge_baslik')} (${belgeler.length})` : t('belge_baslik') });
        if (!belgeler.length) {
          satirlar.push({ alan: '—', deger: t('belge_yok'), kurum: '' });
        } else {
          for (const b of belgeler) {
            const seviyeEtiket = b.seviye === 'zorunlu' ? t('belge_zorunlu') : b.seviye === 'kosullu' ? t('belge_kosullu') : t('belge_opsiyonel');
            const adMetin = dil() === 'en' ? (b.ad_en || b.ad_tr) : b.ad_tr;
            const kurumAd = kurumAdi(b.kurum_kod) || b.kurum || '—';
            const aciklama = dil() === 'en' ? (b.kosul_en || b.kosul_tr) : b.kosul_tr;
            satirlar.push({ alan: `${adMetin} [${seviyeEtiket}]`, deger: aciklama || '—', kurum: kurumAd, vurgu: b.seviye === 'zorunlu' ? 'otv' : (b.seviye === 'kosullu' ? '' : 'muaf') });
          }
        }
      }

      const tabloHtml = birlesikTabloCiz(satirlar);
      const iliskiliHtml = iliskiliBlogu(iliskili);

      return `
        <div class="bg-win-card border border-win-border rounded-xl shadow-2xl overflow-hidden modal-anim">
          <div class="p-5 border-b border-win-border bg-win-dark flex items-start justify-between gap-4 sticky top-0 z-10">
            <div class="min-w-0 flex items-center gap-3 flex-wrap">
              <span class="text-base">${KAYNAK_IKON[kaynak]}</span>
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-[11px] font-bold tracking-wider border ${KAYNAK_SINIF[kaynak]}">${t(kartTip.baslikKey)}</span>
              <code class="text-xs font-mono text-win-100 bg-win-500/10 px-2 py-0.5 rounded border border-win-500/20">${kacis(kod)}</code>
            </div>
            <button id="kapat-btn" type="button" title="${t('kapat')}" class="flex-none w-9 h-9 rounded-lg bg-win-dark hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition">✕</button>
          </div>
          ${tabloHtml}
          ${iliskiliHtml}
          <div class="px-5 py-3 bg-win-dark border-t border-win-border flex items-center justify-between text-xs text-slate-400">
            <span>${t('gerekce_baslik')}</span>
            <span class="font-mono text-emerald-400">${t('guven')}: %95</span>
          </div>
        </div>`;
    }

    function kaynakBazliAlanlar(secim, iliskili) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const adTR = kayit.tanim_tr || kayit.ad_tr || kayit.tanim || '';
      const adEN = kayit.tanim_en || kayit.ad_en || kayit.tanim || '';
      const satirlar = [];

            // YENİ KOD
      const naceVerisi = kayit.nace;
      const naceKod = naceVerisi ? naceVerisi.kod : '';
      
      // Arayüzde NACE adını göstermek için VERI.nace içinden bulalım
      let naceTR = '';
      let naceEN = '';
      if (naceKod) {
          const naceObj = VERI.nace.kayitlar.find(n => normKod(n.kod) === normKod(naceKod));
          if (naceObj) {
              naceTR = naceObj.tanim_tr || naceObj.ad_tr;
              naceEN = naceObj.tanim_en || naceObj.ad_en;
          }
      }

      if (kaynak === 'gtip') {
        satirlar.push({ alan: t('gtip_kod'), deger: kod, kurum: `${t('kurum_ticaret')} / ${t('kurum_tuik')}`, vurgu: 'kod' });
        satirlar.push({ alan: t('urun_ad_tr'), deger: adTR, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('urun_ad_en'), deger: adEN, kurum: t('kurum_ticaret') });
        if (naceKod) {
          satirlar.push({ alan: t('nace_kod'), deger: naceKod, kurum: t('kurum_tuik'), vurgu: 'kod' });
          satirlar.push({ alan: t('faaliyet_ad_tr'), deger: naceTR, kurum: t('kurum_tuik') });
          satirlar.push({ alan: t('faaliyet_ad_en'), deger: naceEN, kurum: t('kurum_tuik') });
        }
        if (kayit.olcu_birimi) satirlar.push({ alan: t('olcu_birimi'), deger: kayit.olcu_birimi, kurum: t('kurum_ticaret') });
        if (kayit.standart_kodu || kayit.zorunlu_standart) satirlar.push({ alan: t('zorunlu_standart'), deger: kayit.standart_kodu || kayit.zorunlu_standart, kurum: t('kurum_tse') });
      }
      if (kaynak === 'cpc') {
        satirlar.push({ alan: t('cpc_kod'), deger: kod, kurum: t('kurum_tuik'), vurgu: 'kod' });
        satirlar.push({ alan: t('hizmet_ad_tr'), deger: adTR, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('hizmet_ad_en'), deger: adEN, kurum: t('kurum_ticaret') });
        if (naceKod) {
          satirlar.push({ alan: t('nace_kod'), deger: naceKod, kurum: t('kurum_tuik'), vurgu: 'kod' });
          satirlar.push({ alan: t('faaliyet_ad_tr'), deger: naceTR, kurum: t('kurum_tuik') });
          satirlar.push({ alan: t('faaliyet_ad_en'), deger: naceEN, kurum: t('kurum_tuik') });
        }
        if (kayit.olcu_birimi) satirlar.push({ alan: t('olcu_birimi'), deger: kayit.olcu_birimi, kurum: t('kurum_tuik') });
        if (kayit.tolerans || kayit.sapma_limiti) satirlar.push({ alan: t('tolerans'), deger: kayit.tolerans || kayit.sapma_limiti, kurum: t('kurum_tobb') });
        if (kayit.tehlike_sinifi) satirlar.push({ alan: t('tehlike_sinifi'), deger: kayit.tehlike_sinifi, kurum: t('kurum_calisma') });
        if (kayit.zorunlu_sigorta) satirlar.push({ alan: t('zorunlu_sigorta'), deger: kayit.zorunlu_sigorta, kurum: t('kurum_seddk') });
      }
      if (kaynak === 'nace') {
        satirlar.push({ alan: t('nace_kod'), deger: kod, kurum: t('kurum_tuik'), vurgu: 'kod' });
        satirlar.push({ alan: t('faaliyet_ad_tr'), deger: adTR, kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('faaliyet_ad_en'), deger: adEN, kurum: t('kurum_tuik') });
        if (kayit.seviye) satirlar.push({ alan: t('seviye'), deger: kayit.seviye, kurum: t('kurum_tuik') });
        if (kayit.seviye_adi) satirlar.push({ alan: t('seviye_adi'), deger: kayit.seviye_adi, kurum: t('kurum_tuik') });
        if (kayit.ust_kod) satirlar.push({ alan: t('ust_kod'), deger: kayit.ust_kod, kurum: t('kurum_tuik') });
        if (kayit.tehlike_sinifi) satirlar.push({ alan: t('tehlike_sinifi'), deger: kayit.tehlike_sinifi, kurum: `${t('kurum_calisma')} / ${t('kurum_isg')}` });
      }
      if (kaynak === 'isco') {
        satirlar.push({ alan: t('isco_kod'), deger: kod, kurum: `${t('kurum_tuik')} / ${t('kurum_calisma')}`, vurgu: 'kod' });
        satirlar.push({ alan: t('meslek_ad_tr'), deger: adTR, kurum: t('kurum_calisma') });
        satirlar.push({ alan: t('meslek_ad_en'), deger: adEN, kurum: t('kurum_calisma') });
        if (kayit.seviye) satirlar.push({ alan: t('seviye'), deger: kayit.seviye, kurum: t('kurum_tuik') });
        if (kayit.seviye_adi) satirlar.push({ alan: t('seviye_adi'), deger: kayit.seviye_adi, kurum: t('kurum_tuik') });
        if (kayit.ust_kod) satirlar.push({ alan: t('ust_kod'), deger: kayit.ust_kod, kurum: t('kurum_tuik') });
        if (kayit.gorev_tanimi) satirlar.push({ alan: t('gorev_tanimi'), deger: kayit.gorev_tanimi, kurum: t('kurum_calisma') });
        if (kayit.beceri_seviyesi) satirlar.push({ alan: t('beceri_seviyesi'), deger: kayit.beceri_seviyesi, kurum: t('kurum_tuik') });
      }
      return satirlar;
    }

    function birlesikTabloCiz(satirlar) {
      const rowsHtml = satirlar.map(s => {
        if (s.tip === 'baslik') {
          return `<tr class="bg-win-dark/60 border-t border-win-border/40">
            <td colspan="3" class="px-4 py-2 text-[10px] font-bold uppercase tracking-wider text-win-400">${kacis(s.metin)}</td>
          </tr>`;
        }
        const bosMu = !s.deger || s.deger === '' || s.deger === '—';
        if (s.vurgu === 'kod') {
          return `<tr class="bg-win-dark/20 hover:bg-win-hover/40 transition">
            <td class="px-4 py-3 align-top text-slate-400 text-xs font-semibold whitespace-nowrap">${kacis(s.alan)}</td>
            <td class="px-4 py-3 align-top font-mono text-base text-emerald-300 font-bold">${kacis(s.deger)}</td>
            <td class="px-4 py-3 align-top text-[11px] text-slate-500">${kacis(s.kurum || '')}</td>
          </tr>`;
        }
        const degerClass = s.vurgu === 'kdv' ? 'text-win-100 font-bold'
          : s.vurgu === 'otv' ? 'text-rose-400 font-bold'
            : s.vurgu === 'muaf' ? 'text-emerald-400 font-semibold'
              : 'text-slate-100';
        const degerGoster = bosMu ? '—' : s.deger;
        return `<tr class="hover:bg-win-hover/40 transition">
          <td class="px-4 py-2.5 align-top text-slate-300 text-xs font-medium">${kacis(s.alan)}</td>
          <td class="px-4 py-2.5 align-top font-mono text-xs ${bosMu ? 'text-slate-600 italic' : degerClass}">${kacis(degerGoster)}</td>
          <td class="px-4 py-2.5 align-top text-[11px] text-slate-500">${kacis(s.kurum || '')}</td>
        </tr>`;
      }).join('');

      return `
        <div class="overflow-x-auto border-b border-win-border">
          <table class="w-full text-left">
            <thead class="bg-win-hover border-b border-win-border text-slate-400 font-semibold uppercase tracking-wider text-[10px]">
              <tr>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('alan_adi')}</th>
                <th class="px-4 py-2.5">${t('deger')}</th>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('kurum')}</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-win-border/40">${rowsHtml}</tbody>
          </table>
        </div>`;
    }

    function iliskiliBlogu(iliskili) {
      if (!iliskili.length) {
        return `
          <div class="p-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center gap-2">
              🔗 ${t('iliskili')}
            </div>
            <div class="text-xs text-slate-500 py-3 text-center">${t('iliskili_yok')}</div>
          </div>`;
      }
      return `
        <div class="p-4">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
            🔗 ${t('iliskili')}
          </div>
          ${iliskili.map(grup => {
        const kartTip = KART_TIPI[grup.kaynak];
        return `
              <div class="mb-3 last:mb-0">
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                  <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider border ${KAYNAK_SINIF[grup.kaynak]}">
                    ${KAYNAK_IKON[grup.kaynak]} ${KAYNAK_ETIKET[grup.kaynak]}
                  </span>
                  <span class="text-[10px] text-slate-500 italic">${t(kartTip.baslikKey)}</span>
                  <span class="text-[10px] text-slate-600">· ${grup.kayitlar.length}</span>
                </div>
                <div class="space-y-1">
                  ${grup.kayitlar.map(r => {
          const rKod = normKod(r.kod);
          const rAd = kayitAdiKisa(r);
          return `
                      <div class="flex items-center gap-2 bg-win-base border border-win-border rounded px-3 py-2 hover:bg-win-hover hover:border-win-500/40 transition cursor-pointer iliskili-tikla" title="${t('iliskili_tikla')}" data-kaynak="${grup.kaynak}" data-kod="${kacis(rKod)}">
                        <code class="text-[11px] font-mono text-win-100 whitespace-nowrap">${kacis(rKod)}</code>
                        <span class="text-xs text-slate-300 truncate flex-1">${kacis(rAd)}</span>
                        <span class="text-[10px] text-win-400">→</span>
                      </div>`;
        }).join('')}
                </div>
              </div>`;
      }).join('')}
        </div>`;
    }

    // ============================================================
    // MOBİL SIDEBAR
    // ============================================================
    function toggleMobileSidebar() {
      const sidebar = $('sidebar'); const overlay = $('mobile-overlay');
      const acik = !sidebar.classList.contains('-translate-x-full');
      if (acik) { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
      else { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
    }
    function closeMobileSidebar() {
      $('sidebar').classList.add('-translate-x-full'); $('mobile-overlay').classList.add('hidden');
    }
    $('btn-mobile-menu')?.addEventListener('click', toggleMobileSidebar);
    $('mobile-overlay')?.addEventListener('click', closeMobileSidebar);

    // ============================================================
    // OLAYLAR
    // ============================================================
    document.addEventListener('pdaas:dil', () => {
      renderFilterList();
      if (SECILI) detayGoster(SECILI);
      aramayiBaslat();
    });

    $('detay-overlay').addEventListener('click', detayKapat);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') detayKapat(); });

    let aramaZaman;
    $('arama').addEventListener('input', () => {
      clearTimeout(aramaZaman);
      aramaZaman = setTimeout(() => { aramayiBaslat(); detayKapat(); }, 250);
    });

    $('sonuc-alani').addEventListener('click', e => {
      const el = e.target.closest('.kart-tikla');
      if (!el) return;
      const idx = Number(el.dataset.idx);
      if (TUM_SONUCLAR[idx]) detayGoster(TUM_SONUCLAR[idx]);
    });

    // Sonsuz kaydırma - main-content içinde
    const mainEl = $('main-content');
    const scrollTopBtn = $('btn-scroll-top');
    mainEl.addEventListener('scroll', () => {
      if (!$('detay-modal').classList.contains('hidden')) return;
      if (mainEl.scrollTop > 300) scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      else scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      if ((mainEl.clientHeight + mainEl.scrollTop) >= mainEl.scrollHeight - 500) {
        if (GORUNEN_LIMIT < TUM_SONUCLAR.length) { GORUNEN_LIMIT += 100; sonuclariCiz(); }
      }
    });
    scrollTopBtn.addEventListener('click', () => mainEl.scrollTo({ top: 0, behavior: 'smooth' }));

    // ============================================================
    // BAŞLAT
    // ============================================================
    renderFilterList();
    tumVeriYukle();
  </script>
</body>

</html>
