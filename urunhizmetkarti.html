  <style>
    #dropdown::-webkit-scrollbar {
      width: 6px;
    }

    #dropdown::-webkit-scrollbar-thumb {
      background: rgba(76, 194, 255, .22);
      border-radius: 99px;
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .drop-anim {
      animation: dropIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes tabloIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tablo-anim {
      animation: tabloIn 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

    };

    // ============================================================
    // VERİ YÜKLEME
    // ============================================================
    async function fetchGuvenli(yol) {
      try {
        const r = await apiFetch(yol);
        if (!r.ok) return null;
        return await r.json();
      } catch (e) { return null; }
    }

    async function kurumlariYukle() {
      const d = await fetchGuvenli(EK_KAYNAK.kurumlar);
      if (!d) { EK_VERI.kurumlar = {}; return; }

      const duz = {};
      const k = d.kurumlar || d;
      if (Array.isArray(k)) {
        for (const item of k) if (item?.kod) duz[item.kod] = item;
      } else {
        for (const v of Object.values(k)) {
          if (v && typeof v === 'object' && !v.ad_tr && !v.ad) {
            Object.assign(duz, v);
          } else if (v && typeof v === 'object' && v.ad_tr) {
            const kod = Object.keys(k).find(x => k[x] === v);
            if (kod) duz[kod] = v;
          }
        }
      }
      EK_VERI.kurumlar = duz;
    }

    async function ekVeriYukle(kaynak) {
      if (!EK_VERI[kaynak]) return;
      const harita = {
        gtip: { belge: EK_KAYNAK.gtipBelge, randiman: EK_KAYNAK.gtipRandiman },
        cpc: { belge: EK_KAYNAK.cpcBelge, randiman: EK_KAYNAK.cpcRandiman },
        nace: { belge: EK_KAYNAK.naceBelge, randiman: null },
        isco: { belge: EK_KAYNAK.iscoBelge, randiman: null },
      };
      const y = harita[kaynak];
      if (!y) return;

      const gorevler = [];
      if (y.belge && !EK_VERI[kaynak].belge) {
        gorevler.push(fetchGuvenli(y.belge).then(d => { if (d) EK_VERI[kaynak].belge = d; }));
      }
      if (y.randiman && !EK_VERI[kaynak].randiman) {
        gorevler.push(fetchGuvenli(y.randiman).then(d => { if (d) EK_VERI[kaynak].randiman = d; }));
      }
      await Promise.all(gorevler);
    }

    async function tumVeriyiYukle() {
      const durum = $('durum-alani');
      durum.classList.remove('hidden');
      durum.innerHTML = `
        <div class="bg-win-card border border-win-border rounded-lg p-3 flex items-center gap-3 text-win-100 text-xs">
          <div class="inline-block w-4 h-4 border-2 border-win-500 border-t-transparent rounded-full animate-spin"></div>
          <span>${t('yukleniyor')}</span>
        </div>`;

      try {
        const [gtipR, cpcR, naceR, iscoR, kdvR, otvR, tevkifatR] = await Promise.all([
          fetchGuvenli(VERI.gtip.kaynak),
          fetchGuvenli(VERI.cpc.kaynak),
          fetchGuvenli(VERI.nace.kaynak),
          fetchGuvenli(VERI.isco.kaynak),
          fetchGuvenli(EK_KAYNAK.kdv),
          fetchGuvenli(EK_KAYNAK.otv),
          fetchGuvenli(EK_KAYNAK.tevkifat),
        ]);

        if (gtipR) { VERI.gtip.kayitlar = gtipR.kayitlar || []; VERI.gtip.yuklendi = true; }
        if (cpcR) { VERI.cpc.kayitlar = cpcR.kayitlar || []; VERI.cpc.yuklendi = true; }
        if (naceR) { VERI.nace.kayitlar = naceR.kayitlar || []; VERI.nace.yuklendi = true; }
        if (iscoR) { VERI.isco.kayitlar = iscoR.kayitlar || []; VERI.isco.yuklendi = true; }
        if (kdvR) KDV_DATA = kdvR;
        if (otvR) OTV_DATA = otvR;
        if (tevkifatR) TEVKIFAT_DATA = tevkifatR;

        kurumlariYukle();

        for (const k of ['gtip', 'cpc', 'nace', 'isco']) {
          const el = $('sayi-' + k);
          if (el) el.textContent = VERI[k].kayitlar.length.toLocaleString('tr-TR');
        }

        durum.innerHTML = `
          <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-3 flex items-center gap-3 text-emerald-400 text-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span>${t('yuklendi')}</span>
          </div>`;
        setTimeout(() => {
          durum.classList.add('hidden');
          durum.innerHTML = '';
        }, 2000);
      } catch (e) {
        durum.innerHTML = `
          <div class="bg-rose-500/10 border border-rose-500/20 rounded-lg p-3 text-rose-400 text-xs">
            ${t('yukleme_hatasi')}
          </div>`;
      }
    }

    // ============================================================
    // YARDIMCILAR
    // ============================================================
    function kayitAdiKisa(k) {
      const ad = kayitAdi(k);
      return ad.length > 120 ? ad.slice(0, 120) + '…' : ad;
    }

    function kurumAdi(kurum_kod) {
      if (!kurum_kod) return '—';
      if (EK_VERI.kurumlar && EK_VERI.kurumlar[kurum_kod]) {
        const k = EK_VERI.kurumlar[kurum_kod];
        return dil() === 'en' ? (k.ad_en || k.ad_tr) : (k.ad_tr || k.ad_en);
      }
      return kurum_kod;
    }

    function oranBul(kdvKodu) {
      if (!KDV_DATA?.kayitlar) return 0.20;
      const k = KDV_DATA.kayitlar.find(x => x.kod === kdvKodu);
      return k ? k.oran : 0.20;
    }

    function kdvBul(gtipKodu, cpcKodu) {
      if (!KDV_DATA?.listeler) return null;

      const gt = gtipKodu ? kodTemiz(gtipKodu) : '';
      const cp = cpcKodu ? kodTemiz(cpcKodu) : '';

      const listeler = ['I', 'II'];
      for (const lk of listeler) {
        const liste = KDV_DATA.listeler[lk];
        if (!liste?.kategoriler) continue;

        for (const kat of liste.kategoriler) {
          if (gt && kat.gtip_prefix) {
            for (const p of kat.gtip_prefix) {
              if (gt.startsWith(kodTemiz(p))) {
                return {
                  oran: liste.kdv_orani,
                  liste: lk,
                  kategori: kat.kod,
                  aciklama: dil() === 'en' ? (kat.ad_en || kat.ad_tr) : kat.ad_tr
                };
              }
            }
          }
          if (cp && kat.cpc_prefix) {
            for (const p of kat.cpc_prefix) {
              if (cp.startsWith(kodTemiz(p))) {
                return {
                  oran: liste.kdv_orani,
                  liste: lk,
                  kategori: kat.kod,
                  aciklama: dil() === 'en' ? (kat.ad_en || kat.ad_tr) : kat.ad_tr
                };
              }
            }
          }
        }
      }
      return null;
    }

    function otvBul(gtipKod) {
      if (!gtipKod || !OTV_DATA?.kayitlar) return null;
      const gt = kodTemiz(gtipKod);
      if (!gt) return null;
      for (const k of OTV_DATA.kayitlar) {
        const pref = k.gtip_prefix || [];
        if (pref.some(p => gt.startsWith(kodTemiz(p)))) {
          return {
            liste: k.liste || '',
            oran: k.oran ?? 0.42,
            ad_tr: k.ad_tr,
            ad_en: k.ad_en
          };
        }
      }
      return null;
    }

    function tevkifatBul(cpcKodu, gtipKodu) {
      if (!TEVKIFAT_DATA?.kayitlar) return null;

      const cp = cpcKodu ? kodTemiz(cpcKodu) : '';
      const gt = gtipKodu ? kodTemiz(gtipKodu) : '';

      if (cp) {
        for (const [prefix, kategori] of Object.entries(TEVKIFAT_KATEGORI_MAP)) {
          if (cp.startsWith(prefix)) {
            const kayit = TEVKIFAT_DATA.kayitlar.find(k => k.kategori === kategori);
            if (kayit) return kayit;
          }
        }
      }

      if (gt && gt.startsWith('99')) {
        const kayit = TEVKIFAT_DATA.kayitlar.find(k => k.kategori === 'yapim_isleri');
        if (kayit) return kayit;
      }

      return null;
    }

    function belgeleriBul(kaynak, kod) {
      const dosya = EK_VERI[kaynak]?.belge;
      if (!dosya?.kurallar?.length) return [];

      const prefixKey = kaynak + '_prefix';
      const kk = kodTemiz(kod);
      const eslesenler = [];

      for (const kural of dosya.kurallar) {
        for (const prefix of (kural[prefixKey] || [])) {
          const p = kodTemiz(prefix);
          if (p && kk.startsWith(p)) {
            eslesenler.push({ kural, prefixUzunlugu: p.length });
          }
        }
      }
      eslesenler.sort((a, b) => b.prefixUzunlugu - a.prefixUzunlugu);

      const gorulen = new Set();
      const belgeler = [];
      for (const es of eslesenler) {
        const grup = dosya.gruplar?.[es.kural.grup] || {};
        for (const belge of (es.kural.belgeler || [])) {
          if (gorulen.has(belge.kod)) continue;
          gorulen.add(belge.kod);
          belgeler.push({
            ...belge,
            _grup_adi_tr: grup.ad_tr,
            _grup_adi_en: grup.ad_en,
            _grup_ikon: grup.ikon,
          });
        }
      }

      const siralama = { zorunlu: 0, kosullu: 1, opsiyonel: 2 };
      belgeler.sort((a, b) => (siralama[a.seviye] ?? 9) - (siralama[b.seviye] ?? 9));
      return belgeler;
    }

    function randimanBul(kaynak, kod) {
      const dosya = EK_VERI[kaynak]?.randiman;
      if (!dosya?.kurallar?.length) return [];

      const prefixKey = kaynak + '_prefix';
      const kk = kodTemiz(kod);
      const eslesenler = [];

      for (const kural of dosya.kurallar) {
        for (const prefix of (kural[prefixKey] || [])) {
          const p = kodTemiz(prefix);
          if (p && kk.startsWith(p)) {
            eslesenler.push({ kural, prefixUzunlugu: p.length });
          }
        }
      }
      eslesenler.sort((a, b) => b.prefixUzunlugu - a.prefixUzunlugu);

      const sonuclar = [];
      const gorulen = new Set();

      for (const es of eslesenler) {
        const altOgeler = es.kural.randiman_kurallari || es.kural.verimlilik_gostergeleri || [];
        for (const alt of altOgeler) {
          let uyar = false;
          if (kaynak === 'gtip') {
            const girisKod = alt.gtip_girdi ? kodTemiz(alt.gtip_girdi) : '';
            const cikisKod = alt.gtip_cikti ? kodTemiz(alt.gtip_cikti) : '';
            if (girisKod && (kk.startsWith(girisKod) || girisKod.startsWith(kk))) uyar = true;
            if (!uyar && cikisKod && (kk.startsWith(cikisKod) || cikisKod.startsWith(kk))) uyar = true;
          } else if (kaynak === 'cpc') {
            const altPrefix = alt.cpc_prefix ? kodTemiz(alt.cpc_prefix) : '';
            if (!altPrefix || kk.startsWith(altPrefix)) uyar = true;
          } else {
            uyar = true;
          }
          if (!uyar) continue;
          const anahtar = alt.kod || alt.gosterge || JSON.stringify(alt);
          if (gorulen.has(anahtar)) continue;
          gorulen.add(anahtar);
          sonuclar.push(alt);
        }
      }
      return sonuclar;
    }

    function iliskiliKodlarBul(secilenKaynak, secilenKayit) {
      const ad = tr_lower(kayitAdi(secilenKayit));
      const kelimeler = ad.split(/[\s,;()/\-.]+/)
        .map(w => w.trim())
        .filter(w => w.length >= 4 && !/^\d+$/.test(w) && !STOP_WORDS.has(w));

      if (!kelimeler.length) return [];

      const kaynaklar = ['gtip', 'cpc', 'nace', 'isco'].filter(k => k !== secilenKaynak);
      const sonuc = [];

      for (const k of kaynaklar) {
        const eslesenler = [];
        for (const r of VERI[k].kayitlar) {
          const rAd = tr_lower(kayitAdi(r));
          if (kelimeler.some(w => rAd.includes(w))) {
            eslesenler.push(r);
            if (eslesenler.length >= 3) break;
          }
        }
        if (eslesenler.length) sonuc.push({ kaynak: k, kayitlar: eslesenler });
      }
      return sonuc;
    }

    // ============================================================
    // DROPDOWN
    // ============================================================
    function aramaYap() {
      const q = tr_lower($('arama').value.trim());
      const kaynaklar = AKTIF_FILTRE === 'hepsi' ? ['gtip', 'cpc', 'nace', 'isco'] : [AKTIF_FILTRE];
      const sonuclar = [];
      const LIMIT = 200;

      for (const k of kaynaklar) {
        for (const kayit of VERI[k].kayitlar) {
          if (!q) {
            sonuclar.push({ kaynak: k, kayit });
          } else {
            const kod = normKod(kayit.kod);
            const ad = tr_lower(kayitAdi(kayit));
            if (kod.includes(q) || ad.includes(q)) {
              sonuclar.push({ kaynak: k, kayit });
            }
          }
          if (sonuclar.length >= LIMIT) break;
        }
        if (sonuclar.length >= LIMIT) break;
      }
      dropdownCiz(sonuclar, q);
    }

    function dropdownCiz(sonuclar, q) {
      const dd = $('dropdown');
      const icerik = $('dropdown-icerik');

      if (q) $('btn-dropdown-temizle').classList.remove('hidden');
      else $('btn-dropdown-temizle').classList.add('hidden');

      if (!sonuclar.length) {
        if (!q) { dd.classList.add('hidden'); return; }
        dd.classList.remove('hidden');
        icerik.innerHTML = `
          <div class="p-6 text-center text-slate-500 text-xs">
            <div class="text-2xl mb-2">🔎</div>
            <p class="font-bold text-slate-400 mb-1">${t('sonuc_yok')}</p>
            <p>${t('sonuc_yok_p')}</p>
          </div>`;
        return;
      }

      dd.classList.remove('hidden');

      const gruplar = { gtip: [], cpc: [], nace: [], isco: [] };
      for (const s of sonuclar) gruplar[s.kaynak].push(s);

      let html = '';
      for (const kaynak of ['gtip', 'cpc', 'nace', 'isco']) {
        const g = gruplar[kaynak];
        if (!g.length) continue;
        const kartTip = KART_TIPI[kaynak];

        html += `
          <div class="px-2 pt-2 pb-1 text-[10px] font-bold tracking-wider text-slate-500 uppercase flex items-center gap-2">
            ${KAYNAK_IKON[kaynak]} ${KAYNAK_ETIKET[kaynak]}
            <span class="text-slate-600">· ${g.length}</span>
            <span class="text-slate-500 normal-case tracking-normal font-medium italic">· ${t(kartTip.baslikKey)}</span>
          </div>`;

        for (const s of g) {
          const kod = normKod(s.kayit.kod);
          const ad = kayitAdiKisa(s.kayit);
          const globalIdx = sonuclar.indexOf(s);
          html += `
            <button type="button" class="w-full text-left px-3 py-2 rounded-md hover:bg-win-hover transition flex items-start gap-2 dd-sonuc" data-idx="${globalIdx}">
              <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-bold tracking-wider border flex-none ${KAYNAK_SINIF[kaynak]}">${KAYNAK_IKON[kaynak]}</span>
              <div class="min-w-0 flex-1">
                <code class="block text-[11px] font-mono text-win-100 mb-0.5">${kacis(kod)}</code>
                <span class="block text-xs text-slate-300 truncate">${kacis(ad)}</span>
              </div>
            </button>`;
        }
      }

      icerik.innerHTML = html;
      icerik.querySelectorAll('.dd-sonuc').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          if (sonuclar[idx]) secimYap(sonuclar[idx]);
        });
      });
    }

    function dropdownKapat() {
      $('dropdown')?.classList.add('hidden');
    }

    async function secimYap(secim) {
      SECILI = secim;
      dropdownKapat();
      const { kaynak, kayit } = secim;
      await ekVeriYukle(kaynak);
      const iliskili = iliskiliKodlarBul(kaynak, kayit);
      kartCiz(secim, iliskili);
      $('arama').value = kayitAdi(kayit);
      $('btn-dropdown-temizle').classList.remove('hidden');
    }

    // ============================================================
    // KART ÇİZİMİ
    // ============================================================
    function kartCiz(secim, iliskili) {
      const bos = $('bos-durum');
      const alan = $('kart-alani');
      const grid = $('kart-grid');

      bos.classList.add('hidden');
      alan.classList.remove('hidden');

      let html = `<div class="bg-win-card border border-win-border rounded-xl overflow-hidden shadow-xl tablo-anim">`;
      html += birlesikTabloUret(secim, iliskili);
      html += iliskiliBlogu(iliskili);
      html += `</div>`;

      grid.innerHTML = html;

      grid.querySelectorAll('.iliskili-tikla').forEach(el => {
        el.addEventListener('click', () => {
          const k = el.dataset.kaynak;
          const kd = el.dataset.kod;
          const hedef = VERI[k].kayitlar.find(r => normKod(r.kod) === kd);
          if (hedef) {
            secimYap({ kaynak: k, kayit: hedef });
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      });
    }

    function birlesikTabloUret(secim, iliskili) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const ad = kayitAdi(kayit);
      const kartTip = KART_TIPI[kaynak];
      const satirlar = [];

      satirlar.push({ alan: `${KAYNAK_IKON[kaynak]} ${t(kartTip.baslikKey)}`, deger: t(kartTip.descKey), kurum: '', vurgu: 'baslik', _kaynak: kaynak });
      satirlar.push({ alan: t('meta_kod'), deger: kod, kurum: '', vurgu: 'kod' });
      satirlar.push({ alan: t('meta_ad'), deger: ad, kurum: '', vurgu: 'ad' });

      satirlar.push({ tip: 'baslik', metin: `${t(kartTip.baslikKey)} — ${t('alan_adi')}` });
      satirlar.push(...kaynakBazliAlanlar(secim, iliskili));

      // ─── VERGİ ───
      if (kartTip.kdvVar || kartTip.otvVar) {
        satirlar.push({ tip: 'baslik', metin: t('vergi') });

        // KDV
        if (kartTip.kdvVar) {
          let kdvSonuc = null;
          let kdvKaynakTipi = 'default';

          if (kayit.kdv_kodu) {
            const oran = oranBul(kayit.kdv_kodu);
            const k = KDV_DATA?.kayitlar?.find(x => x.kod === kayit.kdv_kodu);
            kdvSonuc = {
              oran,
              aciklama: k ? (alanSec(k, 'aciklama') || kayit.kdv_kodu) : kayit.kdv_kodu,
              liste: null
            };
            kdvKaynakTipi = 'kod';
          } else if (kaynak === 'gtip') {
            kdvSonuc = kdvBul(kod, null);
            if (kdvSonuc) kdvKaynakTipi = 'liste';
          } else if (kaynak === 'cpc') {
            kdvSonuc = kdvBul(null, kod);
            if (kdvSonuc) kdvKaynakTipi = 'liste';
          }

          if (!kdvSonuc) {
            kdvSonuc = { oran: 0.20, aciklama: t('kdv_genel'), liste: null };
            kdvKaynakTipi = 'default';
          }

          const kdvAciklamaMetin = kdvKaynakTipi === 'liste'
            ? `${kdvSonuc.liste}. ${t('kdv_listesi')} — ${kdvSonuc.aciklama}`
            : kdvSonuc.aciklama;

          satirlar.push({
            alan: t('kdv_orani'),
            deger: `%${(kdvSonuc.oran * 100).toFixed(0)}`,
            kurum: `${t('kurum_gib')} — ${kdvAciklamaMetin}`,
            vurgu: 'kdv'
          });
        }

        // ÖTV
        if (kartTip.otvVar) {
          const otv = otvBul(kod);
          if (otv) {
            const otvAd = dil() === 'en' ? (otv.ad_en || otv.ad_tr || '') : (otv.ad_tr || '');
            satirlar.push({
              alan: t('otv_orani'),
              deger: `%${(otv.oran * 100).toFixed(0)}`,
              kurum: `${t('kurum_gib')} — ${otv.liste}. ${t('kdv_listesi')}${otvAd ? ' (' + otvAd + ')' : ''}`,
              vurgu: 'otv'
            });
          } else {
            satirlar.push({
              alan: t('otv_orani'),
              deger: t('otv_muaf'),
              kurum: `${t('kurum_gib')} — ${t('otv_yok')}`,
              vurgu: 'muaf'
            });
          }
        } else if (kartTip.kdvVar) {
          satirlar.push({
            alan: t('otv_orani'),
            deger: t('otv_yok'),
            kurum: `${t('kurum_gib')} — Hizmetler yalnızca KDV'ye tabidir`,
            vurgu: 'muaf'
          });
        }

        // Tevkifat
        if (kaynak === 'cpc') {
          const tev = tevkifatBul(kod, null);
          if (tev) {
            const oranYuzde = `%${(tev.oran * 100).toFixed(0)}`;
            const tevAd = dil() === 'en' ? (tev.ad_en || tev.ad_tr) : tev.ad_tr;
            satirlar.push({
              alan: t('kdv_tevkifat_oran'),
              deger: oranYuzde,
              kurum: `${t('kurum_gib')} — ${tevAd}${tev.oran_kesir ? ' (' + tev.oran_kesir + ')' : ''} · ${t('tevkifat_uyari')}`,
              vurgu: 'otv'
            });
          }
        }

        if (kayit.kdv_tevkifat_kodu || kayit.tevkifat_kodu) {
          satirlar.push({
            alan: t('kdv_tevkifat_kod'),
            deger: kayit.kdv_tevkifat_kodu || kayit.tevkifat_kodu,
            kurum: t('kurum_gib')
          });
        }
      }

      // Randıman
      if (kartTip.randimanVar) {
        const kurallar = randimanBul(kaynak, kod);
        if (kurallar.length) {
          satirlar.push({
            tip: 'baslik',
            metin: (kaynak === 'gtip' ? t('randiman_baslik') : t('verimlilik_baslik')) + ` (${kurallar.length})`
          });
          for (const r of kurallar) {
            const kurumAd = r.kaynak_kod ? kurumAdi(r.kaynak_kod) : '';
            if (kaynak === 'gtip') {
              if (r.randiman_orani != null) {
                satirlar.push({ alan: `${r.urun || r.urun_grubu || ''} — ${t('randiman_oran')}`, deger: `%${(r.randiman_orani * 100).toFixed(1)}`, kurum: kurumAd, vurgu: r.randiman_orani >= 0.75 ? 'muaf' : '' });
              }
              if (r.fire_orani != null) {
                satirlar.push({ alan: `${r.urun || r.urun_grubu || ''} — ${t('fire_oran')}`, deger: `%${(r.fire_orani * 100).toFixed(1)}`, kurum: kurumAd, vurgu: r.fire_orani > 0.30 ? 'otv' : '' });
              }
            } else {
              const hedef = r.hedef_deger != null ? (r.hedef_deger < 10 ? `%${(r.hedef_deger * 100).toFixed(0)}` : String(r.hedef_deger)) : '—';
              satirlar.push({ alan: `${r.gosterge || ''} — ${t('hedef_deger')}`, deger: hedef, kurum: `${kurumAd}${r.birim ? ' · ' + r.birim : ''}` });
              if (r.alt_sinir != null || r.ust_sinir != null) {
                const alt = r.alt_sinir != null ? (r.alt_sinir < 10 ? `%${(r.alt_sinir * 100).toFixed(0)}` : String(r.alt_sinir)) : '—';
                const ust = r.ust_sinir != null ? (r.ust_sinir < 10 ? `%${(r.ust_sinir * 100).toFixed(0)}` : String(r.ust_sinir)) : '—';
                satirlar.push({ alan: `${r.gosterge || ''} — ${t('alt_sinir')} / ${t('ust_sinir')}`, deger: `${alt} — ${ust}`, kurum: kurumAd });
              }
            }
          }
        }
      }

      // Belgeler
      if (kartTip.belgeVar) {
        const belgeler = belgeleriBul(kaynak, kod);
        satirlar.push({ tip: 'baslik', metin: belgeler.length ? `${t('belge_baslik')} (${belgeler.length})` : t('belge_baslik') });
        if (!belgeler.length) {
          satirlar.push({ alan: '—', deger: t('belge_yok'), kurum: '' });
        } else {
          for (const b of belgeler) {
            const seviyeEtiket = b.seviye === 'zorunlu' ? t('belge_zorunlu') : b.seviye === 'kosullu' ? t('belge_kosullu') : t('belge_opsiyonel');
            const adMetin = dil() === 'en' ? (b.ad_en || b.ad_tr) : b.ad_tr;
            const kurumAd = kurumAdi(b.kurum_kod) || b.kurum || '—';
            const aciklama = dil() === 'en' ? (b.kosul_en || b.kosul_tr) : b.kosul_tr;
            satirlar.push({
              alan: `${adMetin} [${seviyeEtiket}]`,
              deger: aciklama || '—',
              kurum: kurumAd,
              vurgu: b.seviye === 'zorunlu' ? 'otv' : (b.seviye === 'kosullu' ? '' : 'muaf')
            });
          }
        }
      }

      return birlesikTabloCiz(satirlar);
    }

    function kaynakBazliAlanlar(secim, iliskili) {
      const { kaynak, kayit } = secim;
      const kod = normKod(kayit.kod);
      const adTR = kayit.tanim_tr || kayit.ad_tr || kayit.tanim || '';
      const adEN = kayit.tanim_en || kayit.ad_en || kayit.tanim || '';
      const satirlar = [];

      if (kaynak === 'gtip') {
        let naceKod = null;
        const ilN = iliskili.find(g => g.kaynak === 'nace');
        if (ilN && ilN.kayitlar.length) naceKod = normKod(ilN.kayitlar[0].kod);
        satirlar.push({ alan: t('gtip_kod'), deger: kod, kurum: `${t('kurum_ticaret')} / ${t('kurum_tuik')}` });
        satirlar.push({ alan: t('nace_kod'), deger: naceKod || '', kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('urun_ad_tr'), deger: adTR, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('urun_ad_en'), deger: adEN, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('olcu_birimi'), deger: kayit.olcu_birimi || '', kurum: t('kurum_ticaret') });
        const kp = kayit.kalite_parametreleri || kayit.kalite || [];
        if (kp[0] || kayit.kalite_1) satirlar.push({ alan: t('kalite_1'), deger: kp[0] || kayit.kalite_1, kurum: `${t('kurum_enerji')} / ${t('kurum_tse')}` });
        if (kp[1] || kayit.kalite_2) satirlar.push({ alan: t('kalite_2'), deger: kp[1] || kayit.kalite_2, kurum: t('kurum_cevre') });
        if (kp[2] || kayit.kalite_3) satirlar.push({ alan: t('kalite_3'), deger: kp[2] || kayit.kalite_3, kurum: t('kurum_cevre') });
        if (kayit.standart_kodu || kayit.zorunlu_standart) satirlar.push({ alan: t('zorunlu_standart'), deger: kayit.standart_kodu || kayit.zorunlu_standart, kurum: t('kurum_tse') });
        if (kayit.yasal_dayanak_urun) satirlar.push({ alan: t('yasal_dayanak_urun'), deger: kayit.yasal_dayanak_urun, kurum: t('kurum_enerji') });
        if (kayit.yasal_dayanak_vergi) satirlar.push({ alan: t('yasal_dayanak_vergi'), deger: kayit.yasal_dayanak_vergi, kurum: t('kurum_gib') });
        if (kayit.yasal_dayanak_gumruk) satirlar.push({ alan: t('yasal_dayanak_gumruk'), deger: kayit.yasal_dayanak_gumruk, kurum: t('kurum_ticaret') });
      }

      if (kaynak === 'cpc') {
        let naceKod = null;
        const ilN = iliskili.find(g => g.kaynak === 'nace');
        if (ilN && ilN.kayitlar.length) naceKod = normKod(ilN.kayitlar[0].kod);
        satirlar.push({ alan: t('cpc_kod'), deger: kod, kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('nace_kod'), deger: naceKod || '', kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('hizmet_ad_tr'), deger: adTR, kurum: t('kurum_ticaret') });
        satirlar.push({ alan: t('hizmet_ad_en'), deger: adEN, kurum: t('kurum_ticaret') });
        if (kayit.olcu_birimi) satirlar.push({ alan: t('olcu_birimi'), deger: kayit.olcu_birimi, kurum: t('kurum_tuik') });
        if (kayit.tolerans || kayit.sapma_limiti) satirlar.push({ alan: t('tolerans'), deger: kayit.tolerans || kayit.sapma_limiti, kurum: t('kurum_tobb') });
        if (kayit.tehlike_sinifi) satirlar.push({ alan: t('tehlike_sinifi'), deger: kayit.tehlike_sinifi, kurum: t('kurum_calisma') });
        if (kayit.zorunlu_sigorta) satirlar.push({ alan: t('zorunlu_sigorta'), deger: kayit.zorunlu_sigorta, kurum: t('kurum_seddk') });
        if (kayit.yasal_dayanak_hizmet) satirlar.push({ alan: t('yasal_dayanak_hizmet'), deger: kayit.yasal_dayanak_hizmet, kurum: t('kurum_calisma') });
        if (kayit.yasal_dayanak_vergi) satirlar.push({ alan: t('yasal_dayanak_vergi'), deger: kayit.yasal_dayanak_vergi, kurum: t('kurum_gib') });
      }

      if (kaynak === 'nace') {
        satirlar.push({ alan: t('nace_kod'), deger: kod, kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('faaliyet_ad_tr'), deger: adTR, kurum: t('kurum_tuik') });
        satirlar.push({ alan: t('faaliyet_ad_en'), deger: adEN, kurum: t('kurum_tuik') });
        if (kayit.seviye) satirlar.push({ alan: t('seviye'), deger: kayit.seviye, kurum: t('kurum_tuik') });
        if (kayit.seviye_adi) satirlar.push({ alan: t('seviye_adi'), deger: kayit.seviye_adi, kurum: t('kurum_tuik') });
        if (kayit.ust_kod) satirlar.push({ alan: t('ust_kod'), deger: kayit.ust_kod, kurum: t('kurum_tuik') });
        if (kayit.tehlike_sinifi) satirlar.push({ alan: t('tehlike_sinifi'), deger: kayit.tehlike_sinifi, kurum: `${t('kurum_calisma')} / ${t('kurum_isg')}` });
        if (kayit.yasal_dayanak) satirlar.push({ alan: t('yasal_dayanak_faaliyet'), deger: kayit.yasal_dayanak, kurum: t('kurum_tuik') });
      }

      if (kaynak === 'isco') {
        satirlar.push({ alan: t('isco_kod'), deger: kod, kurum: `${t('kurum_tuik')} / ${t('kurum_calisma')}` });
        satirlar.push({ alan: t('meslek_ad_tr'), deger: adTR, kurum: t('kurum_calisma') });
        satirlar.push({ alan: t('meslek_ad_en'), deger: adEN, kurum: t('kurum_calisma') });
        if (kayit.seviye) satirlar.push({ alan: t('seviye'), deger: kayit.seviye, kurum: t('kurum_tuik') });
        if (kayit.seviye_adi) satirlar.push({ alan: t('seviye_adi'), deger: kayit.seviye_adi, kurum: t('kurum_tuik') });
        if (kayit.ust_kod) satirlar.push({ alan: t('ust_kod'), deger: kayit.ust_kod, kurum: t('kurum_tuik') });
        if (kayit.gorev_tanimi) satirlar.push({ alan: t('gorev_tanimi'), deger: kayit.gorev_tanimi, kurum: t('kurum_calisma') });
        if (kayit.beceri_seviyesi) satirlar.push({ alan: t('beceri_seviyesi'), deger: kayit.beceri_seviyesi, kurum: t('kurum_tuik') });
        if (kayit.yasal_dayanak) satirlar.push({ alan: t('yasal_dayanak_meslek'), deger: kayit.yasal_dayanak, kurum: t('kurum_calisma') });
      }

      return satirlar;
    }

    function birlesikTabloCiz(satirlar) {
      const rowsHtml = satirlar.map(s => {
        if (s.tip === 'baslik') {
          return `<tr class="bg-win-dark/60 border-t border-win-border/40">
            <td colspan="3" class="px-4 py-2 text-[10px] font-bold uppercase tracking-wider text-win-400">${kacis(s.metin)}</td>
          </tr>`;
        }

        const bosMu = !s.deger || s.deger === t('belirtilmemis') || s.deger === '';

        if (s.vurgu === 'baslik') {
          return `<tr class="bg-win-dark/30">
            <td class="px-4 py-3 align-top">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-[11px] font-bold tracking-wider border ${KAYNAK_SINIF[s._kaynak || 'gtip']}">${kacis(s.alan)}</span>
            </td>
            <td class="px-4 py-3 align-top text-[11px] text-slate-500 italic" colspan="2">${kacis(s.deger)}</td>
          </tr>`;
        }
        if (s.vurgu === 'kod') {
          return `<tr class="bg-win-dark/20">
            <td class="px-4 py-2.5 align-top text-slate-400 text-xs font-semibold">${kacis(s.alan)}</td>
            <td class="px-4 py-2.5 align-top font-mono text-sm text-win-300 font-bold" colspan="2">${kacis(s.deger)}</td>
          </tr>`;
        }
        if (s.vurgu === 'ad') {
          return `<tr class="bg-win-dark/20 border-b border-win-border">
            <td class="px-4 py-3 align-top text-slate-400 text-xs font-semibold">${kacis(s.alan)}</td>
            <td class="px-4 py-3 align-top text-white font-bold text-base leading-snug" colspan="2">${kacis(s.deger)}</td>
          </tr>`;
        }

        const degerClass = s.vurgu === 'kdv' ? 'text-win-100 font-bold'
          : s.vurgu === 'otv' ? 'text-rose-400 font-bold'
            : s.vurgu === 'muaf' ? 'text-emerald-400 font-semibold'
              : 'text-slate-100';
        const degerGoster = bosMu ? '—' : s.deger;

        return `<tr class="hover:bg-win-hover/40 transition">
          <td class="px-4 py-2.5 align-top text-slate-300 text-xs font-medium">${kacis(s.alan)}</td>
          <td class="px-4 py-2.5 align-top font-mono text-xs ${bosMu ? 'text-slate-600 italic' : degerClass}">${kacis(degerGoster)}</td>
          <td class="px-4 py-2.5 align-top text-[11px] text-slate-500">${kacis(s.kurum || '')}</td>
        </tr>`;
      }).join('');

      return `
        <div class="overflow-x-auto border-b border-win-border">
          <table class="w-full text-left">
            <thead class="bg-win-hover border-b border-win-border text-slate-400 font-semibold uppercase tracking-wider text-[10px]">
              <tr>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('alan_adi')}</th>
                <th class="px-4 py-2.5">${t('deger')}</th>
                <th class="px-4 py-2.5 whitespace-nowrap">${t('kurum')}</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-win-border/40">
              ${rowsHtml}
            </tbody>
          </table>
        </div>`;
    }

    function iliskiliBlogu(iliskili) {
      if (!iliskili.length) {
        return `
          <div class="p-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center gap-2">
              🔗 ${t('iliskili')}
            </div>
            <div class="text-xs text-slate-500 py-3 text-center">${t('iliskili_yok')}</div>
          </div>`;
      }

      return `
        <div class="p-4">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2">
            🔗 ${t('iliskili')}
          </div>
          ${iliskili.map(grup => {
        const kartTip = KART_TIPI[grup.kaynak];
        return `
              <div class="mb-3 last:mb-0">
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                  <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold tracking-wider border ${KAYNAK_SINIF[grup.kaynak]}">
                    ${KAYNAK_IKON[grup.kaynak]} ${KAYNAK_ETIKET[grup.kaynak]}
                  </span>
                  <span class="text-[10px] text-slate-500 italic">${t(kartTip.baslikKey)}</span>
                  <span class="text-[10px] text-slate-600">· ${grup.kayitlar.length}</span>
                </div>
                <div class="space-y-1">
                  ${grup.kayitlar.map(r => {
          const rKod = normKod(r.kod);
          const rAd = kayitAdiKisa(r);
          return `
                      <div class="flex items-center gap-2 bg-win-base border border-win-border rounded px-3 py-2 hover:bg-win-hover hover:border-win-500/40 transition cursor-pointer iliskili-tikla" title="${t('iliskili_tikla')}" data-kaynak="${grup.kaynak}" data-kod="${kacis(rKod)}">
                        <code class="text-[11px] font-mono text-win-100 whitespace-nowrap">${kacis(rKod)}</code>
                        <span class="text-xs text-slate-300 truncate flex-1">${kacis(rAd)}</span>
                        <span class="text-[10px] text-win-400">→</span>
                      </div>`;
        }).join('')}
                </div>
              </div>`;
      }).join('')}
        </div>`;
    }

    // ============================================================
    // OLAYLAR
    // ============================================================
    document.addEventListener('pdaas:dil', () => {
      if (SECILI) {
        const iliskili = iliskiliKodlarBul(SECILI.kaynak, SECILI.kayit);
        kartCiz(SECILI, iliskili);
      }
    });

    let aramaZaman;
    $('arama').addEventListener('input', () => { clearTimeout(aramaZaman); aramaZaman = setTimeout(aramaYap, 180); });
    $('arama').addEventListener('focus', () => { if ($('arama').value.trim()) aramaYap(); });

    $('btn-dropdown-temizle').addEventListener('click', () => {
      $('arama').value = '';
      dropdownKapat();
      SECILI = null;
      $('btn-dropdown-temizle').classList.add('hidden');
      $('kart-alani').classList.add('hidden');
      $('kart-grid').innerHTML = '';
      $('bos-durum').classList.remove('hidden');
      $('bos-durum').innerHTML = `
        <div class="w-20 h-20 rounded-2xl bg-win-card border border-win-border text-win-500 flex items-center justify-center text-3xl mb-5 shadow-xl mx-auto">📋</div>
        <h2 class="text-xl font-bold text-white mb-2">${t('bos_baslik')}</h2>
        <p class="text-sm text-slate-400 leading-relaxed">${t('bos_aciklama')}</p>`;
      $('arama').focus();
    });

    $('filtreler').addEventListener('click', e => {
      const btn = e.target.closest('.cip');
      if (!btn) return;
      document.querySelectorAll('.cip').forEach(x => { x.classList.remove('bg-win-500', 'text-white'); x.classList.add('bg-win-dark', 'text-slate-300'); });
      btn.classList.add('bg-win-500', 'text-white');
      btn.classList.remove('bg-win-dark', 'text-slate-300');
      AKTIF_FILTRE = btn.dataset.tip;
      if ($('arama').value.trim()) aramaYap();
    });

    document.addEventListener('click', e => {
      const dd = $('dropdown');
      const aramaWrap = $('arama').parentElement;
      if (!dd.classList.contains('hidden') && !aramaWrap.contains(e.target)) dropdownKapat();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') dropdownKapat();
    });

    const scrollTopBtn = $('btn-scroll-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      else scrollTopBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
    });
    scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ============================================================
    // BAŞLAT
    // ============================================================
    tumVeriyiYukle();
  </script>
</body>

</html>
